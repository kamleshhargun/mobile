<!DOCTYPE html>

<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:15px;
  font-family:Arial,sans-serif;
  background:#f4f6f9;
}

.container{
  max-width:500px;
  margin:auto;
}

.card{
  background:#fff;
  border-radius:15px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

h2,h3{
  margin-top:0;
  text-align:center;
}

.mode-wrap{
  display:flex;
  gap:10px;
}

.mode-btn{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.active{
  background:#007bff;
  color:white;
}

.reader{
  width:100%;
}

#reader{
  width:100%;
}

.btn{
  width:100%;
  border:none;
  padding:12px;
  border-radius:10px;
  color:white;
  font-weight:bold;
  margin-top:8px;
  cursor:pointer;
}

.start{
  background:#28a745;
}

.stop{
  background:#dc3545;
}

.save{
  background:#007bff;
}

input{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-top:10px;
}

.stats{
  display:flex;
  gap:10px;
}

.stat{
  flex:1;
  background:#f7f7f7;
  padding:10px;
  border-radius:10px;
  text-align:center;
}

.stat span{
  display:block;
  font-size:22px;
  font-weight:bold;
}

.history-item{
  border-bottom:1px solid #eee;
  padding:10px 0;
}

.badge{
  display:inline-block;
  padding:3px 8px;
  border-radius:6px;
  font-size:12px;
  color:white;
}

.pickup{
  background:#28a745;
}

.return{
  background:#dc3545;
}

#status{
  text-align:center;
  margin-top:10px;
  font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<div class="card">
<h2>📦 AWB Scanner</h2>

<div class="mode-wrap">

<button
id="pickupBtn"
class="mode-btn active"
onclick="setMode('Pickup')">
Pickup </button>

<button
id="returnBtn"
class="mode-btn"
onclick="setMode('Return')">
Return </button>

</div>

</div>

<div class="card">

<div id="reader"></div>

<input
type="text"
id="awb"
placeholder="Scanned AWB"
readonly>

<button
class="btn start"
onclick="startScanner()">
Start Scanner </button>

<button
class="btn stop"
onclick="stopScanner()">
Stop Scanner </button>

<button
class="btn save"
onclick="saveAWB()">
Save AWB </button>

<div id="status">
Ready
</div>

</div>

<div class="card">

<h3>Dashboard</h3>

<div class="stats">

<div class="stat">
Today Pickup
<span id="todayPickup">0</span>
</div>

<div class="stat">
Today Return
<span id="todayReturn">0</span>
</div>

</div>

<br>

<div class="stats">

<div class="stat">
Total Pickup
<span id="totalPickup">0</span>
</div>

<div class="stat">
Total Return
<span id="totalReturn">0</span>
</div>

</div>

</div>

<div class="card">

<h3>Last 20 Scans</h3>

<div id="history">
Loading...
</div>

</div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyD1oqjBAQUGEVxki1OYeqhL0YGGegmo1TYOdzENbK_Bj3nTyLye_tti6HOm_JsZCW5/exec";

let currentMode = "Pickup";

let html5QrCode = null;

const beep =
new Audio(
"https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"
);

function setMode(mode){

  currentMode = mode;

  document
    .getElementById("pickupBtn")
    .classList.remove("active");

  document
    .getElementById("returnBtn")
    .classList.remove("active");

  if(mode==="Pickup"){
    document
      .getElementById("pickupBtn")
      .classList.add("active");
  }else{
    document
      .getElementById("returnBtn")
      .classList.add("active");
  }

}

function startScanner(){

  if(html5QrCode){
    stopScanner();
  }

  html5QrCode =
    new Html5Qrcode("reader");

  html5QrCode.start(
    {
      facingMode:"environment"
    },
    {
      fps:25,
      qrbox:{
        width:250,
        height:120
      }
    },

    function(decodedText){

      document
        .getElementById("awb")
        .value =
        decodedText;

      beep.play();

      stopScanner();

      document
        .getElementById("status")
        .innerText =
        "AWB Scanned";

    }

  ).catch(err=>{

    document
      .getElementById("status")
      .innerText =
      err;

  });

}

function stopScanner(){

  if(html5QrCode){

    html5QrCode
      .stop()
      .catch(()=>{});

  }

}

function saveAWB(){

  let awb =
    document
      .getElementById("awb")
      .value
      .trim();

  if(!awb){
    alert("Scan AWB First");
    return;
  }

  fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({

      type:currentMode,

      awb:awb

    })
  })
  .then(r=>r.json())
  .then(()=>{

    document
      .getElementById("status")
      .innerText =
      "Saved Successfully";

    document
      .getElementById("awb")
      .value = "";

    loadStats();
    loadHistory();

  });

}

function loadStats(){

  fetch(API_URL+"?type=stats")
  .then(r=>r.json())
  .then(d=>{

    document
      .getElementById("todayPickup")
      .innerText =
      d.todayPickup || 0;

    document
      .getElementById("todayReturn")
      .innerText =
      d.todayReturn || 0;

    document
      .getElementById("totalPickup")
      .innerText =
      d.totalPickup || 0;

    document
      .getElementById("totalReturn")
      .innerText =
      d.totalReturn || 0;

  });

}

function loadHistory(){

  fetch(API_URL+"?type=history")
  .then(r=>r.json())
  .then(data=>{

    let html = "";

    if(!data.length){

      html =
      "No Records Found";

    }else{

      data.forEach(row=>{

        html += `

        <div class="history-item">

        <b>${row.awb}</b>

        <br>

        <span class="badge ${
          row.type.toLowerCase()
        }">

        ${row.type}

        </span>

        <br>

        ${row.date}
        ${row.time}

        </div>

        `;

      });

    }

    document
      .getElementById("history")
      .innerHTML =
      html;

  });

}

loadStats();

loadHistory();

setInterval(function(){

  loadStats();
  loadHistory();

},5000);

</script>

</body>
</html>
