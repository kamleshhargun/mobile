<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>
Pickup Return System
</title>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
rel="stylesheet">

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#f5f7fb;
height:100vh;
overflow:hidden;
}

.header{
height:60px;
background:#fff;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:700;
color:#2563eb;
border-bottom:1px solid #e5e7eb;
}

.main{
height:calc(100vh - 60px);
display:grid;
grid-template-columns:
300px
1fr
350px;
gap:10px;
padding:10px;
}

.panel{
background:#fff;
border-radius:14px;
border:1px solid #e5e7eb;
overflow:hidden;
display:flex;
flex-direction:column;
}

.panel-header{
padding:12px;
font-weight:700;
border-bottom:1px solid #eee;
}

.left-content{
flex:1;
overflow:auto;
padding:10px;
}

.center-content{
padding:15px;
display:flex;
flex-direction:column;
gap:12px;
}

.right-content{
padding:10px;
height:100%;
}

.mode-row{
display:flex;
gap:10px;
}

.mode-btn{

flex:1;

height:50px;

border-radius:12px;

border:2px solid;

font-weight:700;

cursor:pointer;

background:#fff;
}

.pickup{
border-color:#2563eb;
color:#2563eb;
}

.return{
border-color:#14b8a6;
color:#14b8a6;
}

.active-pickup{
background:#2563eb;
color:#fff;
}

.active-return{
background:#14b8a6;
color:#fff;
}

.scan-panel{

display:none;

flex-direction:column;

gap:10px;

padding:12px;

border:1px solid #e5e7eb;

border-radius:12px;

background:#fafafa;
}

.input{

height:45px;

border:1px solid #d1d5db;

border-radius:10px;

padding:0 12px;

outline:none;
}

.input:focus{
border-color:#2563eb;
}

#reader{

display:none;

width:100%;
overflow:hidden;
border-radius:10px;
}

.result-card{

display:none;

padding:12px;

border-radius:10px;

border:1px solid #e5e7eb;

background:#fff;

font-size:13px;
}

.action-row{
display:flex;
gap:10px;
}

.btn{

flex:1;

height:45px;

border:none;

border-radius:10px;

font-weight:700;

cursor:pointer;
}

.btn-save{
background:#10b981;
color:white;
}

.btn-stop{
background:#ef4444;
color:white;
}

.btn-camera{
background:#2563eb;
color:white;
}

.btn-manual{
background:#6b7280;
color:white;
}

.search-box{
display:flex;
flex-direction:column;
gap:10px;
height:100%;
}

.search-result{
flex:1;
overflow:auto;
font-size:13px;
}

.card{

padding:12px;

border-radius:10px;

border:1px solid #e5e7eb;

background:#fff;

margin-bottom:10px;
}

.toast{

position:fixed;

bottom:20px;

left:50%;

transform:translateX(-50%);

background:#111;

color:#fff;

padding:10px 15px;

border-radius:10px;

z-index:9999;
}

</style>

</head>

<body>

<div class="header">

PICKUP RETURN SYSTEM

</div>

<div class="main">

<!-- LEFT -->

<div class="panel">

<div class="panel-header">

Dashboard

</div>

<div
id="dashboardArea"
class="left-content">

Loading...

</div>

</div>

<!-- CENTER -->

<div class="panel">

<div class="center-content">

<div class="mode-row">

<button
id="pickupBtn"
class="mode-btn pickup"
onclick="selectType('Pickup')">

Pickup

</button>

<button
id="returnBtn"
class="mode-btn return"
onclick="selectType('Return')">

Return

</button>

</div>

<div
id="scanPanel"
class="scan-panel">

<button
class="btn btn-camera"
onclick="startCamera()">

📷 Camera Scan

</button>

<button
class="btn btn-manual"
onclick="focusAWB()">

⌨ Manual / Scanner

</button>

<div id="reader"></div>

<input
id="awbInput"
class="input"
placeholder="Scan AWB">

<input
id="orderInput"
class="input"
placeholder="Order ID (Manual Fallback)">

<div
id="resultCard"
class="result-card">

</div>

<div class="action-row">

<button
class="btn btn-save"
onclick="saveEntry()">

Next

</button>

<button
class="btn btn-stop"
onclick="stopWork()">

Stop

</button>

</div>

</div>

</div>

</div>

<!-- RIGHT -->

<div class="panel">

<div class="panel-header">

Find Order

</div>

<div class="right-content">

<div class="search-box">

<input
id="searchInput"
class="input"
placeholder="Search AWB / Order ID">

<button
class="btn btn-camera"
onclick="searchOrder()">

Search

</button>

<div
id="searchResult"
class="search-result">

</div>

</div>

</div>

</div>

</div>

<script>

/* ===================================
CONFIG
=================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbyoLPsN-xHht7jAg-xL3-zN7CFVUmrYwqtjT8Drp9xb5xHsRhjitvjheoo8GiS2Dsf8/exec";

/* ===================================
GLOBAL
=================================== */

let currentType = "";

let currentTracking = null;

let html5QrCode = null;

const beep =
new Audio(
"https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"
);

</script>

</body>
</html>
