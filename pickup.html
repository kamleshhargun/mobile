<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWB Scanner Pro</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f4f7fb;color:#1f2937}
.container{max-width:1000px;margin:auto;padding:20px}
.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.top{display:flex;justify-content:space-between;align-items:center}
.badge{background:#dcfce7;color:#166534;padding:8px 14px;border-radius:999px;font-weight:600}
#reader{width:100%;margin-top:15px}
input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
button{border:none;padding:12px 18px;border-radius:12px;cursor:pointer;font-weight:600}
.primary{background:#2563eb;color:#fff}
.warn{background:#f59e0b;color:#fff}
.danger{background:#ef4444;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:15px}
.info{background:#fff;border-radius:14px;padding:12px;box-shadow:0 3px 10px rgba(0,0,0,.06)}
pre{white-space:pre-wrap;word-break:break-word}
 .json-card{
    margin-top:20px;
    background:#ffffff;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.json-toggle{
    width:100%;
    background:#eef4ff;
    color:#2563eb;
    border:none;
    padding:16px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    text-align:left;
}

#jsonBox{
    max-height:400px;
    overflow:auto;
    background:#0f172a;
}

#jsonView{
    margin:0;
    padding:15px;
    color:#22c55e;
    font-size:13px;
    line-height:1.6;
    font-family:Consolas, monospace;
}
</style>
</head>
<body>
<div class="container">
<div class="card">
<div class="top">
<h2>📦 AWB Scanner Pro</h2>
<div class="badge">ONLINE</div>
</div>

<div id="reader"></div>

<input id="awbInput" placeholder="Scan or enter AWB">
<div class="btns">
<button id="saveBtn" class="primary">SAVE NEW AWB</button>
<button id="stopBtn" class="danger">STOP</button>
</div>

<div class="json-card">
    <button class="json-toggle" onclick="toggleJson()">
        📄 View Complete API Response
    </button>

    <div id="jsonBox" style="display:none;">
        <pre id="jsonView"></pre>
    </div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbwbCfJYM4HvvqHegqJUqunjQE0aul6MpTOlvc8HFzfJw7w-eExQVQXKayjhb3ZSPuxSdw/exec";

function beep(freq,duration){
 const ctx=new(window.AudioContext||window.webkitAudioContext)();
 const osc=ctx.createOscillator();
 osc.frequency.value=freq;
 osc.connect(ctx.destination);
 osc.start();
 setTimeout(()=>{osc.stop();ctx.close();},duration);
}

function foundBeep(){beep(900,150)}
function errorBeep(){beep(250,300)}
function saveBeep(){beep(1200,120)}

let scanner;

async function processAWB(){
 const awb=document.getElementById('awbInput').value.trim();
 if(!awb){errorBeep();return;}

 try{
  const res=await fetch(API_URL,{
   method:'POST',
   body:JSON.stringify({awb})
  });
  const data=await res.json();

  if(!data.success){
    errorBeep();
    alert(data.message||'Not found');
    return;
  }

  foundBeep();

  const s=data.shipment;

  document.getElementById('saveBtn').textContent =
      data.action==='update' ? 'UPDATE AWB' : 'SAVE NEW AWB';

  document.getElementById('saveBtn').className =
      data.action==='update' ? 'warn' : 'primary';

  document.getElementById('details').innerHTML=`
    <div class="info"><b>AWB</b><br>${s.awb_number||''}</div>
    <div class="info"><b>Status</b><br>${s.status||''}</div>
    <div class="info"><b>Courier</b><br>${s.courier_name||''}</div>
    <div class="info"><b>Order</b><br>${s.order_number||''}</div>
    <div class="info"><b>Customer Order</b><br>${s.customer_order_number||''}</div>
    <div class="info"><b>Delivered</b><br>${s.delivered_date||''}</div>
  `;

  document.getElementById('jsonView').textContent =
      JSON.stringify(s,null,2);

  saveBeep();

 }catch(e){
  errorBeep();
  alert(e);
 }
}

document.getElementById('saveBtn').onclick=processAWB;

document.getElementById('stopBtn').onclick=()=>{
 if(scanner){scanner.stop();}
};

(async()=>{
 try{
  scanner=new Html5Qrcode("reader");
  await scanner.start(
   {facingMode:"environment"},
   {fps:10,qrbox:250},
   txt=>{
    document.getElementById('awbInput').value=txt;
    processAWB();
   }
  );
 }catch(e){console.log(e)}
})();
 function toggleJson(){

    const box=document.getElementById("jsonBox");

    if(box.style.display=="none"){
        box.style.display="block";
    }else{
        box.style.display="none";
    }

}
</script>
</body>
</html>
