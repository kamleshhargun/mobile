<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pickup / Return</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#f3f6fb;
padding:20px;
}

.center-content{
max-width:700px;
margin:auto;
display:flex;
flex-direction:column;
gap:12px;
}

.mode-row,
.action-row{
display:flex;
gap:10px;
}

.mode-btn{
flex:1;
height:50px;
border-radius:12px;
border:2px solid;
font-weight:700;
background:#fff;
cursor:pointer;
}

.pickup{
border-color:#2563eb;
color:#2563eb;
}

.return{
border-color:#14b8a6;
color:#14b8a6;
}

.active-pickup{
background:#2563eb;
color:#fff;
}

.active-return{
background:#14b8a6;
color:#fff;
}

.scan-panel{
display:flex;
flex-direction:column;
gap:10px;
padding:14px;
border:1px solid #e5e7eb;
border-radius:14px;
background:#fff;
}

.input{
height:46px;
padding:0 14px;
border:1px solid #dbe2ea;
border-radius:12px;
outline:none;
}

#reader{
display:none;
width:100%;
max-width:320px;
margin:auto;
overflow:hidden;
border-radius:12px;
}

.result-card{
display:none;
padding:14px;
border:1px solid #e5e7eb;
border-radius:14px;
background:#fff;
font-size:13px;
}

.btn{
border:none;
border-radius:12px;
padding:11px 16px;
font-size:14px;
font-weight:600;
cursor:pointer;
}

.btn-camera{
background:#2563eb;
color:#fff;
}

.btn-manual{
background:#475569;
color:#fff;
}

.btn-save{
background:#10b981;
color:#fff;
flex:1;
}

.btn-stop{
background:#ef4444;
color:#fff;
flex:1;
}

@media(max-width:768px){

.mode-row,
.action-row{
flex-direction:column;
}

}
</style>
</head>
<body>

<div class="center-content">

<div class="mode-row">
<button id="pickupBtn" class="mode-btn pickup">
Pickup
</button>

<button id="returnBtn" class="mode-btn return">
Return
</button>
</div>

<div id="scanPanel" class="scan-panel">

<button class="btn btn-camera" onclick="startCamera()">
📷 Camera Scan
</button>

<button class="btn btn-manual" onclick="focusAWB()">
⌨ Manual / Scanner
</button>

<div id="reader"></div>

<input
id="awbInput"
class="input"
placeholder="Scan AWB">

<input
id="orderInput"
class="input"
placeholder="Order ID (Manual Fallback)">

<div
id="resultCard"
class="result-card">
</div>

<div class="action-row">

<button
class="btn btn-save"
onclick="saveEntry()">
Next
</button>

<button
class="btn btn-stop"
onclick="stopWork()">
Stop
</button>

</div>

</div>

</div>

 <script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxE364kp1NqAiMCM-Pj2QxyoMMnCTZxLDr5yq6QAxUNZ0saq-SDIUMlBCftWXOUtDbu/exec";

const currentType = "Pickup";

let currentTracking = null;
let html5QrCode = null;
let isScanning = false;
let lastScannedCode = "";

const beep = new Audio(
"https://actions.google.com/sounds/v1/cartoon/pop.ogg"
);

/* =========================
TOAST
========================= */

function toast(msg){

const t=document.createElement("div");

t.className="toast";

t.innerText=msg;

document.body.appendChild(t);

setTimeout(()=>t.remove(),2000);

}

/* =========================
LOADER
========================= */

function showLoader(){

document.getElementById(
"loadingOverlay"
).style.display="flex";

}

function hideLoader(){

document.getElementById(
"loadingOverlay"
).style.display="none";

}

/* =========================
FOCUS
========================= */

function focusAWB(){

document.getElementById(
"awbInput"
).focus();

}

/* =========================
SUCCESS SOUND
========================= */

function playSuccessSound(){

try{

beep.currentTime=0;
beep.play();

}catch(e){}

}

/* =========================
CLEAR
========================= */

function clearForm(){

currentTracking=null;

document.getElementById(
"awbInput"
).value="";

document.getElementById(
"orderInput"
).value="";

document.getElementById(
"orderInput"
).style.display="none";

document.getElementById(
"resultCard"
).style.display="none";

document.getElementById(
"resultCard"
).innerHTML="";

}

/* =========================
CAMERA START
========================= */

async function startCamera(){

try{

if(isScanning) return;

if(html5QrCode){

await stopCamera();

}

document.getElementById(
"reader"
).style.display="block";

html5QrCode=
new Html5Qrcode(
"reader"
);

isScanning=true;

await html5QrCode.start(

{
facingMode:"environment"
},

{
fps:20,
qrbox:{
width:250,
height:250
}
},

async(decodedText)=>{

if(
decodedText===lastScannedCode
){
return;
}

lastScannedCode=
decodedText;

document.getElementById(
"awbInput"
).value=
decodedText.trim();

playSuccessSound();

await stopCamera();

trackShipment();

}

);

}catch(err){

console.error(err);

toast(
"Camera Error"
);

}

}

/* =========================
CAMERA STOP
========================= */

async function stopCamera(){

try{

if(html5QrCode){

await html5QrCode.stop();

await html5QrCode.clear();

}

}catch(err){}

html5QrCode=null;

isScanning=false;

document.getElementById(
"reader"
).style.display="none";

}

/* =========================
MANUAL ENTER
========================= */

document.getElementById(
"awbInput"
).addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){

e.preventDefault();

trackShipment();

}

}
);

/* =========================
TRACK LOADING
========================= */

function showTrackingLoading(){

const card=
document.getElementById(
"resultCard"
);

card.style.display="block";

card.innerHTML=
"Fetching Tracking...";

}

/* =========================
MANUAL ORDER
========================= */

function openManualOrder(){

currentTracking=null;

const card=
document.getElementById(
"resultCard"
);

card.style.display="block";

card.innerHTML=`

<div style="
color:#dc2626;
font-weight:700;
">

Tracking Not Found

</div>

<div style="
margin-top:8px;
">

Enter Order ID Manually

</div>

`;

document.getElementById(
"orderInput"
).style.display="block";

document.getElementById(
"orderInput"
).focus();

}

/* =========================
TRACK SHIPMENT
========================= */

async function trackShipment(){

const awb=

document.getElementById(
"awbInput"
)
.value
.trim();

if(!awb){

toast("Scan AWB");

return;

}

showTrackingLoading();

try{

const response=
await fetch(

`${API_URL}?action=trackShipment&awb=${encodeURIComponent(awb)}`,

{
method:"GET",
cache:"no-cache"
}

);

const result=
await response.json();

if(result.success){

currentTracking=result;

renderTracking(
result
);

return;

}

openManualOrder();

}catch(err){

console.error(err);

openManualOrder();

}

}

/* =========================
RENDER
========================= */

function renderTracking(data){

const card=
document.getElementById(
"resultCard"
);

card.style.display="block";

card.innerHTML=`

<b>AWB :</b>
${data.awb||""}<br>

<b>Order ID :</b>
${data.orderId||""}<br>

<b>Status :</b>
${data.status||""}<br>

<b>Courier :</b>
${data.courier||""}<br>

<b>Name :</b>
${data.customerName||""}<br>

<b>City :</b>
${data.city||""}

`;

document.getElementById(
"orderInput"
).style.display="none";

document.getElementById(
"orderInput"
).value=
data.orderId||"";

}

/* =========================
SAVE ENTRY
========================= */

async function saveEntry(){

const awb=
document.getElementById(
"awbInput"
)
.value
.trim();

if(!awb){

toast("AWB Missing");

return;

}

const payload={

type:currentType,

awb:awb,

orderId:
document.getElementById(
"orderInput"
).value.trim(),

courier:
currentTracking?.courier||"",

status:
currentTracking?.status||"",

customerName:
currentTracking?.customerName||"",

city:
currentTracking?.city||"",

state:
currentTracking?.state||"",

destination:
currentTracking?.destination||"",

pickupDate:
currentTracking?.pickupDate||"",

deliveredDate:
currentTracking?.deliveredDate||"",

expectedDate:
currentTracking?.expectedDate||
currentTracking?.estimatedDate||
"",

isRTO:
currentTracking?.isRTO||false

};

try{

showLoader();

const response=
await fetch(
API_URL,
{
method:"POST",
headers:{
"Content-Type":"text/plain;charset=utf-8"
},
body:JSON.stringify({
action:"saveEntry",
payload:payload
})
}
);

const result=
await response.json();

hideLoader();

if(result.duplicate){

toast(
"Duplicate AWB"
);

return;

}

if(!result.success){

toast(
result.message||
"Save Failed"
);

return;

}

let counts=
JSON.parse(
localStorage.getItem(
"todayCounts"
)||
'{"pickup":0,"return":0}'
);

counts.pickup++;

localStorage.setItem(
"todayCounts",
JSON.stringify(counts)
);

localStorage.setItem(
"pickupCount",
counts.pickup
);

playSuccessSound();

toast(
"Saved Successfully"
);

clearForm();

focusAWB();

}catch(err){

hideLoader();

console.error(err);

toast(
"Save Failed"
);

}

}

/* =========================
STOP WORK
========================= */

function stopWork(){

stopCamera();

clearForm();

focusAWB();

}

/* =========================
AUTO FOCUS
========================= */

window.onload=function(){

setTimeout(
focusAWB,
300
);

};

</script>
</body>
</html>
