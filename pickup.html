<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pickup / Return</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#f3f6fb;
padding:20px;
}

.center-content{
max-width:700px;
margin:auto;
display:flex;
flex-direction:column;
gap:12px;
}

.mode-row,
.action-row{
display:flex;
gap:10px;
}

.mode-btn{
flex:1;
height:50px;
border-radius:12px;
border:2px solid;
font-weight:700;
background:#fff;
cursor:pointer;
}

.pickup{
border-color:#2563eb;
color:#2563eb;
}

.return{
border-color:#14b8a6;
color:#14b8a6;
}

.active-pickup{
background:#2563eb;
color:#fff;
}

.active-return{
background:#14b8a6;
color:#fff;
}

.scan-panel{
display:flex;
flex-direction:column;
gap:10px;
padding:14px;
border:1px solid #e5e7eb;
border-radius:14px;
background:#fff;
}

.input{
height:46px;
padding:0 14px;
border:1px solid #dbe2ea;
border-radius:12px;
outline:none;
}

#reader{
display:none;
width:100%;
max-width:320px;
margin:auto;
overflow:hidden;
border-radius:12px;
}

.result-card{
display:none;
padding:14px;
border:1px solid #e5e7eb;
border-radius:14px;
background:#fff;
font-size:13px;
}

.btn{
border:none;
border-radius:12px;
padding:11px 16px;
font-size:14px;
font-weight:600;
cursor:pointer;
}

.btn-camera{
background:#2563eb;
color:#fff;
}

.btn-manual{
background:#475569;
color:#fff;
}

.btn-save{
background:#10b981;
color:#fff;
flex:1;
}

.btn-stop{
background:#ef4444;
color:#fff;
flex:1;
}

@media(max-width:768px){

.mode-row,
.action-row{
flex-direction:column;
}

}
</style>
</head>
<body>

<div class="center-content">

<div class="mode-row">
<button id="pickupBtn" class="mode-btn pickup">
Pickup
</button>

<button id="returnBtn" class="mode-btn return">
Return
</button>
</div>

<div id="scanPanel" class="scan-panel">

<button class="btn btn-camera" onclick="startCamera()">
📷 Camera Scan
</button>

<button class="btn btn-manual" onclick="focusAWB()">
⌨ Manual / Scanner
</button>

<div id="reader"></div>

<input
id="awbInput"
class="input"
placeholder="Scan AWB">

<input
id="orderInput"
class="input"
placeholder="Order ID (Manual Fallback)">

<div
id="resultCard"
class="result-card">
</div>

<div class="action-row">

<button
class="btn btn-save"
onclick="saveEntry()">
Next
</button>

<button
class="btn btn-stop"
onclick="stopWork()">
Stop
</button>

</div>

</div>

</div>

 <script>
  API_URL
currentType
currentTracking
toast()
showLoader()
hideLoader()
focusAWB()
clearForm()
startCamera()
stopCamera()
toggleTorch()
trackShipment()
showTrackingLoading()
openManualOrder()
renderTracking()
playSuccessSound()
saveEntry()
stopWork()
window.onload
 </script>
</body>
</html>
