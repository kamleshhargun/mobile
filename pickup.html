<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Pickup Entry</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,Arial,sans-serif;
}

body{
background:#ecfdf5;
min-height:100vh;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
}

.header{
text-align:center;
font-size:28px;
font-weight:700;
color:#065f46;
margin-bottom:20px;
}

.panel{
background:#fff;
border-radius:16px;
border:1px solid #d1fae5;
padding:20px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.button-row{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:15px;
}

.btn{
border:none;
border-radius:12px;
padding:12px 18px;
font-size:15px;
font-weight:600;
cursor:pointer;
}

.btn-camera{
background:#059669;
color:#fff;
}

.btn-manual{
background:#374151;
color:#fff;
}

.btn-save{
background:#10b981;
color:#fff;
flex:1;
}

.btn-stop{
background:#ef4444;
color:#fff;
flex:1;
}

.input{
width:100%;
height:48px;
padding:0 12px;
border:1px solid #d1d5db;
border-radius:12px;
outline:none;
margin-bottom:12px;
}

.input:focus{
border-color:#10b981;
}

#reader{
display:none;
width:100%;
overflow:hidden;
border-radius:12px;
margin-bottom:12px;
}

.result-card{
display:none;
padding:14px;
background:#f9fafb;
border:1px solid #e5e7eb;
border-radius:12px;
font-size:14px;
line-height:1.8;
margin-bottom:12px;
}

.action-row{
display:flex;
gap:10px;
}

.toast{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#111827;
color:white;
padding:10px 16px;
border-radius:10px;
z-index:99999;
}

#loadingOverlay{
display:none;
position:fixed;
top:0;
left:0;
right:0;
bottom:0;
background:rgba(255,255,255,.85);
z-index:99999;
align-items:center;
justify-content:center;
font-size:20px;
font-weight:700;
}

@media(max-width:600px){

.action-row{
flex-direction:column;
}

.btn-save,
.btn-stop{
width:100%;
}

}

</style>

</head>

<body>

<div class="container">

<div class="header">
Pickup Entry
</div>

<div class="panel">

<div class="button-row">

<button
class="btn btn-camera"
onclick="startCamera()">

📷 Camera Scan

</button>

<button
class="btn btn-manual"
onclick="focusAWB()">

⌨ Manual / Scanner

</button>

</div>

<div id="reader"></div>

<input
id="awbInput"
class="input"
placeholder="Scan AWB">

<input
id="orderInput"
class="input"
placeholder="Order ID (Manual Fallback)"
style="display:none">

<div
id="resultCard"
class="result-card">
</div>

<div class="action-row">

<button
class="btn btn-save"
onclick="saveEntry()">

Next

</button>

<button
class="btn btn-stop"
onclick="stopWork()">

Stop

</button>

</div>

</div>

</div>

<div id="loadingOverlay">
Loading...
</div>
<script>

/* ===================================
CONFIG
=================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbxE364kp1NqAiMCM-Pj2QxyoMMnCTZxLDr5yq6QAxUNZ0saq-SDIUMlBCftWXOUtDbu/exec";

/* ===================================
FIXED TYPE
=================================== */

const currentType = "Pickup";

/* ===================================
GLOBAL
=================================== */

let currentTracking = null;

let html5QrCode = null;

/* New Success Sound */

const beep =
new Audio(
"https://actions.google.com/sounds/v1/cartoon/pop.ogg"
);

/* ===================================
FOCUS AWB
=================================== */

function focusAWB(){

 document
 .getElementById("awbInput")
 .focus();

}

/* ===================================
TOAST
=================================== */

function toast(msg){

 const t =
 document.createElement("div");

 t.className = "toast";

 t.innerText = msg;

 document.body.appendChild(t);

 setTimeout(
 ()=>{
   t.remove();
 },
 2000
 );

}

/* ===================================
LOADER
=================================== */

function showLoader(){

 document
 .getElementById(
 "loadingOverlay"
 )
 .style.display =
 "flex";

}

function hideLoader(){

 document
 .getElementById(
 "loadingOverlay"
 )
 .style.display =
 "none";

}

/* ===================================
CLEAR FORM
=================================== */

function clearForm(){

 currentTracking = null;

 document
 .getElementById("awbInput")
 .value = "";

 document
 .getElementById("orderInput")
 .value = "";

 document
 .getElementById("orderInput")
 .style.display = "none";

 document
 .getElementById("resultCard")
 .style.display = "none";

 document
 .getElementById("resultCard")
 .innerHTML = "";

}

/* ===================================
START CAMERA
=================================== */

async function startCamera(){

 try{

   if(html5QrCode){

     await stopCamera();

   }

   document
   .getElementById("reader")
   .style.display =
   "block";

   html5QrCode =
   new Html5Qrcode(
   "reader"
   );

   await html5QrCode.start(

   {
     facingMode:
     "environment"
   },

   {
     fps:20,

     qrbox:{
       width:280,
       height:140
     }
   },

   function(decodedText){

     document
     .getElementById("awbInput")
     .value =
     decodedText;

     playSuccessSound();

     stopCamera();

     trackShipment();

   }

   );

 }catch(err){

   console.log(err);

   toast(
   "Camera Error"
   );

 }

}

/* ===================================
STOP CAMERA
=================================== */

async function stopCamera(){

 try{

   if(html5QrCode){

     await html5QrCode.stop();

     await html5QrCode.clear();

     html5QrCode = null;

   }

 }catch(err){}

 document
 .getElementById("reader")
 .style.display =
 "none";

}

/* ===================================
USB SCANNER
=================================== */

let scannerBuffer = "";

document.addEventListener(
"keydown",
function(e){

 if(
 document.activeElement.id
 !== "awbInput"
 ){
   return;
 }

 if(e.key === "Enter"){

   e.preventDefault();

   const awb =
   scannerBuffer.trim();

   if(awb.length > 5){

     document
     .getElementById(
     "awbInput"
     )
     .value = awb;

     trackShipment();

   }

   scannerBuffer = "";

   return;
 }

 if(e.key.length === 1){

   scannerBuffer += e.key;

 }

}
);

/* ===================================
MANUAL ENTER
=================================== */

document
.getElementById(
"awbInput"
)
.addEventListener(
"keydown",
function(e){

 if(e.key === "Enter"){

   trackShipment();

 }

}
);

/* ===================================
TRACK SHIPMENT
=================================== */

async function trackShipment(){

 const awb =

 document
 .getElementById(
 "awbInput"
 )
 .value
 .trim();

 if(!awb){

   toast(
   "Scan AWB"
   );

   return;

 }

 showTrackingLoading();

 try{

   const response =

   await fetch(

   API_URL +

   "?action=trackShipment&awb=" +

   encodeURIComponent(
   awb
   )

   );

   const result =

   await response.json();

   if(result.success){

     currentTracking =
     result;

     renderTracking(
     result
     );

     return;

   }

   openManualOrder();

 }catch(err){

   console.log(err);

   openManualOrder();

 }

}
/* ===================================
TRACKING LOADING
=================================== */

function showTrackingLoading(){

const card =
document.getElementById(
"resultCard"
);

card.style.display =
"block";

card.innerHTML =
"Fetching Tracking...";

}

/* ===================================
MANUAL ORDER MODE
=================================== */

function openManualOrder(){

currentTracking = null;

const card =
document.getElementById(
"resultCard"
);

card.style.display =
"block";

card.innerHTML = `

 <div style="
 color:#dc2626;
 font-weight:700;
 ">

Tracking Not Found

 </div>

 <div style="
 margin-top:8px;
 ">

Enter Order ID Manually

 </div>

`;

document
.getElementById(
"orderInput"
)
.style.display =
"block";

document
.getElementById(
"orderInput"
)
.focus();

}

/* ===================================
RENDER TRACKING
=================================== */

function renderTracking(data){

const card =
document.getElementById(
"resultCard"
);

card.style.display =
"block";

card.innerHTML = `

<b>AWB :</b>
${data.awb || ""} <br>

<b>Order ID :</b>
${data.orderId || ""} <br>

<b>Status :</b>
${data.status || ""} <br>

<b>Courier :</b>
${data.courier || ""} <br>

<b>Name :</b>
${data.customerName || ""} <br>

<b>City :</b>
${data.city || ""}

`;

document
.getElementById(
"orderInput"
)
.value =
data.orderId || "";

}

/* ===================================
SUCCESS SOUND
=================================== */

function playSuccessSound(){

try{

beep.currentTime = 0;

beep.play();

}catch(err){}

}

/* ===================================
SAVE ENTRY
=================================== */

async function saveEntry(){

const awb =

document
.getElementById(
"awbInput"
)
.value
.trim();

if(!awb){

toast(
"AWB Missing"
);

return;

}

const payload = {

type:
currentType,

awb:
awb,

orderId:

document
.getElementById(
"orderInput"
)
.value
.trim(),

courier:
currentTracking?.courier || "",

status:
currentTracking?.status || "",

customerName:
currentTracking?.customerName || "",

city:
currentTracking?.city || "",

state:
currentTracking?.state || "",

destination:
currentTracking?.destination || "",

pickupDate:
currentTracking?.pickupDate || "",

deliveredDate:
currentTracking?.deliveredDate || "",

expectedDate:

currentTracking?.expectedDate ||

currentTracking?.estimatedDate ||

"",

isRTO:
currentTracking?.isRTO || false

};

try{

showLoader();

const response =

await fetch(

API_URL,

{

method:"POST",

headers:{

"Content-Type":
"text/plain;charset=utf-8"

},

body:JSON.stringify({

action:
"saveEntry",

payload:
payload

})

}

);

const text =

await response.text();

let result = {};

try{

 result =
 JSON.parse(text);

}catch(err){

 hideLoader();

 toast(
 "Invalid Server Response"
 );

 return;
```

}

hideLoader();

if(result.duplicate){

 toast(
 "Duplicate AWB"
 );

 document
 .getElementById(
 "awbInput"
 )
 .select();

 return;

}

if(!result.success){

 toast(

 result.message ||

 "Save Failed"

 );

 return;

}

playSuccessSound();

toast(
"Saved Successfully"
);

clearForm();

document
.getElementById(
"awbInput"
)
.focus();

}catch(err){

hideLoader();

console.log(err);

toast(
"Save Failed"
);

}

}
let counts =
JSON.parse(
localStorage.getItem("todayCounts") ||
'{"pickup":0,"return":0}'
);

counts.pickup++;

localStorage.setItem(
"todayCounts",
JSON.stringify(counts)
);

/* ===================================
STOP
=================================== */

function stopWork(){

stopCamera();

clearForm();

focusAWB();

}

/* ===================================
AUTO FOCUS
=================================== */

window.onload = function(){

setTimeout(()=>{

document
.getElementById(
"awbInput"
)
.focus();

},300);

};

</script>

</body>
</html>
