<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pickup Return Scanner</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a,#1e293b)}.app{width:min(760px,96%);background:#fff;border-radius:24px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}h1{text-align:center;margin-bottom:20px}.row{display:flex;gap:10px}.btn{flex:1;border:none;border-radius:12px;padding:14px;font-weight:700;cursor:pointer}.pickup{background:#2563eb;color:#fff}.return{background:#14b8a6;color:#fff}.action{background:#111827;color:#fff}.save{background:#10b981;color:#fff}.stop{background:#ef4444;color:#fff}.input{width:100%;padding:14px;border:1px solid #d1d5db;border-radius:12px;margin-top:10px}.card{margin-top:12px;padding:14px;border:1px solid #e5e7eb;border-radius:12px;background:#f8fafc}#reader{display:none;margin-top:10px}@media(max-width:768px){.row{flex-direction:column}}
</style></head>
<body>
<div class="app">
<h1>Pickup & Return Scanner</h1>
<div class="row">
<button id="pickupBtn" class="btn pickup" onclick="selectType('Pickup')">Pickup</button>
<button id="returnBtn" class="btn return" onclick="selectType('Return')">Return</button>
</div>
<div class="row" style="margin-top:10px">
<button class="btn action" onclick="startCamera()">📷 Camera Scan</button>
<button class="btn action" onclick="focusAWB()">⌨ Manual / Scanner</button>
</div>
<div id="reader"></div>
<input id="awbInput" class="input" placeholder="Scan AWB">
<input id="orderInput" class="input" placeholder="Order ID (Fallback)">
<div id="resultCard" class="card">Tracking details will appear here.</div>
<div class="row" style="margin-top:12px">
<button class="btn save" onclick="saveEntry()">Save & Next</button>
<button class="btn stop" onclick="stopWork()">Stop Session</button>
</div>
</div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbzCx2cLgXw_rgA0T8_dgfAqRAGtTpBsIhM-xeysJcCbbrpn7mH0g1g13Au4KpiCPH8/exec";

let currentType="";
let currentTracking=null;

function selectType(type){
  currentType=type;
  document.getElementById("resultCard").innerHTML=
  "<b>Mode:</b> "+type+" Selected";
}

function focusAWB(){
  document.getElementById("awbInput").focus();
}

function startCamera(){
  alert("Camera scanner integration ke liye apna existing html5-qrcode code paste karein.");
}

function renderTracking(data){
  document.getElementById("resultCard").innerHTML=`
    <b>AWB:</b> ${data.awb||""}<br>
    <b>Order ID:</b> ${data.orderId||""}<br>
    <b>Status:</b> ${data.status||""}<br>
    <b>Courier:</b> ${data.courier||""}<br>
    <b>Name:</b> ${data.customerName||""}<br>
    <b>City:</b> ${data.city||""}
  `;
}

async function trackShipment(){

  const awb=document.getElementById("awbInput").value.trim();

  if(!awb){
    alert("Enter AWB");
    return;
  }

  document.getElementById("resultCard").innerHTML=
  "Fetching Tracking...";

  try{

    const response=await fetch(
      API_URL+
      "?action=trackShipment&awb="+
      encodeURIComponent(awb)
    );

    const result=await response.json();

    if(result.success){
      currentTracking=result;
      renderTracking(result);
      return;
    }

    document.getElementById("resultCard").innerHTML=
    "Tracking Not Found";

  }catch(err){

    document.getElementById("resultCard").innerHTML=
    "Tracking Error";

  }

}

document.getElementById("awbInput")
.addEventListener("keydown",function(e){

  if(e.key==="Enter"){
    trackShipment();
  }

});

async function saveEntry(){

  if(!currentType){
    alert("Select Pickup or Return");
    return;
  }

  const awb=document.getElementById("awbInput")
  .value.trim();

  if(!awb){
    alert("Enter AWB");
    return;
  }

  const payload={

    type:currentType,

    awb:awb,

    orderId:document.getElementById("orderInput")
    .value.trim(),

    courier:currentTracking?.courier||"",

    status:currentTracking?.status||"",

    customerName:currentTracking?.customerName||"",

    city:currentTracking?.city||"",

    state:currentTracking?.state||"",

    destination:currentTracking?.destination||"",

    pickupDate:currentTracking?.pickupDate||"",

    deliveredDate:currentTracking?.deliveredDate||"",

    expectedDate:
    currentTracking?.expectedDate||
    currentTracking?.estimatedDate||
    "",

    isRTO:currentTracking?.isRTO||false

  };

  try{

    const response=await fetch(API_URL,{
      method:"POST",
      headers:{
        "Content-Type":"text/plain;charset=utf-8"
      },
      body:JSON.stringify({
        action:"saveEntry",
        payload:payload
      })
    });

    const result=await response.json();

    if(result.success){

      alert("Saved Successfully");

      document.getElementById("awbInput").value="";
      document.getElementById("orderInput").value="";

      currentTracking=null;

      document.getElementById("resultCard").innerHTML=
      "Tracking details will appear here.";

      focusAWB();

    }else{

      alert(result.message||"Save Failed");

    }

  }catch(err){

    alert("Save Failed");

  }

}

function stopWork(){

  currentType="";
  currentTracking=null;

  document.getElementById("awbInput").value="";
  document.getElementById("orderInput").value="";

  document.getElementById("resultCard").innerHTML=
  "Session Stopped";

}

window.onload=function(){
  focusAWB();
};
</script>
</body></html>
