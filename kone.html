
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pickup / Return Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1d4ed8);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:10px;
}

.container{
    position:relative;
    width:100%;
    max-width:650px;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(14px);
    border-radius:22px;
    padding:18px;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
}

/* Date */

#entryDate{
    width:100%;
    margin-bottom:12px;
}

/* Pickup Return */

.header{
    display:flex;
    gap:12px;
    margin-bottom:12px;
}

.modeBtn{
    flex:1;
    height:55px;
    border:none;
    border-radius:14px;
    background:rgba(255,255,255,.18);
    color:#fff;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    transition:.3s;
}

.modeBtn:hover{
    transform:translateY(-2px);
}

.modeBtn.active{
    background:#22c55e;
    box-shadow:0 0 18px rgba(34,197,94,.5);
}

/* Camera */

#reader{
    width:100%;
    height:280px;
    background:#000;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(0,0,0,.35);
}

/* Flash Button */

#flashBtn{
    position:absolute;
    top:92px;
    right:28px;
    width:135px;
    height:42px;
    border:none;
    border-radius:12px;
    background:#f59e0b;
    color:#fff;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    z-index:9999;
    transition:.25s;
}

#flashBtn:hover{
    transform:scale(1.05);
}

/* Loader */

.loader{
    display:none;
    text-align:center;
    color:#fff;
    font-size:17px;
    font-weight:bold;
    margin:14px 0;
}

/* Card */

.card{
    margin-top:18px;
    background:#fff;
    border-radius:20px;
    padding:20px;
    box-shadow:0 8px 22px rgba(0,0,0,.15);
}

/* Label */

.label{
    margin-top:12px;
    margin-bottom:5px;
    color:#475569;
    font-weight:600;
    font-size:14px;
}

/* Input */

.inputBox{
    width:100%;
    height:54px;
    border:2px solid #e2e8f0;
    border-radius:14px;
    padding:0 14px;
    font-size:17px;
    outline:none;
    transition:.2s;
}

.inputBox:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 4px rgba(37,99,235,.15);
}

/* Buttons */

.buttonArea{
    display:flex;
    gap:12px;
    margin-top:22px;
}

.buttonArea button{
    flex:1;
    height:58px;
    border:none;
    border-radius:14px;
    color:#fff;
    font-size:28px;
    cursor:pointer;
    transition:.25s;
}

.buttonArea button:hover{
    transform:translateY(-2px);
}

.saveBtn{
    background:#16a34a;
}

.cancelBtn{
    background:#dc2626;
}

/* Mobile */

@media(max-width:600px){

    .container{
        padding:12px;
    }

    #reader{
        height:220px;
    }

    #flashBtn{
        top:84px;
        right:18px;
        width:115px;
        height:38px;
        font-size:13px;
    }

    .modeBtn{
        height:48px;
        font-size:15px;
    }

    .inputBox{
        height:48px;
        font-size:15px;
    }

    .buttonArea button{
        height:52px;
        font-size:22px;
    }

}

</style>
</head>

<body>

<div class="container">

    <input
        type="date"
        id="entryDate"
        class="inputBox">

    <div class="header">

        <button
            id="pickupBtn"
            class="modeBtn"
            onclick="selectMode('Pickup')">
            📦 Pickup
        </button>

        <button
            id="returnBtn"
            class="modeBtn"
            onclick="selectMode('Return')">
            🔄 Return
        </button>

    </div>

    <div id="reader"></div>

    <button
        id="flashBtn"
        onclick="toggleFlash()">
        🔦 Flash
    </button>

    <div id="loading" class="loader">
        🔍 Searching Order...
    </div>

    <div id="entryCard" class="card">

        <div class="label">
            AWB Number
        </div>

        <input
            id="awbInput"
            class="inputBox"
            type="text"
            placeholder="Scan / Enter AWB Number"
            autocomplete="off"
            onkeypress="checkAWBEnter(event)">

        <div class="label">
            Order ID
        </div>

        <input
            id="orderInput"
            class="inputBox"
            type="text"
            placeholder="Auto Fetch or Enter Order ID"
            autocomplete="off">

        <div class="buttonArea">

            <button
                class="saveBtn"
                type="button"
                onclick="saveScan()">
                ✅
            </button>

            <button
                class="cancelBtn"
                type="button"
                onclick="cancelScan()">
                ❌
            </button>

        </div>

    </div>

</div>

</body>
<script>

const API_URL = "https://script.google.com/macros/s/AKfycby_oCiGW-EetxRtGOtyavwnl1OxbCuV24YroM0PVzV5J77CQ41d3VSk7Kd7PHtilpqO/exec";

let scanner = null;
let cameraRunning = false;
let flashOn = false;
let currentType = "";
let currentAWB = "";
let currentOrder = "";
let torchSupported = false;

/* ==========================================
   MODE SELECT
========================================== */

function selectMode(type){

    currentType = type;

    document.getElementById("pickupBtn").classList.remove("active");
    document.getElementById("returnBtn").classList.remove("active");

    if(type==="Pickup"){
        document.getElementById("pickupBtn").classList.add("active");
    }else{
        document.getElementById("returnBtn").classList.add("active");
    }

    startCamera();

}

/* ==========================================
   START CAMERA
========================================== */

async function startCamera(){

    if(cameraRunning){
        return;
    }

    try{

        document.getElementById("reader").innerHTML="";

        scanner = new Html5Qrcode("reader");

        await scanner.start(

            {
                facingMode:{
                    exact:"environment"
                }
            },

            {

                fps:10,

                qrbox:{
                    width:280,
                    height:120
                },

                aspectRatio:1.777

            },

            onScanSuccess

        );

        cameraRunning = true;

        flashOn = false;

        document.getElementById("flashBtn").innerText="🔦 Flash ON";

        try{

            if(scanner.getRunningTrackSettings){

                torchSupported = true;

            }else{

                torchSupported = false;

            }

        }catch(e){

            torchSupported = false;

        }

    }catch(err){

        console.log(err);

        try{

            await scanner.start(

                {facingMode:"environment"},

                {

                    fps:10,

                    qrbox:{
                        width:280,
                        height:120
                    }

                },

                onScanSuccess

            );

            cameraRunning=true;

        }catch(e){

            alert("Camera Start Failed");

            console.log(e);

        }

    }

}

/* ==========================================
   FLASH
========================================== */

async function toggleFlash(){

    if(!cameraRunning || !scanner){

        alert("Camera not running");

        return;

    }

    try{

        if(!flashOn){

            await scanner.applyVideoConstraints({

                advanced:[
                    {
                        torch:true
                    }
                ]

            });

            flashOn=true;

            document.getElementById("flashBtn").innerText="🔦 Flash OFF";

        }else{

            await scanner.applyVideoConstraints({

                advanced:[
                    {
                        torch:false
                    }
                ]

            });

            flashOn=false;

            document.getElementById("flashBtn").innerText="🔦 Flash ON";

        }

    }catch(err){

        console.log(err);

        alert("Torch not supported on this device/browser");

    }

}

/* ==========================================
   STOP CAMERA
========================================== */

async function stopCamera(){

    if(!cameraRunning || !scanner){
        return;
    }

    try{

        await scanner.stop();

        await scanner.clear();

    }catch(e){

        console.log(e);

    }

    cameraRunning=false;

    flashOn=false;

    document.getElementById("flashBtn").innerText="🔦 Flash ON";

    scanner=null;

}
    /* ==========================================
   SCAN SUCCESS
========================================== */

async function onScanSuccess(decodedText){

    if(!cameraRunning){
        return;
    }

    await stopCamera();

    currentAWB = decodedText.trim();

    document.getElementById("awbInput").value = currentAWB;
    document.getElementById("orderInput").value = "";

    document.getElementById("loading").style.display = "block";

    try{

        const response = await fetch(

            API_URL +
            "?action=track&awb=" +
            encodeURIComponent(currentAWB)

        );

        const data = await response.json();

        document.getElementById("loading").style.display = "none";

        if(data.success){

            currentOrder = data.orderId || "";

            document.getElementById("orderInput").value = currentOrder;

        }else{

            document.getElementById("orderInput").focus();

        }

    }catch(err){

        console.log(err);

        document.getElementById("loading").style.display = "none";

        alert("Tracking Failed\nEnter Order ID Manually");

        document.getElementById("orderInput").focus();

    }

}

/* ==========================================
   SAVE
========================================== */

async function saveScan(){

    if(currentType===""){

        alert("Select Pickup / Return");

        return;

    }

    currentAWB = document
        .getElementById("awbInput")
        .value
        .trim();

    currentOrder = document
        .getElementById("orderInput")
        .value
        .trim();

    if(currentAWB===""){

        alert("AWB Number Missing");

        return;

    }

    if(currentOrder===""){

        alert("Enter Order ID");

        return;

    }

    const payload={

        action:"save",

        type:currentType,

        awb:currentAWB,

        orderId:currentOrder,

        date:document.getElementById("entryDate").value

    };

    try{

        document.getElementById("loading").style.display="block";

        const response = await fetch(

            API_URL,

            {

                method:"POST",

                headers:{

                    "Content-Type":"text/plain;charset=utf-8"

                },

                body:JSON.stringify(payload)

            }

        );

        const result = await response.json();

        document.getElementById("loading").style.display="none";

        if(result.success){

            alert("Saved Successfully");

            await resetScanner();

            return;

        }

        if(result.duplicate){

            alert(

                "Duplicate Found\n\n" +

                "Order ID : " + result.orderId +

                "\nDate : " + result.date

            );

            await resetScanner();

            return;

        }

        alert(result.message || "Save Failed");

    }catch(err){

        document.getElementById("loading").style.display="none";

        console.log(err);

        alert("Save Failed");

    }

}

/* ==========================================
   CANCEL
========================================== */

async function cancelScan(){

    await resetScanner();

}

/* ==========================================
   RESET
========================================== */

async function resetScanner(){

    currentAWB="";

    currentOrder="";

    flashOn=false;

    document.getElementById("awbInput").value="";

    document.getElementById("orderInput").value="";

    document.getElementById("loading").style.display="none";

    document.getElementById("flashBtn").innerText="🔦 Flash ON";

    await stopCamera();

    if(currentType!==""){

        setTimeout(()=>{

            startCamera();

        },300);

    }

}
    /* ==========================================
   PAGE LOAD
========================================== */

window.onload = function(){

    const today = new Date();

    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2,"0");
    const dd = String(today.getDate()).padStart(2,"0");

    document.getElementById("entryDate").value =
        `${yyyy}-${mm}-${dd}`;

    document.getElementById("flashBtn").innerText = "🔦 Flash ON";

};

/* ==========================================
   MANUAL AWB SEARCH
========================================== */

async function checkAWBEnter(event){

    if(event.key !== "Enter"){
        return;
    }

    if(currentType === ""){

        alert("Please Select Pickup or Return First");

        document.getElementById("awbInput").value="";

        return;

    }

    const awb = document
        .getElementById("awbInput")
        .value
        .trim();

    if(awb===""){
        return;
    }

    currentAWB = awb;

    document.getElementById("orderInput").value="";

    document.getElementById("loading").style.display="block";

    try{

        const response = await fetch(

            API_URL +
            "?action=track&awb=" +
            encodeURIComponent(currentAWB)

        );

        const data = await response.json();

        document.getElementById("loading").style.display="none";

        if(data.success){

            currentOrder = data.orderId || "";

            document.getElementById("orderInput").value = currentOrder;

        }else{

            alert("Order ID Not Found\n\nPlease Enter Manually");

            document.getElementById("orderInput").focus();

        }

    }catch(err){

        console.log(err);

        document.getElementById("loading").style.display="none";

        alert("Tracking Failed");

        document.getElementById("orderInput").focus();

    }

}

/* ==========================================
   OPTIONAL BEEP SOUND
========================================== */

function playBeep(){

    try{

        const audio = new Audio(
            "data:audio/wav;base64,UklGRlQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSAAAAA="
        );

        audio.play();

    }catch(e){}

}

/* ==========================================
   OPTIONAL VIBRATION
========================================== */

function vibratePhone(){

    if(navigator.vibrate){

        navigator.vibrate(150);

    }

}

/* ==========================================
   OPTIONAL FOCUS AWB
========================================== */

function focusAWB(){

    document.getElementById("awbInput").focus();

}

/* ==========================================
   RESTART CAMERA
========================================== */

async function restartCamera(){

    await stopCamera();

    setTimeout(()=>{

        if(currentType !== ""){

            startCamera();

        }

    },300);

}

/* ==========================================
   CLEAR ENTRY
========================================== */

function clearFields(){

    currentAWB="";

    currentOrder="";

    document.getElementById("awbInput").value="";

    document.getElementById("orderInput").value="";

}

/* ==========================================
   AUTO FOCUS AFTER SAVE
========================================== */

document.addEventListener("click",function(){

    if(currentType!=="" && !cameraRunning){

        focusAWB();

    }

});

/* ==========================================
   PREVENT DOUBLE TAP ZOOM
========================================== */

let lastTouchEnd = 0;

document.addEventListener("touchend",function(event){

    const now = (new Date()).getTime();

    if(now - lastTouchEnd <= 300){

        event.preventDefault();

    }

    lastTouchEnd = now;

},false);

</script>

</body>
</html>
