
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pickup / Return Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e3a8a);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:10px;
    overflow:hidden;
}


.container{
    width:100%;
    max-width:650px;
    height:96vh;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(12px);
    border-radius:22px;
    padding:16px;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
}


/* Date */

#entryDate{
    width:100%;
    margin-bottom:12px;
}


/* Pickup Return */

.header{
    display:flex;
    gap:12px;
    margin-bottom:12px;
}


.modeBtn{
    flex:1;
    height:55px;
    border:none;
    border-radius:16px;
    background:#ffffff50;
    color:#ffffff;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    transition:.25s;
}


.modeBtn.active{
    background:#22c55e;
    box-shadow:0 6px 18px rgba(34,197,94,.5);
}


/* Camera */

#reader{
    width:100%;
    height:230px;
    background:#000;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(0,0,0,.4);
}


/* Flash */

#flashBtn{
    display:none;
    width:100%;
    height:48px;
    margin-top:10px;
    border:none;
    border-radius:14px;
    background:#f59e0b;
    color:#fff;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
}


/* Loading */

.loader{
    display:none;
    text-align:center;
    color:#ffffff;
    font-size:17px;
    font-weight:700;
    margin:12px 0;
}


/* Card */

.card{
    background:#ffffff;
    margin-top:15px;
    padding:20px;
    border-radius:20px;
    box-shadow:0 8px 25px rgba(0,0,0,.18);
}


/* Label */

.label{
    color:#475569;
    font-size:14px;
    font-weight:600;
    margin-top:10px;
}


/* Inputs */

.inputBox{
    width:100%;
    height:55px;
    margin-top:6px;
    padding:0 15px;
    border:2px solid #e2e8f0;
    border-radius:14px;
    font-size:18px;
    outline:none;
    transition:.2s;
}


.inputBox:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 4px rgba(37,99,235,.15);
}


/* Buttons */

.buttonArea{
    display:flex;
    gap:12px;
    margin-top:22px;
}


.buttonArea button{
    flex:1;
    height:60px;
    border:none;
    border-radius:16px;
    color:#fff;
    font-size:28px;
    font-weight:700;
    cursor:pointer;
}


.saveBtn{
    background:#16a34a;
}


.cancelBtn{
    background:#dc2626;
}


/* Mobile */

@media(max-width:600px){

    body{
        padding:6px;
    }

    .container{
        height:98vh;
        padding:12px;
        border-radius:18px;
    }


    #reader{
        height:200px;
    }


    .modeBtn{
        height:50px;
        font-size:16px;
    }


    .inputBox{
        height:50px;
        font-size:16px;
    }


    .buttonArea button{
        height:55px;
        font-size:24px;
    }

}

</style>


</head>

<body>

<div class="container">

    <!-- Date -->
    <input 
        type="date"
        id="entryDate"
        class="inputBox">


    <!-- Pickup / Return -->

    <div class="header">

        <button 
            id="pickupBtn"
            class="modeBtn"
            onclick="selectMode('Pickup')">
            📦 Pickup
        </button>


        <button 
            id="returnBtn"
            class="modeBtn"
            onclick="selectMode('Return')">
            🔄 Return
        </button>

    </div>


    <!-- Camera -->

    <div id="reader"></div>


    <!-- Flash -->

    <button 
        id="flashBtn"
        onclick="toggleFlash()">
        🔦 Flash ON
    </button>


    <!-- Loading -->

    <div id="loading" class="loader">
        🔍 Searching Order...
    </div>


    <!-- Entry Card -->

    <div id="entryCard" class="card">


        <div class="label">
            AWB Number
        </div>


        <input 
            id="awbInput"
            class="inputBox"
            type="text"
            placeholder="Scan / Enter AWB Number"
            autocomplete="off"
            onkeypress="checkAWBEnter(event)">



        <div class="label">
            Order ID
        </div>


        <input 
            id="orderInput"
            class="inputBox"
            type="text"
            placeholder="Auto Fetch or Enter Order ID"
            autocomplete="off">



        <div class="buttonArea">


            <button
                class="saveBtn"
                type="button"
                onclick="saveScan()">
                ✅
            </button>


            <button
                class="cancelBtn"
                type="button"
                onclick="cancelScan()">
                ❌
            </button>


        </div>


    </div>


</div>

</body>

<script>

const API_URL="https://script.google.com/macros/s/AKfycbwgdYaVNKNXbZw_QVYpIs-y37Fczf7Es7uc-sM7icEZLDc4U8_msZRDWK1tBGWh10Ly/exec";

let scanner=null;
let cameraRunning=false;
let flashOn = false;
let currentType="";
let currentAWB="";
let currentOrder="";

/* ==========================================
   MODE SELECT
========================================== */

function selectMode(type){

    currentType=type;

    document.getElementById("pickupBtn").classList.remove("active");
    document.getElementById("returnBtn").classList.remove("active");

    if(type==="Pickup"){
        document.getElementById("pickupBtn").classList.add("active");
    }else{
        document.getElementById("returnBtn").classList.add("active");
    }

    startCamera();
}

/* ==========================================
   START CAMERA
========================================== */

async function startCamera(){

    if(cameraRunning){
        return;
    }

    scanner=new Html5Qrcode("reader");

    try{

        await scanner.start(
            { facingMode:"environment" },
            {
                fps:10,
                qrbox:250
            },
            onScanSuccess
        );

        cameraRunning=true;
        document.getElementById("flashBtn").style.display="block";

    }catch(err){

        alert("Camera Start Failed");
        console.error(err);

    }

}

/* ==========================================
   SCAN SUCCESS
========================================== */

async function onScanSuccess(decodedText){

    if(!cameraRunning){
        return;
    }

    await stopCamera();

    currentAWB = decodedText.trim();

    document.getElementById("awbInput").value = currentAWB;
    document.getElementById("orderInput").value = "";

    document.getElementById("loading").style.display = "block";

    try{

        // Direct Tracking (Duplicate Check Removed)
        const response = await fetch(
            API_URL +
            "?action=track&awb=" +
            encodeURIComponent(currentAWB)
        );

        const data = await response.json();

        document.getElementById("loading").style.display = "none";


        if(data.success){

            currentOrder = data.orderId || "";

            document.getElementById("orderInput").value = currentOrder;

        }else{

            // Order ID not found, manual entry allowed
            document.getElementById("orderInput").focus();

        }


    }catch(err){

        document.getElementById("loading").style.display = "none";

        console.error(err);

        alert(
            "Tracking Failed\n\nEnter Order ID Manually"
        );

        document.getElementById("orderInput").focus();

    }

}

/* ==========================================
   SAVE
========================================== */

async function saveScan(){

    if(currentType===""){
        alert("Select Pickup / Return");
        return;
    }

    // AWB और Order ID Input Box से Value लो
    currentAWB = document
        .getElementById("awbInput")
        .value
        .trim();

    currentOrder = document
        .getElementById("orderInput")
        .value
        .trim();

    if(currentAWB===""){
        alert("AWB Number Missing");
        return;
    }

    if(currentOrder===""){
        alert("Enter Order ID");
        return;
    }

    const selectedDate =
        document.getElementById("entryDate").value;

    const payload = {
        action: "save",
        type: currentType,
        awb: currentAWB,
        orderId: currentOrder,
        date: selectedDate
    };

    try{

        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify(payload)
        });

        const text = await response.text();

        console.log("SERVER RESPONSE:", text);

        let result;

        try{
            result = JSON.parse(text);
        }catch(e){
            alert("Invalid Server Response\n\n" + text);
            return;
        }


        if(result.success){

            alert("Saved Successfully");

            resetScanner();

            return;
        }


        if(result.duplicate){

            alert(
                "Duplicate Found\n\n" +
                "Order ID : " + result.orderId +
                "\nDate : " + result.date
            );

            resetScanner();

            return;
        }


        alert(
            result.message || "Save Failed"
        );


    }catch(err){

        console.error("SAVE ERROR:", err);

        alert(
            "Save Failed\n\n" +
            err.message
        );

    }

}



/* ==========================================
   CANCEL
========================================== */

function cancelScan(){

    resetScanner();

}

/* ==========================================
   STOP CAMERA
========================================== */

async function stopCamera(){

    if(!cameraRunning || !scanner){
        return;
    }

    try{

        await scanner.stop();
        await scanner.clear();

    }catch(e){
        console.log(e);
    }

    cameraRunning=false;

    document.getElementById("reader").innerHTML="";
    flashOn=false;

document.getElementById("flashBtn").style.display="none";

document.getElementById("flashBtn").innerText="🔦 Flash ON";

}

/* ==========================================
   RESET
========================================== */

async function resetScanner(){

    currentAWB="";
    currentOrder="";

    document.getElementById("awbInput").value="";
    document.getElementById("orderInput").value="";

    document.getElementById("loading").style.display="none";
    if(currentType !== ""){
    startCamera();
    }
    await stopCamera();

}
/* ==========================================
   STOP CAMERA
========================================== */

async function stopCamera(){

    if(!cameraRunning || !scanner){
        return;
    }

    try{

        await scanner.stop();
        await scanner.clear();

    }catch(e){

        console.log(e);

    }

    cameraRunning = false;


    /* Flash Reset */

    flashOn = false;

    document.getElementById("flashBtn").style.display = "none";

    document.getElementById("flashBtn").innerText = "🔦 Flash ON";


    /* Camera object reset */

    scanner = null;

}
/* ==========================================
   PAGE LOAD
========================================== */

window.onload=function(){

    const today=new Date();

    const yyyy=today.getFullYear();
    const mm=String(today.getMonth()+1).padStart(2,"0");
    const dd=String(today.getDate()).padStart(2,"0");

    document.getElementById("entryDate").value=
    `${yyyy}-${mm}-${dd}`;

};
/* ==========================================
   MANUAL AWB SEARCH
========================================== */

async function checkAWBEnter(event){

    if(event.key !== "Enter"){
        return;
    }


    /* Check Pickup / Return Selection */

    if(currentType === ""){

        alert("Please Select Pickup or Return First");

        document.getElementById("awbInput").value = "";

        return;
    }


    const awb = document
        .getElementById("awbInput")
        .value
        .trim();


    if(awb === ""){
        return;
    }


    currentAWB = awb;


    document.getElementById("orderInput").value = "";

    document.getElementById("loading").style.display = "block";


    try{

        /* Tracking Search */

        const response = await fetch(
            API_URL +
            "?action=track&awb=" +
            encodeURIComponent(currentAWB)
        );


        const data = await response.json();


        document.getElementById("loading").style.display = "none";


        if(data.success){

            currentOrder = data.orderId || "";

            document.getElementById("orderInput").value = currentOrder;

        }else{

            alert("Order ID Not Found\n\nPlease Enter Manually");

            document.getElementById("orderInput").focus();

        }


    }catch(err){

        document.getElementById("loading").style.display = "none";

        console.error(err);

        alert("Tracking Failed");

        document.getElementById("orderInput").focus();

    }

}

</script>

</body>

</html>
