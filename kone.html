<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AWB Scanner</title>

<style>
body{
font-family:Arial;
background:#f5f5f5;
padding:20px;
}

.container{
max-width:500px;
margin:auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

h2{
text-align:center;
}

select,input,button{
width:100%;
padding:12px;
margin-top:10px;
font-size:16px;
}

button{
background:#1976d2;
color:white;
border:none;
cursor:pointer;
}

button:hover{
background:#1259a7;
}

#msg{
margin-top:15px;
font-weight:bold;
text-align:center;
}
</style>

</head>

<body>

<div class="container">

<h2>AWB Scanner</h2>

<select id="type">
<option value="">Select Type</option>
<option value="Delhivery">Delhivery</option>
<option value="BOXD">BOXD</option>
</select>

<input
id="awb"
placeholder="Scan AWB Here"
autocomplete="off">

<button onclick="saveAWB()">
Save
</button>

<div id="msg"></div>

</div>

<script>

const API_URL="https://script.google.com/macros/s/AKfycbzJMNmMc-0tH7bSqYW_9SKDRmV1Id20bs-bcoLvFvlZ4s6FXEQOjCB3NIVMQ_ncRzlB/exec";

document.getElementById("awb").focus();

document.getElementById("awb").addEventListener("keydown",function(e){

if(e.key==="Enter"){

saveAWB();

}

});

async function saveAWB(){

const type=document.getElementById("type").value;

const awb=document.getElementById("awb").value.trim();

if(type==""){

show("Select Type");

return;

}

if(awb==""){

show("Scan AWB");

return;

}

show("Please Wait...");

const response=await fetch(API_URL, {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    action: "save",
    type: type,
    awb: awb
  })
});

const result=await response.json();

if(result.success){

show("Saved : "+result.orderId);

document.getElementById("awb").value="";

document.getElementById("awb").focus();

}else{

show(result.message);

}

}

function show(txt){

document.getElementById("msg").innerHTML=txt;

}

</script>

</body>
</html>
