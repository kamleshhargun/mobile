
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pickup / Return Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

body{
    background:#f2f4f8;
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:10px;
}

.container{
    width:100%;
    max-width:700px;
    height:100%;
    display:flex;
    flex-direction:column;
}

.header{
    display:flex;
    gap:10px;
    margin-bottom:10px;
}

.modeBtn{
    flex:1;
    height:52px;
    border:0;
    border-radius:10px;
    background:#d7d7d7;
    color:#444;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    transition:.25s;
}

.modeBtn.active{
    background:#1976d2;
    color:#fff;
}

#reader{
    display:none;
    width:100%;
    height:24vh;
    min-height:220px;
    background:#000;
    border-radius:12px;
    overflow:hidden;
}

.loader{
    display:none;
    text-align:center;
    padding:12px;
    font-size:18px;
    font-weight:bold;
}

.card{
    display:none;
    margin-top:10px;
    background:#fff;
    border-radius:12px;
    padding:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
}

.label{
    color:#777;
    font-size:13px;
    margin-top:10px;
}

.value{
    font-size:22px;
    font-weight:700;
    margin-top:4px;
    word-break:break-word;
}

.buttonArea{
    display:flex;
    gap:10px;
    margin-top:18px;
}

.buttonArea button{
    flex:1;
    height:58px;
    border:0;
    border-radius:10px;
    color:#fff;
    font-size:24px;
    cursor:pointer;
}

.saveBtn{
    background:#16a34a;
}

.cancelBtn{
    background:#dc2626;
}

.popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.popupBox{
    width:90%;
    max-width:380px;
    background:#fff;
    padding:22px;
    border-radius:12px;
}

.popupBox h2{
    margin-bottom:15px;
    font-size:22px;
}

.popupBox input{
    width:100%;
    height:48px;
    border:1px solid #ccc;
    border-radius:8px;
    padding:0 12px;
    font-size:18px;
    outline:none;
}

.popupBox button{
    width:100%;
    height:50px;
    margin-top:15px;
    border:0;
    border-radius:8px;
    background:#1976d2;
    color:#fff;
    font-size:18px;
    cursor:pointer;
}

@media(max-width:600px){

    .modeBtn{
        height:48px;
        font-size:16px;
    }

    #reader{
        height:22vh;
        min-height:190px;
    }

    .value{
        font-size:18px;
    }

    .buttonArea button{
        height:52px;
        font-size:22px;
    }

}
</style>
 


</head>

<body>

<div class="container">

    <!-- Date -->
    <div style="text-align:center;margin-bottom:10px;">
        <input
            type="date"
            id="entryDate"
            style="height:45px;padding:0 12px;border:1px solid #ccc;border-radius:8px;font-size:16px;"
        >
    </div>

    <!-- Pickup / Return -->
    <div class="header">
        <button id="pickupBtn" class="modeBtn" onclick="selectMode('Pickup')">
            Pickup
        </button>

        <button id="returnBtn" class="modeBtn" onclick="selectMode('Return')">
            Return
        </button>
    </div>

    <!-- Camera -->
    <div id="reader"></div>
    <button id="flashBtn" 
        onclick="toggleFlash()" 
        style="
        display:none;
        width:100%;
        height:50px;
        margin-top:8px;
        border:none;
        border-radius:10px;
        background:#ff9800;
        color:white;
        font-size:18px;
        font-weight:bold;
        cursor:pointer;">
    🔦 Flash ON
</button>
    <!-- Loader -->
    <div id="loading" class="loader">
        🔍 Searching Order...
    </div>

    <!-- Result -->
    <div id="resultCard" class="card">

        <div class="label">AWB</div>
        <div id="awbText" class="value">-</div>

        <div class="label">Order ID</div>
        <div id="orderText" class="value">-</div>

        <div class="buttonArea">

            <button
                class="saveBtn"
                type="button"
                onclick="saveScan()">
                ✅
            </button>

            <button
                class="cancelBtn"
                type="button"
                onclick="cancelScan()">
                ❌
            </button>

        </div>

    </div>

</div>

<!-- Manual Order Popup -->

<div id="manualPopup" class="popup">

    <div class="popupBox">

        <h2>Order ID Not Found</h2>

        <input
            id="manualOrder"
            type="text"
            placeholder="Enter Order ID"
            autocomplete="off"
        >

        <button
            type="button"
            onclick="submitManual()">
            Save Order ID
        </button>

    </div>

</div>

<script>

const API_URL="https://script.google.com/macros/s/AKfycbzmxpCxKgqfupyKrYS-ONDf_Mlz5wjZWTFljg0-4VEY-iAxE6voMhIyq0WFoaIA0apq/exec";

let scanner=null;
let cameraRunning=false;
let flashOn = false;
let currentType="";
let currentAWB="";
let currentOrder="";

/* ==========================================
   MODE SELECT
========================================== */

function selectMode(type){

    currentType=type;

    document.getElementById("pickupBtn").classList.remove("active");
    document.getElementById("returnBtn").classList.remove("active");

    if(type==="Pickup"){
        document.getElementById("pickupBtn").classList.add("active");
    }else{
        document.getElementById("returnBtn").classList.add("active");
    }

    startCamera();
}

/* ==========================================
   START CAMERA
========================================== */

async function startCamera(){

    if(cameraRunning){
        return;
    }

    document.getElementById("reader").style.display="block";

    scanner=new Html5Qrcode("reader");

    try{

        await scanner.start(
            { facingMode:"environment" },
            {
                fps:10,
                qrbox:250
            },
            onScanSuccess
        );

        cameraRunning=true;
        document.getElementById("flashBtn").style.display="block";

    }catch(err){

        alert("Camera Start Failed");
        console.error(err);

    }

}

/* ==========================================
   SCAN SUCCESS
========================================== */

async function onScanSuccess(decodedText){

    if(!cameraRunning){
        return;
    }

    await stopCamera();

    currentAWB=decodedText.trim();

    document.getElementById("loading").style.display="block";
    document.getElementById("resultCard").style.display="none";

    try{

        /* Duplicate Check First */

        const dupResponse=await fetch(
            API_URL+
            "?action=duplicate&awb="+
            encodeURIComponent(currentAWB)+
            "&type="+
            encodeURIComponent(currentType)
        );

        const dupData=await dupResponse.json();

        if(dupData.found){

            document.getElementById("loading").style.display="none";

            alert(
                "Duplicate Found\n\n"+
                "Order ID : "+dupData.orderId+
                "\nDate : "+dupData.date
            );

            resetScanner();
            return;
        }

        /* Tracking */

        const response=await fetch(
            API_URL+
            "?action=track&awb="+
            encodeURIComponent(currentAWB)
        );

        const data=await response.json();

        document.getElementById("loading").style.display="none";

        if(data.success){

            currentOrder=data.orderId || "";

            document.getElementById("awbText").innerText=currentAWB;
            document.getElementById("orderText").innerText=currentOrder;

            document.getElementById("resultCard").style.display="block";

            return;
        }

        openManualPopup();

    }catch(err){

        document.getElementById("loading").style.display="none";

        console.error(err);

        alert("Network Error");

        resetScanner();

    }

}

/* ==========================================
   MANUAL POPUP
========================================== */

function openManualPopup(){

    document.getElementById("manualOrder").value="";

    document.getElementById("manualPopup").style.display="flex";

    setTimeout(()=>{
        document.getElementById("manualOrder").focus();
    },100);

}

function submitManual(){

    const value=document
    .getElementById("manualOrder")
    .value
    .trim();

    if(value===""){

        alert("Enter Order ID");
        return;

    }

    currentOrder=value;

    document.getElementById("manualPopup").style.display="none";

    document.getElementById("awbText").innerText=currentAWB;
    document.getElementById("orderText").innerText=currentOrder;

    document.getElementById("resultCard").style.display="block";

}

/* ==========================================
   SAVE
========================================== */

async function saveScan(){

if(currentType===""){
    alert("Select Pickup / Return");
    return;
}

const selectedDate =
    document.getElementById("entryDate").value;

const payload = {
    action: "save",
    type: currentType,
    awb: currentAWB,
    orderId: currentOrder,
    date: selectedDate
};

try{

    const response = await fetch(API_URL, {
        method: "POST",
        redirect: "follow",
        headers: {
            "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(payload)
    });

    const text = await response.text();

    console.log("SERVER RESPONSE:", text);

    let result;

    try{
        result = JSON.parse(text);
    }catch(e){
        alert("Invalid Server Response\n\n" + text);
        return;
    }

    if(result.success){
        alert("Saved Successfully");
        resetScanner();
        return;
    }

    if(result.duplicate){
        alert(
            "Duplicate Found\n\n" +
            "Order ID : " + result.orderId +
            "\nDate : " + result.date
        );
        resetScanner();
        return;
    }

    if(result.manual){
        openManualPopup();
        return;
    }

    alert(result.message || "Unknown Error");

}catch(err){

    console.error(err);

    alert(
        "Save Failed\n\n" +
        err.message
    );

}

}



/* ==========================================
   CANCEL
========================================== */

function cancelScan(){

    resetScanner();

}

/* ==========================================
   STOP CAMERA
========================================== */

async function stopCamera(){

    if(!cameraRunning || !scanner){
        return;
    }

    try{

        await scanner.stop();
        await scanner.clear();

    }catch(e){
        console.log(e);
    }

    cameraRunning=false;

    document.getElementById("reader").style.display="none";
    flashOn=false;

document.getElementById("flashBtn").style.display="none";

document.getElementById("flashBtn").innerText="🔦 Flash ON";

}

/* ==========================================
   RESET
========================================== */

async function resetScanner(){

    currentAWB="";
    currentOrder="";

    document.getElementById("awbText").innerText="-";
    document.getElementById("orderText").innerText="-";

    document.getElementById("loading").style.display="none";
    document.getElementById("resultCard").style.display="none";
    document.getElementById("manualPopup").style.display="none";

    document.getElementById("pickupBtn").classList.remove("active");
    document.getElementById("returnBtn").classList.remove("active");

    currentType="";

    await stopCamera();

}
/* ==========================================
   FLASH LIGHT
========================================== */
    async function toggleFlash(){

    if(!scanner){
        return;
    }

    try{

        const state = await scanner.getState();

        if(state !== 2){
            alert("Camera is not active");
            return;
        }

        if(!flashOn){

            await scanner.applyVideoConstraints({
                advanced: [{torch: true}]
            });

            flashOn = true;

            document.getElementById("flashBtn").innerText =
            "🔦 Flash OFF";

        }else{

            await scanner.applyVideoConstraints({
                advanced: [{torch: false}]
            });

            flashOn = false;

            document.getElementById("flashBtn").innerText =
            "🔦 Flash ON";

        }

    }catch(e){

        alert("Flash not supported on this device");
        console.log(e);

    }

}
/* ==========================================
   PAGE LOAD
========================================== */

window.onload=function(){

    const today=new Date();

    const yyyy=today.getFullYear();
    const mm=String(today.getMonth()+1).padStart(2,"0");
    const dd=String(today.getDate()).padStart(2,"0");

    document.getElementById("entryDate").value=
    `${yyyy}-${mm}-${dd}`;

};

</script>

</body>

</html>
