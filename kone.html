
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pickup / Return Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f2f4f8;
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:10px;
}


/* Main Container */

.container{
    width:100%;
    max-width:700px;
    height:100%;
    display:flex;
    flex-direction:column;
}


/* Pickup Return Buttons */

.header{
    display:flex;
    gap:10px;
    margin-bottom:10px;
}


.modeBtn{
    flex:1;
    height:52px;
    border:0;
    border-radius:10px;
    background:#d7d7d7;
    color:#444;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    transition:0.25s;
}


.modeBtn.active{
    background:#1976d2;
    color:#fff;
}


/* Camera */

#reader{
    display:none;
    width:100%;
    height:24vh;
    min-height:220px;
    background:#000;
    border-radius:12px;
    overflow:hidden;
}


/* Flash Button */

#flashBtn{
    display:none;
    width:100%;
    height:50px;
    margin-top:8px;
    border:none;
    border-radius:10px;
    background:#ff9800;
    color:#fff;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}


/* Loading */

.loader{
    display:none;
    text-align:center;
    padding:12px;
    font-size:18px;
    font-weight:bold;
}


/* Entry Card */

.card{
    display:block;
    margin-top:10px;
    background:#fff;
    border-radius:12px;
    padding:18px;
    box-shadow:0 2px 8px rgba(0,0,0,0.12);
}


/* Labels */

.label{
    color:#666;
    font-size:13px;
    margin-top:10px;
}


/* Input Boxes */

.inputBox{
    width:100%;
    height:50px;
    margin-top:5px;
    padding:0 12px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:18px;
    outline:none;
}


.inputBox:focus{
    border-color:#1976d2;
}


/* Buttons */

.buttonArea{
    display:flex;
    gap:10px;
    margin-top:18px;
}


.buttonArea button{
    flex:1;
    height:58px;
    border:0;
    border-radius:10px;
    color:#fff;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
}


.saveBtn{
    background:#16a34a;
}


.cancelBtn{
    background:#dc2626;
}


/* Mobile Responsive */

@media(max-width:600px){

    body{
        padding:8px;
    }

    .modeBtn{
        height:48px;
        font-size:16px;
    }


    #reader{
        height:22vh;
        min-height:190px;
    }


    #flashBtn{
        height:46px;
        font-size:16px;
    }


    .card{
        padding:14px;
    }


    .inputBox{
        height:46px;
        font-size:16px;
    }


    .buttonArea button{
        height:52px;
        font-size:22px;
    }

}

</style>
 


</head>

<body>

<div class="container">

    <!-- Date -->
    <div style="text-align:center; margin-bottom:10px;">
        <input 
            type="date"
            id="entryDate"
            style="height:45px; padding:0 12px; border:1px solid #ccc; border-radius:8px; font-size:16px;">
    </div>


    <!-- Pickup / Return -->
    <div class="header">

        <button 
            id="pickupBtn" 
            class="modeBtn" 
            onclick="selectMode('Pickup')">
            Pickup
        </button>

        <button 
            id="returnBtn" 
            class="modeBtn" 
            onclick="selectMode('Return')">
            Return
        </button>

    </div>


    <!-- Camera Scanner -->
    <div id="reader"></div>


    <!-- Flash Button -->
    <button 
        id="flashBtn"
        onclick="toggleFlash()">
        🔦 Flash ON
    </button>


    <!-- Loading -->
    <div id="loading" class="loader">
        🔍 Searching Order...
    </div>


    <!-- AWB & Order Entry -->
    <div id="entryCard" class="card">


        <div class="label">
            AWB Number
        </div>

        <input 
            id="awbInput"
            class="inputBox"
            type="text"
            placeholder="Scan or Enter AWB"
            autocomplete="off">


        <div class="label">
            Order ID
        </div>

        <input 
            id="orderInput"
            class="inputBox"
            type="text"
            placeholder="Auto Fetch or Enter Order ID"
            autocomplete="off">


        <!-- Buttons -->
        <div class="buttonArea">

            <button 
                class="saveBtn"
                type="button"
                onclick="saveScan()">
                ✅
            </button>


            <button 
                class="cancelBtn"
                type="button"
                onclick="cancelScan()">
                ❌
            </button>

        </div>

    </div>

</div>

</body>

<script>

const API_URL="https://script.google.com/macros/s/AKfycbxeRAJyo6O-V0CEhPeO9gWII5kpt9n98MFpnwxpT5thc_rERvt0YsXstPZz2fdId4iR/exec";

let scanner=null;
let cameraRunning=false;
let flashOn = false;
let currentType="";
let currentAWB="";
let currentOrder="";

/* ==========================================
   MODE SELECT
========================================== */

function selectMode(type){

    currentType=type;

    document.getElementById("pickupBtn").classList.remove("active");
    document.getElementById("returnBtn").classList.remove("active");

    if(type==="Pickup"){
        document.getElementById("pickupBtn").classList.add("active");
    }else{
        document.getElementById("returnBtn").classList.add("active");
    }

    startCamera();
}

/* ==========================================
   START CAMERA
========================================== */

async function startCamera(){

    if(cameraRunning){
        return;
    }

    document.getElementById("reader").style.display="block";

    scanner=new Html5Qrcode("reader");

    try{

        await scanner.start(
            { facingMode:"environment" },
            {
                fps:10,
                qrbox:250
            },
            onScanSuccess
        );

        cameraRunning=true;
        document.getElementById("flashBtn").style.display="block";

    }catch(err){

        alert("Camera Start Failed");
        console.error(err);

    }

}

/* ==========================================
   SCAN SUCCESS
========================================== */

async function onScanSuccess(decodedText){

    if(!cameraRunning){
        return;
    }

    await stopCamera();

    currentAWB = decodedText.trim();

    document.getElementById("awbInput").value = currentAWB;
    document.getElementById("orderInput").value = "";

    document.getElementById("loading").style.display = "block";

    try{

        // Direct Tracking (Duplicate Check Removed)
        const response = await fetch(
            API_URL +
            "?action=track&awb=" +
            encodeURIComponent(currentAWB)
        );

        const data = await response.json();

        document.getElementById("loading").style.display = "none";


        if(data.success){

            currentOrder = data.orderId || "";

            document.getElementById("orderInput").value = currentOrder;

        }else{

            // Order ID not found, manual entry allowed
            document.getElementById("orderInput").focus();

        }


    }catch(err){

        document.getElementById("loading").style.display = "none";

        console.error(err);

        alert(
            "Tracking Failed\n\nEnter Order ID Manually"
        );

        document.getElementById("orderInput").focus();

    }

}

/* ==========================================
   SAVE
========================================== */

async function saveScan(){

    if(currentType===""){
        alert("Select Pickup / Return");
        return;
    }

    // AWB और Order ID Input Box से Value लो
    currentAWB = document
        .getElementById("awbInput")
        .value
        .trim();

    currentOrder = document
        .getElementById("orderInput")
        .value
        .trim();

    if(currentAWB===""){
        alert("AWB Number Missing");
        return;
    }

    if(currentOrder===""){
        alert("Enter Order ID");
        return;
    }

    const selectedDate =
        document.getElementById("entryDate").value;

    const payload = {
        action: "save",
        type: currentType,
        awb: currentAWB,
        orderId: currentOrder,
        date: selectedDate
    };

    try{

        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify(payload)
        });

        const text = await response.text();

        console.log("SERVER RESPONSE:", text);

        let result;

        try{
            result = JSON.parse(text);
        }catch(e){
            alert("Invalid Server Response\n\n" + text);
            return;
        }


        if(result.success){

            alert("Saved Successfully");

            resetScanner();

            return;
        }


        if(result.duplicate){

            alert(
                "Duplicate Found\n\n" +
                "Order ID : " + result.orderId +
                "\nDate : " + result.date
            );

            resetScanner();

            return;
        }


        alert(
            result.message || "Save Failed"
        );


    }catch(err){

        console.error("SAVE ERROR:", err);

        alert(
            "Save Failed\n\n" +
            err.message
        );

    }

}



/* ==========================================
   CANCEL
========================================== */

function cancelScan(){

    resetScanner();

}

/* ==========================================
   STOP CAMERA
========================================== */

async function stopCamera(){

    if(!cameraRunning || !scanner){
        return;
    }

    try{

        await scanner.stop();
        await scanner.clear();

    }catch(e){
        console.log(e);
    }

    cameraRunning=false;

    document.getElementById("reader").style.display="none";
    flashOn=false;

document.getElementById("flashBtn").style.display="none";

document.getElementById("flashBtn").innerText="🔦 Flash ON";

}

/* ==========================================
   RESET
========================================== */

async function resetScanner(){

    currentAWB="";
    currentOrder="";

    document.getElementById("awbInput").value="";
    document.getElementById("orderInput").value="";

    document.getElementById("loading").style.display="none";

    document.getElementById("pickupBtn").classList.remove("active");
    document.getElementById("returnBtn").classList.remove("active");

    currentType="";

    await stopCamera();

}
/* ==========================================
   FLASH LIGHT
========================================== */
    async function toggleFlash(){

    if(!scanner){
        return;
    }

    try{

        const state = await scanner.getState();

        if(state !== 2){
            alert("Camera is not active");
            return;
        }

        if(!flashOn){

            await scanner.applyVideoConstraints({
                advanced: [{torch: true}]
            });

            flashOn = true;

            document.getElementById("flashBtn").innerText =
            "🔦 Flash OFF";

        }else{

            await scanner.applyVideoConstraints({
                advanced: [{torch: false}]
            });

            flashOn = false;

            document.getElementById("flashBtn").innerText =
            "🔦 Flash ON";

        }

    }catch(e){

        alert("Flash not supported on this device");
        console.log(e);

    }

}
/* ==========================================
   PAGE LOAD
========================================== */

window.onload=function(){

    const today=new Date();

    const yyyy=today.getFullYear();
    const mm=String(today.getMonth()+1).padStart(2,"0");
    const dd=String(today.getDate()).padStart(2,"0");

    document.getElementById("entryDate").value=
    `${yyyy}-${mm}-${dd}`;

};

</script>

</body>

</html>
