<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Scan Dashboard - Bulk Sync Engine</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --background: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            
            --success: #22c55e;
            --warning: #f97316;
            --danger: #ef4444;
            --purple: #a855f7;
            --info: #3b82f6;
            
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --radius: 12px;
            --radius-sm: 6px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            line-height: 1.5;
            padding: 24px;
        }

        /* Fullscreen Loader */
        .fullscreen-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(255, 255, 255, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(4px);
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }
        .fullscreen-loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--border);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .spinner-sm {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Dashboard Container */
        .dashboard {
            max-w: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Control Panel Card */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            padding: 24px;
        }

        .header-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
        }

        .action-cluster {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* Form Elements & Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }
        .btn:hover:not(:disabled) {
            background: #f8fafc;
            border-color: var(--text-muted);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .btn-primary:hover:not(:disabled) {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
        }
        .btn-success {
            background: var(--success);
            color: #fff;
            border-color: var(--success);
        }
        .btn-success:hover:not(:disabled) {
            background: #16a34a;
            border-color: #16a34a;
        }

        .input-search {
            min-width: 280px;
            padding: 10px 14px;
            font-size: 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            outline: none;
            transition: border-color 0.15s ease;
        }
        .input-search:focus {
            border-color: var(--primary);
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 500;
            user-select: none;
            cursor: pointer;
        }
        .checkbox-container input {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        /* Stats Grid */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            border-top: 1px solid var(--border);
            padding-top: 16px;
        }
        .stat-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .stat-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
        }

        /* Bulk Progress Live Output Bar */
        .bulk-progress-card {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .progress-meta {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
        }
        .progress-bg {
            width: 100%;
            background: var(--border);
            height: 8px;
            border-radius: 9999px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Table Architecture */
        .table-card {
            padding: 0;
            overflow: hidden;
        }
        .table-scroll {
            overflow-x: auto;
            max-height: 650px;
            overflow-y: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }
        th {
            position: sticky;
            top: 0;
            background: #ffffff;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.05em;
            padding: 14px 20px;
            border-bottom: 2px solid var(--border);
            z-index: 10;
        }
        td {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        tr:nth-child(even) td {
            background-color: #f8fafc;
        }
        tr:hover td {
            background-color: #f1f5f9 !important;
        }

        /* Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 9999px;
            text-transform: capitalize;
        }
        .badge-delivered { background-color: #dcfce7; color: #166534; }
        .badge-pending { background-color: #ffedd5; color: #9a3412; }
        .badge-rto { background-color: #fee2e2; color: #991b1b; }
        .badge-dto { background-color: #f3e8ff; color: #6b21a8; }
        .badge-others { background-color: #dbeafe; color: #1e40af; }

        /* Row Action Button */
        .btn-table-action {
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 4px;
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .btn-table-action:hover:not(:disabled) {
            background: var(--primary-hover);
        }
        .btn-table-action:disabled {
            background: var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        /* Pagination Architecture */
        .pagination-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: #ffffff;
            border-top: 1px solid var(--border);
        }
        .page-indicator {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
        }
        .page-indicator span {
            color: var(--text-main);
            font-weight: 600;
        }

        /* Toast Engine */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10000;
            max-width: 360px;
            width: 100%;
        }
        .toast {
            background: var(--surface);
            border-left: 4px solid var(--primary);
            box-shadow: var(--shadow-md);
            border-radius: 6px;
            padding: 14px 18px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: start;
            animation: slideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: all 0.2s ease;
        }
        @keyframes slideIn {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast.toast-success { border-left-color: var(--success); }
        .toast.toast-error { border-left-color: var(--danger); }
        .toast.toast-blue { border-left-color: var(--info); }
        
        .toast-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            line-height: 1;
            margin-left: 12px;
        }

        /* Responsiveness Media Rules */
        @media (max-width: 768px) {
            body { padding: 12px; }
            .title-row { flex-direction: column; align-items: start; }
            .action-cluster { width: 100%; }
            .input-search { width: 100%; min-width: unset; }
            .pagination-bar { flex-direction: column; gap: 12px; text-align: center; }
        }
    </style>
</head>
<body>

    <div id="fullscreenLoader" class="fullscreen-loader hidden">
        <div class="spinner"></div>
    </div>

    <div class="dashboard">
        
        <header class="card header-panel">
            <div class="title-row">
                <h1>Daily Scan Dashboard</h1>
                <div class="action-cluster">
                    <button class="btn" id="btnHealth" onclick="checkHealth()">Health Check</button>
                    <button class="btn" id="btnRefresh" onclick="refreshData()">Refresh</button>
                    <input type="text" id="txtSearch" class="input-search" placeholder="Filter by AWB, Order, Courier, Status..." oninput="handleSearch(this.value)">
                    <button class="btn btn-primary" id="btnLoad" onclick="loadPage(1)">Load Records</button>
                    <button class="btn btn-success" id="btnSync" disabled onclick="bulkSyncCurrentPage()">Sync Loaded Rows</button>
                    <label class="checkbox-container">
                        <input type="checkbox" id="chkAutoRefresh" onchange="toggleAutoRefresh(this.checked)">
                        Auto Refresh
                    </label>
                </div>
            </div>

            <div id="bulkProgressWrapper" class="bulk-progress-card hidden">
                <div class="progress-meta">
                    <span id="bulkProgressStatus" class="text-slate-600">Processing dynamic active queues...</span>
                    <span id="bulkProgressPercent" class="text-blue-600">0%</span>
                </div>
                <div class="progress-bg">
                    <div id="bulkProgressBar" class="progress-fill"></div>
                </div>
            </div>
            
            <div class="stats-row">
                <div class="stat-box">
                    <span class="stat-label">Current Page</span>
                    <span class="stat-value" id="valCurrentPage">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Total Pages</span>
                    <span class="stat-value" id="valTotalPages">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Total Rows</span>
                    <span class="stat-value" id="valTotalRows">0</span>
                </div>
            </div>
        </header>

        <section class="card table-card">
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Type</th>
                            <th>AWB</th>
                            <th>Order ID</th>
                            <th>Courier</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="7" style="text-align: center; color: var(--text-muted); padding: 40px;">No records loaded. Click 'Load Records' to sync with API.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <div class="pagination-bar">
                <button class="btn" id="btnPrev" onclick="navigatePage(-1)" disabled>Previous</button>
                <div class="page-indicator">Page <span id="lblCurrentPage">0</span> of <span id="lblTotalPages">0</span></div>
                <button class="btn" id="btnNext" onclick="navigatePage(1)" disabled>Next</button>
            </div>
        </section>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwVEohTpMO-oGYpimvIHQYbxi0TIuotWCTpLYgt2QMVe7AKwSQYhW2ByHuleZd0-qvrVQ/exec";

        let currentDataset = [];
        let globalCurrentPage = 1;
        let globalTotalPages = 1;
        let autoRefreshIntervalId = null;
        let activeSearchQuery = "";
        let isBulkProcessing = false;

        // Core API Wrapper
        async function apiRequest(queryString) {
            try {
                const response = await fetch(`${API_URL}${queryString}`);
                if (!response.ok) throw new Error(`HTTP Error status code: ${response.status}`);
                return await response.json();
            } catch (error) {
                console.error("API Request Defect:", error);
                showToast(`API Request Failed: ${error.message}`, "error");
                return null;
            }
        }

        // Global UI Loader Management
        function setGlobalLoader(isVisible) {
            const loader = document.getElementById("fullscreenLoader");
            if (isVisible) loader.classList.remove("hidden");
            else loader.classList.add("hidden");
        }

        // Health check pipeline
        async function checkHealth() {
            if (isBulkProcessing) return;
            setGlobalLoader(true);
            const data = await apiRequest("?action=healthCheck");
            setGlobalLoader(false);
            if (data && data.success) {
                showToast(data.message || "Health Check Passed! Connection healthy.", "success");
            } else {
                showToast("Health Check Validation Failed.", "error");
            }
        }

        // Load targeted paginated record chunks
        async function loadPage(pageNumber) {
            if (isBulkProcessing) return;
            setGlobalLoader(true);
            const data = await apiRequest(`?action=getPaginatedRecords&page=${pageNumber}&limit=100`);
            setGlobalLoader(false);
            
            if (data && data.success) {
                currentDataset = data.rows || [];
                globalCurrentPage = data.currentPage || 1;
                globalTotalPages = data.totalPages || 1;
                
                // Set metadata nodes
                document.getElementById("valCurrentPage").innerText = globalCurrentPage;
                document.getElementById("valTotalPages").innerText = globalTotalPages;
                document.getElementById("valTotalRows").innerText = data.totalRows || 0;
                
                document.getElementById("lblCurrentPage").innerText = globalCurrentPage;
                document.getElementById("lblTotalPages").innerText = globalTotalPages;

                renderTableRows(currentDataset);
                updatePaginationControls();
                
                document.getElementById("btnSync").disabled = (currentDataset.length === 0);
                
                if (activeSearchQuery) {
                    handleSearch(activeSearchQuery);
                }
            }
        }

        // Handle structural multi-column in-memory searching instantly
        function handleSearch(query) {
            activeSearchQuery = query.trim().toLowerCase();
            if (!activeSearchQuery) {
                renderTableRows(currentDataset);
                return;
            }

            const filtered = currentDataset.filter(row => {
                return (
                    String(row.awb || '').toLowerCase().includes(activeSearchQuery) ||
                    String(row.orderId || '').toLowerCase().includes(activeSearchQuery) ||
                    String(row.courier || '').toLowerCase().includes(activeSearchQuery) ||
                    String(row.status || '').toLowerCase().includes(activeSearchQuery)
                );
            });
            renderTableRows(filtered);
        }

        // Render routine inside dataset arrays
        function renderTableRows(dataset) {
            const tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";

            if (dataset.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--text-muted); padding: 40px;">No matching transactional matching indices found.</td></tr>`;
                return;
            }

            const fragment = document.createDocumentFragment();

            dataset.forEach(row => {
                const tr = document.createElement("tr");
                tr.setAttribute("data-awb", row.awb);
                tr.id = `row-${row.awb}`;

                const st = String(row.status || '').toLowerCase();
                let badgeClass = "badge-others";
                if (st === "delivered") badgeClass = "badge-delivered";
                else if (st === "pending") badgeClass = "badge-pending";
                else if (st === "rto") badgeClass = "badge-rto";
                else if (st === "dto") badgeClass = "badge-dto";

                tr.innerHTML = `
                    <td>${row.date || ''}</td>
                    <td>${row.type || ''}</td>
                    <td style="font-weight: 600;">${row.awb || ''}</td>
                    <td>${row.orderId || ''}</td>
                    <td>${row.courier || ''}</td>
                    <td><span class="badge ${badgeClass}" id="badge-${row.awb}">${row.status || 'Unknown'}</span></td>
                    <td>
                        <button class="btn-table-action" id="action-btn-${row.awb}" onclick="updateSingleRow('${row.awb}', this)">Update</button>
                    </td>
                `;
                fragment.appendChild(tr);
            });

            tbody.appendChild(fragment);
        }

        // Process dynamic sequential loops for the entire page's active items
        async function bulkSyncCurrentPage() {
            if (isBulkProcessing || currentDataset.length === 0) return;

            // Filter active non-final records to preserve logistics rate limits
            const activeQueue = currentDataset.filter(row => {
                const cleanSt = String(row.status || '').toLowerCase().trim();
                return row.awb && cleanSt !== "delivered" && cleanSt !== "rto" && cleanSt !== "dto";
            });

            if (activeQueue.length === 0) {
                showToast("All loaded rows on this block are already finalized/locked.", "blue");
                return;
            }

            if (!confirm(`Identified ${activeQueue.length} un-finalized rows on Page ${globalCurrentPage}. Start safe bulk sync now?`)) return;

            // Lock controls to prevent overlapping execution tracks
            isBulkProcessing = true;
            toggleControlInteractions(false);
            
            const progressWrapper = document.getElementById("bulkProgressWrapper");
            const progressBar = document.getElementById("bulkProgressBar");
            const progressTxt = document.getElementById("bulkProgressStatus");
            const progressPct = document.getElementById("bulkProgressPercent");

            progressWrapper.classList.remove("hidden");
            
            let successHits = 0;
            const totalItems = activeQueue.length;

            for (let i = 0; i < totalItems; i++) {
                const item = activeQueue[i];
                progressTxt.innerText = `Syncing target sequence (${i + 1}/${totalItems}) | AWB: ${item.awb}`;
                
                const targetBtn = document.getElementById(`action-btn-${item.awb}`);
                
                // Call core functional mutation router parameters sequentially
                await executeRowSyncUpdate(item.awb, targetBtn);
                
                successHits++;
                
                // Update live dynamic layout rendering structures
                const computedPercent = Math.round((successHits / totalItems) * 100);
                progressBar.style.width = `${computedPercent}%`;
                progressPct.innerText = `${computedPercent}%`;

                // Safe anti-throttle pause interval delay: 1200ms
                if (i < totalItems - 1) {
                    await new Promise(resolve => setTimeout(resolve, 1200));
                }
            }

            // Cleanup & release lock states
            isBulkProcessing = false;
            toggleControlInteractions(true);
            progressWrapper.classList.add("hidden");
            progressBar.style.width = "0%";
            
            showToast(`Bulk pagination sequence complete! Successfully refreshed metadata profiles.`, "success");
            loadPage(globalCurrentPage);
        }

        // Core row level synchronization worker blueprint
        async function executeRowSyncUpdate(awb, buttonElement) {
            let originalContent = "Update";
            if (buttonElement) {
                originalContent = buttonElement.innerHTML;
                buttonElement.disabled = true;
                buttonElement.innerHTML = `<span class="spinner-sm"></span>`;
            }
            
            const data = await apiRequest(`?action=updateSingleAWB&awb=${awb}`);
            
            if (buttonElement) {
                buttonElement.disabled = false;
                buttonElement.innerHTML = originalContent;
            }

            if (data && data.success) {
                const targetBadge = document.getElementById(`badge-${awb}`);
                if (targetBadge && data.status) {
                    targetBadge.innerText = data.status;
                    targetBadge.className = "badge";
                    
                    const ns = String(data.status).toLowerCase();
                    let badgeClass = "badge-others";
                    if (ns === "delivered") badgeClass = "badge-delivered";
                    else if (ns === "pending") badgeClass = "badge-pending";
                    else if (ns === "rto") badgeClass = "badge-rto";
                    else if (ns === "dto") badgeClass = "badge-dto";
                    targetBadge.classList.add(badgeClass);
                    
                    const idx = currentDataset.findIndex(r => r.awb === awb);
                    if (idx !== -1) currentDataset[idx].status = data.status;
                }
            }
        }

        // Manual individual execution triggers wrapper
        async function updateSingleRow(awb, buttonElement) {
            if (isBulkProcessing) return;
            showToast(`Querying live tracking telemetry for AWB: ${awb}`, "blue");
            await executeRowSyncUpdate(awb, buttonElement);
            showToast(`Individual verification sequence processed for node ${awb}`, "success");
        }

        // Toggle button lockouts during batch synchronization
        function toggleControlInteractions(isEnabled) {
            document.getElementById("btnHealth").disabled = !isEnabled;
            document.getElementById("btnRefresh").disabled = !isEnabled;
            document.getElementById("btnLoad").disabled = !isEnabled;
            document.getElementById("btnSync").disabled = !isEnabled;
            document.getElementById("btnPrev").disabled = !isEnabled || (globalCurrentPage <= 1);
            document.getElementById("btnNext").disabled = !isEnabled || (globalCurrentPage >= globalTotalPages);
            
            const rowButtons = document.querySelectorAll(".btn-table-action");
            rowButtons.forEach(btn => btn.disabled = !isEnabled);
        }

        // Basic pagination navigation
        function navigatePage(direction) {
            if (isBulkProcessing) return;
            const nextTarget = globalCurrentPage + direction;
            if (nextTarget >= 1 && nextTarget <= globalTotalPages) {
                loadPage(nextTarget);
            }
        }

        function updatePaginationControls() {
            document.getElementById("btnPrev").disabled = (globalCurrentPage <= 1);
            document.getElementById("btnNext").disabled = (globalCurrentPage >= globalTotalPages);
        }

        function refreshData() {
            if (isBulkProcessing) return;
            loadPage(globalCurrentPage);
        }

        // Auto polling engine scheduler logic
        function toggleAutoRefresh(isEnabled) {
            if (isEnabled) {
                showToast("Automated background background sync worker enabled (30s interval clock).", "blue");
                autoRefreshIntervalId = setInterval(() => {
                    if (!isBulkProcessing) {
                        refreshData();
                    }
                }, 30000);
            } else {
                if (autoRefreshIntervalId) {
                    clearInterval(autoRefreshIntervalId);
                    autoRefreshIntervalId = null;
                }
                showToast("Automated background background sync worker detached safely.", "blue");
            }
        }

        // Beautiful custom Toast engine injection mechanics
        function showToast(message, variant = "blue") {
            const container = document.getElementById("toastContainer");
            const toast = document.createElement("div");
            toast.className = `toast toast-${variant}`;
            
            toast.innerHTML = `
                <span>${message}</span>
                <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
            `;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                if (toast && toast.parentElement) {
                    toast.style.opacity = "0";
                    toast.style.transform = "translateY(20px)";
                    setTimeout(() => toast.remove(), 200);
                }
            }, 4500);
        }
    </script>
</body>
</html>
