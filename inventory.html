<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inventory Manager</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
-webkit-tap-highlight-color:transparent;
}

:root{

--primary:#2563eb;
--primary-light:#eff6ff;

--success:#16a34a;
--danger:#dc2626;
--warning:#f59e0b;

--text:#111827;
--text-light:#6b7280;

--background:#f4f7fb;
--card:#ffffff;
--border:#e5e7eb;

--shadow:0 10px 30px rgba(0,0,0,.06);

--radius:18px;

}

body{

background:var(--background);
color:var(--text);
padding:14px;

}

img{
max-width:100%;
display:block;
}

button,
input{
font-family:inherit;
}

.header{

position:sticky;
top:10px;

background:rgba(255,255,255,.92);
backdrop-filter:blur(16px);

border:1px solid rgba(255,255,255,.6);

box-shadow:var(--shadow);

padding:18px;
border-radius:20px;

z-index:1000;

}

.header h1{

font-size:24px;
font-weight:800;
color:var(--text);

}

.status{

display:inline-flex;
align-items:center;
gap:8px;

margin-top:12px;

padding:10px 18px;

border-radius:999px;

font-size:13px;
font-weight:700;

}

.connected{

background:#dcfce7;
color:#166534;

}

.disconnected{

background:#fee2e2;
color:#991b1b;

}

.card{

margin-top:18px;

background:var(--card);

border-radius:20px;

padding:18px;

border:1px solid var(--border);

box-shadow:var(--shadow);

}

.card-title{

font-size:18px;
font-weight:700;

margin-bottom:15px;

}

.dashboard{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:12px;

}

.box{

background:#fafcff;

border:1px solid var(--border);

border-radius:18px;

padding:18px 10px;

transition:.25s;

}

.box:hover{

transform:translateY(-2px);

}

.box div:first-child{

font-size:13px;
color:var(--text-light);

}

.number{

margin-top:8px;

font-size:28px;

font-weight:800;

color:var(--primary);

}

.search-wrap{

position:relative;

}

#search{

width:100%;

padding:16px 18px;

font-size:16px;

background:white;

border:2px solid var(--border);

border-radius:16px;

transition:.25s;

}

#search:focus{

outline:none;

border-color:var(--primary);

box-shadow:0 0 0 4px rgba(37,99,235,.12);

}

.suggestions{

position:absolute;

top:105%;

left:0;

right:0;

background:white;

border-radius:18px;

border:1px solid var(--border);

box-shadow:0 20px 35px rgba(0,0,0,.08);

overflow:hidden;

max-height:280px;

overflow-y:auto;

z-index:999;

}

.suggestion-item{

padding:15px 18px;

cursor:pointer;

transition:.2s;

border-bottom:1px solid #f1f5f9;

}

.suggestion-item:last-child{

border:none;

}

.suggestion-item:hover{

background:var(--primary-light);

}

.product-image{

width:100%;

max-width:240px;

height:240px;

margin:18px auto;

border-radius:20px;

object-fit:cover;

background:#f3f4f6;

border:1px solid var(--border);

}

.stock-grid{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:12px;

margin-top:18px;

}

.stock-item{

background:#fafcff;

border:1px solid var(--border);

border-radius:18px;

padding:15px;

text-align:center;

}

.stock-item div:first-child{

font-size:13px;
color:var(--text-light);

}

.stock-value{

margin-top:8px;

font-size:24px;

font-weight:800;

color:var(--primary);

}

.action-grid{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:12px;

margin-top:18px;

}

.action-btn{

border:none;

border-radius:16px;

padding:15px;

font-size:15px;

font-weight:700;

color:white;

cursor:pointer;

transition:.25s;

}

.action-btn:hover{

transform:translateY(-2px);

}

.opening{
background:#2563eb;
}

.inward{
background:#16a34a;
}

.returns{
background:#0ea5e9;
}

.reject{
background:#dc2626;
}

.sales{
background:#7c3aed;
}

.action-btn.active{

background:white !important;

color:var(--text);

border:2px solid var(--primary);

}

#qty{

width:100%;

margin-top:18px;

padding:16px;

font-size:18px;

border-radius:16px;

border:2px solid var(--border);

transition:.25s;

}

#qty:focus{

outline:none;

border-color:var(--primary);

box-shadow:0 0 0 4px rgba(37,99,235,.10);

}

.update-btn{

width:100%;

margin-top:16px;

padding:16px;

border:none;

border-radius:16px;

background:linear-gradient(90deg,#2563eb,#1d4ed8);

color:white;

font-size:17px;

font-weight:700;

cursor:pointer;

transition:.25s;

}

.update-btn:hover{

transform:translateY(-2px);

}

.low-buttons{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:12px;

}

.low-btn{

background:#111827;

color:white;

padding:14px;

border:none;

border-radius:16px;

font-weight:600;

cursor:pointer;

transition:.25s;

}

.low-btn:hover{

background:#1f2937;

}

.low-list{

margin-top:18px;

}

.low-item{

display:flex;

align-items:center;

justify-content:space-between;

gap:12px;

padding:12px;

border-bottom:1px solid #edf2f7;

}

.low-item img{

width:56px;

height:56px;

border-radius:14px;

object-fit:cover;

}

#toast{

position:fixed;

bottom:20px;

left:50%;

transform:translateX(-50%);

padding:14px 22px;

border-radius:999px;

font-size:14px;

font-weight:700;

color:white;

opacity:0;

visibility:hidden;

transition:.3s;

z-index:99999;

box-shadow:0 10px 30px rgba(0,0,0,.15);

}

#toast.show{

opacity:1;

visibility:visible;

}

#toast.success{

background:#16a34a;

}

#toast.error{

background:#dc2626;

}

/* ======================
Mobile Special
====================== */

@media(max-width:767px){

body{

padding:12px;

}

.header{

border-radius:18px;

padding:16px;

}

.header h1{

font-size:22px;

}

.card{

padding:16px;

border-radius:18px;

}

.product-image{

width:190px;
height:190px;

}

.action-btn{

padding:16px 10px;

font-size:14px;

}

.stock-value{

font-size:22px;

}

.number{

font-size:24px;

}

}

/* ======================
Desktop
====================== */

@media(min-width:768px){

body{

max-width:1200px;

margin:auto;

padding:25px;

}

.dashboard{

grid-template-columns:repeat(4,1fr);

}

.stock-grid{

grid-template-columns:repeat(5,1fr);

}

.action-grid{

grid-template-columns:repeat(5,1fr);

}

.low-buttons{

grid-template-columns:repeat(4,1fr);

}

}

html{

scroll-behavior:smooth;

}

</style>

</head>


<body>

<div class="header">

    <div style="display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;">

        <div>

            <h1>📦 Inventory Manager</h1>

            <p style="margin-top:6px;color:#6b7280;font-size:14px;">
                Inventory Dashboard & Stock Management
            </p>

        </div>

        <div id="connectionStatus" class="status disconnected">
            🔄 Checking Connection...
        </div>

    </div>

</div>


<!-- Dashboard -->

<div class="card">

    <div class="card-title">
        📊 Inventory Summary
    </div>

    <div class="dashboard">

        <div class="box">
            <div>Total SKU</div>
            <div class="number" id="totalSKU">0</div>
        </div>

        <div class="box">
            <div>Total Stock</div>
            <div class="number" id="totalStock">0</div>
        </div>

        <div class="box">
            <div>Today's Sales</div>
            <div class="number" id="todaySales">0</div>
        </div>

        <div class="box">
            <div>Top SKU</div>
            <div class="number" id="topSKU">-</div>
        </div>

    </div>

</div>


<!-- Search -->

<div class="card">

    <div class="card-title">
        🔍 Search Product
    </div>

    <div class="search-wrap">

        <input
            type="text"
            id="search"
            placeholder="Search SKU or Product Name">

        <div
            id="suggestions"
            class="suggestions">
        </div>

    </div>

</div>



<!-- Product Details -->

<div
id="productCard"
class="card"
style="display:none;">

    <img
        id="productImage"
        class="product-image"
        alt="Product Image">

    <h2
        id="productSKU"
        style="text-align:center;margin-bottom:20px;font-size:24px;">
        SKU
    </h2>


    <div class="stock-grid">

        <div class="stock-item">
            <div>Opening</div>
            <div class="stock-value" id="opening">0</div>
        </div>

        <div class="stock-item">
            <div>Inward</div>
            <div class="stock-value" id="inward">0</div>
        </div>

        <div class="stock-item">
            <div>Reject</div>
            <div class="stock-value" id="reject">0</div>
        </div>

        <div class="stock-item">
            <div>Sales</div>
            <div class="stock-value" id="sales">0</div>
        </div>

        <div class="stock-item">
            <div>Available</div>
            <div class="stock-value" id="stock">0</div>
        </div>

    </div>


    <div class="card-title" style="margin-top:25px;">
        ⚡ Stock Action
    </div>


    <div class="action-grid">

        <button
            class="action-btn opening"
            onclick="selectAction(this,'opening')">
            ➕ Opening
        </button>

        <button
            class="action-btn inward"
            onclick="selectAction(this,'inward')">
            📥 Inward
        </button>

        <button
            class="action-btn returns"
            onclick="selectAction(this,'returns')">
            ↩ Returns
        </button>

        <button
            class="action-btn reject"
            onclick="selectAction(this,'reject')">
            ❌ Reject
        </button>

        <button
            class="action-btn sales"
            onclick="selectAction(this,'sales')">
            🛒 Sales
        </button>

    </div>


    <input
        type="number"
        id="qty"
        placeholder="Enter Quantity">


    <button
        class="update-btn"
        onclick="updateProductStock()">
        ✅ Update Stock
    </button>

</div>



<!-- Low Stock -->

<div class="card">

    <div class="card-title">
        🚨 Low Stock Alert
    </div>

    <div class="low-buttons">

        <button
            class="low-btn"
            onclick="showLowStock(5)">
            &lt; 5
            (<span id="low5">0</span>)
        </button>

        <button
            class="low-btn"
            onclick="showLowStock(10)">
            &lt; 10
            (<span id="low10">0</span>)
        </button>

        <button
            class="low-btn"
            onclick="showLowStock(15)">
            &lt; 15
            (<span id="low15">0</span>)
        </button>

        <button
            class="low-btn"
            onclick="showLowStock(20)">
            &lt; 20
            (<span id="low20">0</span>)
        </button>

    </div>

    <div
        id="lowStockList"
        class="low-list"
        style="margin-top:20px;text-align:center;color:#6b7280;">

        📦 Select a filter to view products.

    </div>

</div>


<div id="toast"></div>
 
<script> /************************************************* * CHANGE THIS URL *************************************************/ const API_URL = "https://script.google.com/macros/s/AKfycbyI9lCfbNcTT3xJrw5hr3TXRR1IZ-O6b3J7WGDryOcISL94nkPIHPabCvpOc0v5Vvfx/exec"; /************************************************* * GLOBALS *************************************************/ let products = []; let selectedSKU = ""; let selectedAction = ""; /************************************************* * PAGE LOAD *************************************************/ window.onload = function(){ checkConnection(); loadProducts(); loadDashboard(); loadLowStockCounts(); }; /************************************************* * CONNECTION *************************************************/ async function checkConnection(){ const res = await fetch( API_URL + "?action=connection" ); const data = await res.json(); const box = document.getElementById( "connectionStatus" ); if(data.status){ box.className = "status connected"; box.innerHTML = "🟢 Connected"; } else{ box.className = "status disconnected"; box.innerHTML = "🔴 Error"; } } /************************************************* * PRODUCTS *************************************************/ async function loadProducts(){ const res = await fetch( API_URL + "?action=products" ); products = await res.json(); } /************************************************* * DASHBOARD *************************************************/ async function loadDashboard(){ let res1 = await fetch( API_URL + "?action=summary" ); let summary = await res1.json(); document.getElementById( "totalSKU" ).innerHTML = summary.totalProducts; document.getElementById( "totalStock" ).innerHTML = summary.totalStock; let res2 = await fetch( API_URL + "?action=sales" ); let sales = await res2.json(); document.getElementById( "todaySales" ).innerHTML = sales.totalSalesQty; document.getElementById( "topSKU" ).innerHTML = sales.topSellingSKU; } /************************************************* * SEARCH *************************************************/ function normalizeText(text){ return text .toLowerCase() .replace(/-/g," ") .replace(/\s+/g," ") .trim(); } document .getElementById("search") .addEventListener( "input", function(){ let search = normalizeText(this.value); let box = document.getElementById( "suggestions" ); box.innerHTML = ""; if(search.length == 0) return; let words = search.split(" "); let result = products.filter(item=>{ let sku = normalizeText(item.sku); return words.every( word => sku.includes(word) ); }); result.slice(0,30) .forEach(item=>{ let div = document.createElement("div"); div.className = "suggestion-item"; div.innerHTML = "📦 " + item.sku; div.onclick = ()=>selectProduct(item.sku); box.appendChild(div); }); }); /************************************************* * SELECT PRODUCT *************************************************/ async function selectProduct(sku){ selectedSKU = sku; document .getElementById("search") .value = sku; document .getElementById( "suggestions" ) .innerHTML = ""; let res = await fetch( API_URL + "?action=product&sku=" + encodeURIComponent(sku) ); let data = await res.json(); if(data.status){ showProduct( data.data ); } } /************************************************* * SHOW PRODUCT *************************************************/ function showProduct(item){ document .getElementById( "productCard" ) .style.display = "block"; document .getElementById( "productSKU" ) .innerHTML = item.sku; document .getElementById( "opening" ) .innerHTML = item.opening; document .getElementById( "inward" ) .innerHTML = item.inward; document .getElementById( "reject" ) .innerHTML = item.reject; document .getElementById( "sales" ) .innerHTML = item.sales; document .getElementById( "stock" ) .innerHTML = item.stock; document .getElementById( "productImage" ) .src = item.image || "https://via.placeholder.com/250"; } /************************************************* * ACTION *************************************************/ function selectAction( button, action ){ document .querySelectorAll( ".action-btn" ) .forEach(btn=>{ btn.classList.remove( "active" ); }); button.classList.add( "active" ); selectedAction = action; } /************************************************* * UPDATE STOCK *************************************************/ async function updateProductStock(){ let qty = document .getElementById("qty") .value; if(!selectedSKU){ showToast( "Select Product", "error" ); return; } if(!selectedAction){ showToast( "Select Action", "error" ); return; } let res = await fetch( API_URL, { method:"POST", headers:{ "Content-Type": "application/json" }, body:JSON.stringify({ sku:selectedSKU, qty:qty, action:selectedAction }) } ); let data = await res.json(); if(data.status){ showProduct( data.data ); document .getElementById( "qty" ) .value = ""; showToast( data.message, "success" ); loadDashboard(); loadProducts(); loadLowStockCounts(); } else{ showToast( data.message, "error" ); } } /************************************************* * LOW STOCK *************************************************/ async function loadLowStockCounts(){ let res = await fetch( API_URL + "?action=lowstockcounts" ); let data = await res.json(); document .getElementById("low5") .innerHTML = data.less5; document .getElementById("low10") .innerHTML = data.less10; document .getElementById("low15") .innerHTML = data.less15; document .getElementById("low20") .innerHTML = data.less20; } async function showLowStock(limit){ let res = await fetch( API_URL + "?action=lowstock&limit=" + limit ); let data = await res.json(); let box = document .getElementById( "lowStockList" ); box.innerHTML = ""; if(data.count == 0){ box.innerHTML = "✅ No Low Stock"; return; } data.items.forEach(item=>{ box.innerHTML += <div class="low-item"> <div> <img src="${ item.image || 'https://via.placeholder.com/50' }"> </div> <div style="flex:1;padding-left:10px;"> ${item.sku} </div> <div> Stock: <b>${item.stock}</b> </div> </div> ; }); } /************************************************* * TOAST *************************************************/ function showToast( message, type="success" ){ let toast = document .getElementById( "toast" ); toast.innerHTML = message; toast.className = ""; toast.classList.add( "show" ); toast.classList.add( type ); setTimeout(()=>{ toast.classList.remove( "show" ); },2000); } </script> </body> </html>
