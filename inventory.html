<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Inventory Manager</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

:root{
--primary:#2563eb;
--success:#16a34a;
--danger:#dc2626;
--bg:#f3f6fb;
--card:#ffffff;
--border:#e2e8f0;
}

body{
background:var(--bg);
padding:15px;
}

.header{
background:white;
padding:15px;
border-radius:15px;
box-shadow:0 3px 10px #ddd;
position:sticky;
top:10px;
z-index:100;
}

.header h1{
font-size:24px;
margin-bottom:10px;
}

.status{
display:inline-block;
padding:8px 15px;
border-radius:30px;
font-weight:bold;
font-size:14px;
}

.connected{
background:#dcfce7;
color:#166534;
}

.disconnected{
background:#fee2e2;
color:#991b1b;
}

.card{
background:white;
padding:15px;
border-radius:15px;
margin-top:15px;
box-shadow:0 3px 10px #ddd;
}

.card-title{
font-size:18px;
font-weight:bold;
margin-bottom:12px;
}

.dashboard{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.box{
background:#f8fafc;
border:1px solid var(--border);
border-radius:12px;
padding:15px;
text-align:center;
}

.number{
font-size:24px;
font-weight:bold;
color:var(--primary);
margin-top:5px;
}

.search-wrap{
position:relative;
}

#search{
width:100%;
padding:15px;
font-size:16px;
border:2px solid #ccc;
border-radius:12px;
}

#search:focus{
outline:none;
border-color:var(--primary);
}

.suggestions{
position:absolute;
width:100%;
background:white;
border-radius:12px;
box-shadow:0 5px 15px #aaa;
max-height:250px;
overflow:auto;
z-index:500;
}

.suggestion-item{
padding:12px;
cursor:pointer;
border-bottom:1px solid #eee;
}

.suggestion-item:hover{
background:#eff6ff;
}

.product-image{
width:100%;
max-width:250px;
height:250px;
object-fit:cover;
display:block;
margin:auto;
border-radius:15px;
background:#eee;
margin-bottom:15px;
}

.stock-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-top:15px;
}

.stock-item{
background:#f8fafc;
padding:12px;
border-radius:12px;
text-align:center;
}

.stock-value{
font-size:20px;
font-weight:bold;
}

.action-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-top:15px;
}

.action-btn{
padding:14px;
border:none;
border-radius:12px;
font-size:15px;
font-weight:bold;
color:white;
cursor:pointer;
}

.opening{
background:#2563eb;
}

.inward{
background:#16a34a;
}

.returns{
background:#0891b2;
}

.reject{
background:#dc2626;
}

.sales{
background:#7c3aed;
}

.action-btn.active{
background:white !important;
color:black;
border:2px solid black;
}

#qty{
width:100%;
padding:14px;
margin-top:15px;
font-size:18px;
border-radius:12px;
border:2px solid #ccc;
}

.update-btn{
width:100%;
margin-top:10px;
padding:15px;
font-size:18px;
border:none;
border-radius:12px;
background:black;
color:white;
cursor:pointer;
}

.low-buttons{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.low-btn{
background:#111827;
color:white;
border:none;
padding:12px;
border-radius:12px;
cursor:pointer;
}

.low-list{
margin-top:15px;
}

.low-item{
display:flex;
align-items:center;
justify-content:space-between;
padding:10px;
border-bottom:1px solid #eee;
}

.low-item img{
width:50px;
height:50px;
object-fit:cover;
border-radius:8px;
}

#toast{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
padding:14px 25px;
border-radius:40px;
color:white;
font-weight:bold;
opacity:0;
visibility:hidden;
transition:.3s;
z-index:9999;
}

#toast.show{
opacity:1;
visibility:visible;
}

#toast.success{
background:#16a34a;
}

#toast.error{
background:#dc2626;
}

@media(min-width:768px){

body{
max-width:1000px;
margin:auto;
}

.dashboard{
grid-template-columns:repeat(4,1fr);
}

.stock-grid{
grid-template-columns:repeat(5,1fr);
}

.action-grid{
grid-template-columns:repeat(5,1fr);
}

.low-buttons{
grid-template-columns:repeat(4,1fr);
}

}

</style>

</head>

<body>

<div class="header">

<h1>
📦 Inventory Manager
</h1>

<div
id="connectionStatus"
class="status disconnected">

Checking Connection...

</div>

</div>

<div class="card">

<div class="card-title">
📊 Inventory Summary
</div>

<div class="dashboard">

<div class="box">
Total SKU
<div
class="number"
id="totalSKU">
0
</div>
</div>

<div class="box">
Stock Qty
<div
class="number"
id="totalStock">
0
</div>
</div>

<div class="box">
Today Sales
<div
class="number"
id="todaySales">
0
</div>
</div>

<div class="box">
Top SKU
<div
class="number"
id="topSKU">
-
</div>
</div>

</div>

</div>

<div class="card">

<div class="card-title">
🔍 Search Product
</div>

<div class="search-wrap">

<input
type="text"
id="search"
placeholder="Search SKU">

<div
id="suggestions"
class="suggestions">
</div>

</div>

</div>

<div
id="productCard"
class="card"
style="display:none;">

<img
id="productImage"
class="product-image">

<h2 id="productSKU">
SKU
</h2>
<div class="stock-grid">

<div class="stock-item">
Opening
<div class="stock-value" id="opening">0</div>
</div>

<div class="stock-item">
Inward
<div class="stock-value" id="inward">0</div>
</div>

<div class="stock-item">
Reject
<div class="stock-value" id="reject">0</div>
</div>

<div class="stock-item">
Sales
<div class="stock-value" id="sales">0</div>
</div>

<div class="stock-item">
Stock
<div class="stock-value" id="stock">0</div>
</div>

</div>

<div class="card-title" style="margin-top:15px;">
Stock Action
</div>

<div class="action-grid">

<button
class="action-btn opening"
onclick="selectAction(this,'opening')">
➕ Opening
</button>

<button
class="action-btn inward"
onclick="selectAction(this,'inward')">
➕ Inward
</button>

<button
class="action-btn returns"
onclick="selectAction(this,'returns')">
➕ Returns
</button>

<button
class="action-btn reject"
onclick="selectAction(this,'reject')">
➖ Reject
</button>

<button
class="action-btn sales"
onclick="selectAction(this,'sales')">
➖ Sales
</button>

</div>

<input
type="number"
id="qty"
placeholder="Enter Quantity">

<button
class="update-btn"
onclick="updateProductStock()">
Update Stock
</button>

</div>

<div class="card">

<div class="card-title">
🚨 Low Stock Warning
</div>

<div class="low-buttons">

<button
class="low-btn"
onclick="showLowStock(5)">
Less Than 5
(<span id="low5">0</span>)
</button>

<button
class="low-btn"
onclick="showLowStock(10)">
Less Than 10
(<span id="low10">0</span>)
</button>

<button
class="low-btn"
onclick="showLowStock(15)">
Less Than 15
(<span id="low15">0</span>)
</button>

<button
class="low-btn"
onclick="showLowStock(20)">
Less Than 20
(<span id="low20">0</span>)
</button>

</div>

<div
id="lowStockList"
class="low-list">

Select Filter

</div>

</div>

<div id="toast"></div>

<script>

/*************************************************
 * CHANGE THIS URL
 *************************************************/

const API_URL =
"https://script.google.com/macros/s/AKfycbyI9lCfbNcTT3xJrw5hr3TXRR1IZ-O6b3J7WGDryOcISL94nkPIHPabCvpOc0v5Vvfx/exec";

/*************************************************
 * GLOBALS
 *************************************************/

let products = [];
let selectedSKU = "";
let selectedAction = "";

/*************************************************
 * PAGE LOAD
 *************************************************/

window.onload = function(){

  checkConnection();
  loadProducts();
  loadDashboard();
  loadLowStockCounts();

};

/*************************************************
 * CONNECTION
 *************************************************/

async function checkConnection(){

  const res =
    await fetch(
      API_URL + "?action=connection"
    );

  const data =
    await res.json();

  const box =
    document.getElementById(
      "connectionStatus"
    );

  if(data.status){

    box.className =
      "status connected";

    box.innerHTML =
      "🟢 Connected";

  }
  else{

    box.className =
      "status disconnected";

    box.innerHTML =
      "🔴 Error";

  }

}

/*************************************************
 * PRODUCTS
 *************************************************/

async function loadProducts(){

  const res =
    await fetch(
      API_URL + "?action=products"
    );

  products =
    await res.json();

}

/*************************************************
 * DASHBOARD
 *************************************************/

async function loadDashboard(){

  let res1 =
    await fetch(
      API_URL + "?action=summary"
    );

  let summary =
    await res1.json();

  document.getElementById(
    "totalSKU"
  ).innerHTML =
    summary.totalProducts;

  document.getElementById(
    "totalStock"
  ).innerHTML =
    summary.totalStock;

  let res2 =
    await fetch(
      API_URL + "?action=sales"
    );

  let sales =
    await res2.json();

  document.getElementById(
    "todaySales"
  ).innerHTML =
    sales.totalSalesQty;

  document.getElementById(
    "topSKU"
  ).innerHTML =
    sales.topSellingSKU;

}

/*************************************************
 * SEARCH
 *************************************************/

function normalizeText(text){

  return text
  .toLowerCase()
  .replace(/-/g," ")
  .replace(/\s+/g," ")
  .trim();

}

document
.getElementById("search")
.addEventListener(
"input",
function(){

let search =
normalizeText(this.value);

let box =
document.getElementById(
"suggestions"
);

box.innerHTML = "";

if(search.length == 0)
return;

let words =
search.split(" ");

let result =
products.filter(item=>{

let sku =
normalizeText(item.sku);

return words.every(
word =>
sku.includes(word)
);

});

result.slice(0,30)
.forEach(item=>{

let div =
document.createElement("div");

div.className =
"suggestion-item";

div.innerHTML =
"📦 " + item.sku;

div.onclick =
()=>selectProduct(item.sku);

box.appendChild(div);

});

});

/*************************************************
 * SELECT PRODUCT
 *************************************************/

async function selectProduct(sku){

selectedSKU = sku;

document
.getElementById("search")
.value = sku;

document
.getElementById(
"suggestions"
)
.innerHTML = "";

let res =
await fetch(
API_URL +
"?action=product&sku=" +
encodeURIComponent(sku)
);

let data =
await res.json();

if(data.status){

showProduct(
data.data
);

}

}

/*************************************************
 * SHOW PRODUCT
 *************************************************/

function showProduct(item){

document
.getElementById(
"productCard"
)
.style.display =
"block";

document
.getElementById(
"productSKU"
)
.innerHTML =
item.sku;

document
.getElementById(
"opening"
)
.innerHTML =
item.opening;

document
.getElementById(
"inward"
)
.innerHTML =
item.inward;

document
.getElementById(
"reject"
)
.innerHTML =
item.reject;

document
.getElementById(
"sales"
)
.innerHTML =
item.sales;

document
.getElementById(
"stock"
)
.innerHTML =
item.stock;

document
.getElementById(
"productImage"
)
.src =
item.image ||
"https://via.placeholder.com/250";

}

/*************************************************
 * ACTION
 *************************************************/

function selectAction(
button,
action
){

document
.querySelectorAll(
".action-btn"
)
.forEach(btn=>{

btn.classList.remove(
"active"
);

});

button.classList.add(
"active"
);

selectedAction =
action;

}

/*************************************************
 * UPDATE STOCK
 *************************************************/

async function updateProductStock(){

let qty =
document
.getElementById("qty")
.value;

if(!selectedSKU){

showToast(
"Select Product",
"error"
);

return;

}

if(!selectedAction){

showToast(
"Select Action",
"error"
);

return;

}

let res =
await fetch(
API_URL,
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

sku:selectedSKU,

qty:qty,

action:selectedAction

})

}
);

let data =
await res.json();

if(data.status){

showProduct(
data.data
);

document
.getElementById(
"qty"
)
.value = "";

showToast(
data.message,
"success"
);

loadDashboard();
loadProducts();
loadLowStockCounts();

}
else{

showToast(
data.message,
"error"
);

}

}

/*************************************************
 * LOW STOCK
 *************************************************/

async function loadLowStockCounts(){

let res =
await fetch(
API_URL +
"?action=lowstockcounts"
);

let data =
await res.json();

document
.getElementById("low5")
.innerHTML =
data.less5;

document
.getElementById("low10")
.innerHTML =
data.less10;

document
.getElementById("low15")
.innerHTML =
data.less15;

document
.getElementById("low20")
.innerHTML =
data.less20;

}

async function showLowStock(limit){

let res =
await fetch(
API_URL +
"?action=lowstock&limit=" +
limit
);

let data =
await res.json();

let box =
document
.getElementById(
"lowStockList"
);

box.innerHTML = "";

if(data.count == 0){

box.innerHTML =
"✅ No Low Stock";

return;

}

data.items.forEach(item=>{

box.innerHTML += `

<div class="low-item">

<div>
<img src="${
item.image ||
'https://via.placeholder.com/50'
}">
</div>

<div style="flex:1;padding-left:10px;">
${item.sku}
</div>

<div>
Stock:
<b>${item.stock}</b>
</div>

</div>

`;

});

}

/*************************************************
 * TOAST
 *************************************************/

function showToast(
message,
type="success"
){

let toast =
document
.getElementById(
"toast"
);

toast.innerHTML =
message;

toast.className =
"";

toast.classList.add(
"show"
);

toast.classList.add(
type
);

setTimeout(()=>{

toast.classList.remove(
"show"
);

},2000);

}

</script>

</body>
</html>
