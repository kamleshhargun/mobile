<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pickup Return Daily Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>
<style>
/* ================================
   PREMIUM PROFESSIONAL LIGHT THEME
   Ready To Paste CSS
================================ */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",Roboto,Arial,sans-serif;
}

body{
background:#f4f7fb;
color:#222;
padding:20px;
}

.container{
max-width:760px;
margin:auto;
}

.card{
background:#ffffff;
border-radius:20px;
padding:22px;
margin-bottom:20px;
border:1px solid #e8edf4;
box-shadow:
0 8px 25px rgba(0,0,0,.06),
0 2px 6px rgba(0,0,0,.03);
transition:.3s;
}

.card:hover{
transform:translateY(-2px);
box-shadow:
0 12px 35px rgba(0,0,0,.08);
}

.title{
font-size:30px;
font-weight:700;
text-align:center;
margin-bottom:25px;
color:#0f172a;
letter-spacing:.3px;
}

.row{
display:flex;
gap:14px;
margin-bottom:14px;
}

button{
flex:1;
height:56px;
border:none;
border-radius:14px;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:.25s;
box-shadow:0 4px 12px rgba(0,0,0,.08);
}

button:hover{
transform:translateY(-2px);
box-shadow:0 10px 24px rgba(0,0,0,.12);
}

button:active{
transform:scale(.97);
}

.primary{
background:#2563eb;
color:#fff;
}

.primary:hover{
background:#1d4ed8;
}

.success{
background:#16a34a;
color:#fff;
}

.success:hover{
background:#15803d;
}

.warning{
background:#f59e0b;
color:#fff;
}

.warning:hover{
background:#d97706;
}

.danger{
background:#dc2626;
color:#fff;
}

.danger:hover{
background:#b91c1c;
}

.dark{
background:#334155;
color:#fff;
}

.dark:hover{
background:#1e293b;
}

label{
display:block;
font-size:14px;
font-weight:600;
margin-bottom:6px;
color:#475569;
}

input,
select{
width:100%;
height:55px;
padding:0 16px;
margin-bottom:16px;
font-size:15px;
border-radius:14px;
border:1px solid #dbe4ee;
background:#fff;
color:#111827;
outline:none;
transition:.25s;
}

input:focus,
select:focus{
border-color:#2563eb;
box-shadow:0 0 0 4px rgba(37,99,235,.15);
}

::placeholder{
color:#94a3b8;
}

#reader{
width:100%;
height:430px;
background:#f8fafc;
border:2px dashed #cbd5e1;
border-radius:18px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
box-shadow:inset 0 0 15px rgba(0,0,0,.03);
}

.cameraOff{
font-size:22px;
font-weight:600;
color:#94a3b8;
}

.statusBar{
margin-top:18px;
padding:16px;
border-radius:16px;
background:#eff6ff;
border:1px solid #bfdbfe;
color:#1d4ed8;
font-size:16px;
font-weight:700;
text-align:center;
}

.loader{
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
display:none;
align-items:center;
justify-content:center;
background:rgba(255,255,255,.75);
backdrop-filter:blur(6px);
z-index:99999;
}

.loader div{
width:65px;
height:65px;
border-radius:50%;
border:6px solid #dbeafe;
border-top:6px solid #2563eb;
animation:spin .9s linear infinite;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

.toast{
position:fixed;
left:50%;
bottom:30px;
transform:translateX(-50%);
background:#2563eb;
color:#fff;
padding:14px 24px;
border-radius:14px;
font-weight:600;
box-shadow:0 12px 35px rgba(37,99,235,.25);
display:none;
z-index:999999;
animation:fadeIn .3s ease;
}

@keyframes fadeIn{

from{
opacity:0;
transform:translate(-50%,20px);
}

to{
opacity:1;
transform:translate(-50%,0);
}

}

/* Result Card */

.resultCard{
margin-top:18px;
background:#ffffff;
border-radius:18px;
padding:18px;
border:1px solid #e5e7eb;
box-shadow:0 6px 18px rgba(0,0,0,.05);
}

.resultCard h3{
margin-bottom:15px;
font-size:18px;
color:#2563eb;
}

.resultItem{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 0;
border-bottom:1px solid #edf2f7;
}

.resultItem:last-child{
border:none;
}

.resultItem span:first-child{
font-weight:600;
color:#64748b;
}

.resultItem span:last-child{
font-weight:700;
color:#111827;
}

/* Mobile */

@media(max-width:768px){

body{
padding:14px;
}

.row{
flex-direction:column;
gap:12px;
}

button{
width:100%;
}

.card{
padding:18px;
border-radius:18px;
}

.title{
font-size:24px;
}

#reader{
height:340px;
}

input,
select{
height:52px;
}

}

</style>

</head>

<body>

<div class="loader" id="loader">
<div></div>
</div>

<div class="toast" id="toast"></div>

<div class="container">

<div class="card">

<div class="title">
Pickup Return Daily Scanner
</div>

<div class="row">

<button id="pickupBtn" class="primary">
Pickup
</button>

<button id="returnBtn" class="warning">
Return
</button>

</div>

<div class="row">

<button id="cameraBtn" class="success">
Camera
</button>

<button id="manualBtn" class="dark">
Manual
</button>

</div>

<div id="reader" class="cameraOff">
Camera OFF
</div>

<div class="statusBar" id="statusBar">
Ready
</div>

</div>

<div class="card">

<label>AWB</label>
<input id="awb">

<label>Order ID</label>
<input id="orderId">

<label>Courier</label>
<input id="courier">

<label>Status</label>
<input id="status">

<div class="row">

<button id="saveBtn" class="success">
Save
</button>

<button id="nextBtn" class="primary">
Next
</button>

<button id="editBtn" class="warning">
Edit
</button>

</div>

</div>

</div>

<script>

const API_URL="https://script.google.com/macros/s/AKfycbx7tM4MntjtYN2221aGZAQP68KapgXMLpN6ftZZbAvQduxAGAH4S4d0b33lqDU3Efjs/exec";

let TYPE="Pickup";
let CAMERA=false;
let qrScanner=null;
let saving=false;

const $=id=>document.getElementById(id);

const fields=[
"awb",
"orderId",
"courier",
"status"
];

function toast(msg){
const t=$("toast");
t.innerHTML=msg;
t.style.display="block";
setTimeout(()=>t.style.display="none",2500);
}

function loader(v){
$("loader").style.display=v?"flex":"none";
}

function setStatus(t){
$("statusBar").innerHTML=t;
}

function clearForm(){

fields.forEach(f=>$(f).value="");

}

function formData(){

return{

type:TYPE,
awb:$("awb").value.trim(),
orderId:$("orderId").value.trim(),
courier:$("courier").value.trim(),
status:$("status").value.trim(),
customerName:$("customerName").value.trim(),
city:$("city").value.trim(),
state:$("state").value.trim(),
destination:$("destination").value.trim(),
pickupDate:$("pickupDate").value.trim(),
deliveredDate:$("deliveredDate").value.trim(),
expectedDate:$("expectedDate").value.trim(),
isRTO:false

};

}

/*************** CONTINUED IN index.html PART 2 ***************/


async function api(action, data = {}) {

    loader(true);

    try {

        const res = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
                action,
                ...data
            })
        });

        const json = await res.json();

        loader(false);

        return json;

    } catch (e) {

        loader(false);

        toast(e.message || String(e));

        return {
            success: false,
            message: e.message || String(e)
        };

    }

}

function fillForm(d){
$("awb").value=d.awb||"";
$("orderId").value=d.orderId||"";
$("courier").value=d.courier||"";
$("status").value=d.status||"";
$("customerName").value=d.customerName||"";
$("city").value=d.city||"";
$("state").value=d.state||"";
$("destination").value=d.destination||"";
$("pickupDate").value=d.pickupDate||"";
$("deliveredDate").value=d.deliveredDate||"";
$("expectedDate").value=d.expectedDate||"";
}

async function afterScan(code){

if(!code)return;

if(CAMERA){
await stopCamera();
}

$("awb").value=code;

setStatus("Checking Duplicate...");

const dup=await api("duplicate",{awb:code,type:TYPE});

if(dup.success&&dup.duplicate){
toast(TYPE+" already exists");
setStatus(TYPE+" already exists");
return;
}

setStatus("Tracking...");

const track=await api("track",{awb:code});

if(track.success){
fillForm(track);
toast("Tracking Loaded");
setStatus("Ready To Save");
}else{
toast(track.message||"Tracking Not Found");
setStatus("Manual Entry");
}

}

async function startCamera(){

if(CAMERA)return;

CAMERA=true;

$("reader").classList.remove("cameraOff");

$("reader").innerHTML="";

qrScanner=new Html5Qrcode("reader");

const config={
fps:10,
qrbox:{width:250,height:250},
rememberLastUsedCamera:true
};

try{

const cameras=await Html5Qrcode.getCameras();

if(!cameras.length){
toast("Camera Not Found");
CAMERA=false;
return;
}

await qrScanner.start(
{facingMode:"environment"},
config,
decoded=>{
afterScan(decoded);
},
err=>{}
);

setStatus("Camera ON");

}catch(e){

CAMERA=false;

toast(e.message);

$("reader").innerHTML="Camera OFF";

$("reader").classList.add("cameraOff");

}

}

async function stopCamera(){

if(!CAMERA)return;

try{

await qrScanner.stop();

await qrScanner.clear();

}catch(e){}

CAMERA=false;

$("reader").classList.add("cameraOff");

$("reader").innerHTML="Camera OFF";

setStatus("Camera OFF");

}

async function saveRecord(){

if(saving)return;

saving=true;

const data=formData();

if(data.awb==""){
toast("Enter AWB");
saving=false;
return;
}

const res=await api("save",data);

saving=false;

if(res.success){

toast("Saved Successfully");

setStatus("Saved Successfully");

}else{

toast(res.message||"Save Failed");

setStatus("Save Failed");

}

}

function nextRecord(){

clearForm();

$("awb").focus();

setStatus("Next Record");

}

async function editRecord(){

const data=formData();

if(data.awb==""){
toast("Enter AWB");
return;
}

const res=await api("update",data);

if(res.success){

toast("Updated");

setStatus("Updated Successfully");

}else{

toast(res.message);

}

}

$("pickupBtn").onclick=()=>{

TYPE="Pickup";

$("pickupBtn").className="success";

$("returnBtn").className="warning";

setStatus("Pickup Mode");

};

$("returnBtn").onclick=()=>{

TYPE="Return";

$("pickupBtn").className="primary";

$("returnBtn").className="success";

setStatus("Return Mode");

};

$("cameraBtn").onclick=()=>{

CAMERA?stopCamera():startCamera();

};

$("manualBtn").onclick=async()=>{

await stopCamera();

$("awb").focus();

};

$("saveBtn").onclick=saveRecord;

$("nextBtn").onclick=nextRecord;

$("editBtn").onclick=editRecord;

$("awb").addEventListener("keydown",e=>{

if(e.key==="Enter"){

afterScan($("awb").value.trim());

}

});

document.addEventListener("keydown",e=>{

if(e.key==="F2")saveRecord();

if(e.key==="F4")nextRecord();

if(e.key==="Escape")stopCamera();

});

window.onload=()=>{

setStatus("Ready");

$("awb").focus();

};

/******************** END OF index.html PART 2 ********************/
</script>
</body>
</html>
