<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pickup Return Daily Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>
<style>
/* ==========================================
   PREMIUM LIGHT THEME
   PART-1
========================================== */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",Roboto,Arial,sans-serif;
}

:root{

--primary:#2563eb;
--primary-dark:#1d4ed8;

--green:#16a34a;
--green-dark:#15803d;

--red:#dc2626;
--red-dark:#b91c1c;

--gray:#475569;
--gray-dark:#334155;

--bg:#f4f7fb;
--card:#ffffff;
--border:#dbe4ee;
--text:#111827;

}

body{

background:var(--bg);
color:var(--text);
padding:20px;

}

.container{

max-width:760px;
margin:auto;

}

.card{

background:#fff;
border-radius:22px;
padding:22px;
margin-bottom:22px;
border:1px solid #e5e7eb;

box-shadow:
0 8px 25px rgba(0,0,0,.05),
0 2px 8px rgba(0,0,0,.04);

transition:.3s;

}

.card:hover{

transform:translateY(-2px);

box-shadow:
0 15px 40px rgba(0,0,0,.08);

}

.title{

font-size:30px;
font-weight:700;
text-align:center;
margin-bottom:25px;
color:#0f172a;

}

.row{

display:flex;
gap:14px;
margin-bottom:14px;

}

.modeRow{

margin-bottom:16px;

}

button{

flex:1;
height:56px;
font-size:16px;
font-weight:700;
cursor:pointer;
transition:.25s;
border:none;
outline:none;

}

button:hover{

transform:translateY(-2px);

box-shadow:
0 10px 20px rgba(0,0,0,.12);

}

button:active{

transform:scale(.97);

}

/* ===========================
   PICKUP BUTTON
=========================== */

.pickupBtn{

background:#fff;
color:var(--green);

border:2px solid var(--green);

border-radius:40px;

}

.pickupBtn.active{

background:var(--green);

color:#fff;

}

/* ===========================
   RETURN BUTTON
=========================== */

.returnBtn{

background:#fff;
color:var(--red);

border:2px solid var(--red);

border-radius:40px;

}

.returnBtn.active{

background:var(--red);

color:#fff;

}

/* ===========================
   CAMERA BUTTON
=========================== */

.cameraBtn{

background:#fff;

color:var(--primary);

border:2px solid var(--primary);

border-radius:14px;

}

.cameraBtn.active{

background:var(--primary);

color:#fff;

}

/* ===========================
   MANUAL BUTTON
=========================== */

.manualBtn{

background:#fff;

color:var(--gray);

border:2px solid var(--gray);

border-radius:14px;

}

.manualBtn.active{

background:var(--gray);

color:#fff;

}

/* ===========================
SAVE
=========================== */

.saveBtn{

background:var(--green);

color:#fff;

border-radius:14px;

}

/* ===========================
NEXT
=========================== */

.nextBtn{

background:var(--primary);

color:#fff;

border-radius:14px;

}

/* ===========================
EDIT
=========================== */

.editBtn{

background:#f59e0b;

color:#fff;

border-radius:14px;

}

/* ===========================
LABEL
=========================== */

label{

display:block;
font-size:14px;
font-weight:700;
margin-bottom:6px;
color:#64748b;

}

/* ===========================
INPUT
=========================== */

input{

width:100%;
height:56px;

padding:0 16px;

font-size:15px;

border-radius:14px;

border:1px solid var(--border);

background:#fff;

outline:none;

transition:.25s;

margin-bottom:16px;

}

input:focus{

border-color:var(--primary);

box-shadow:
0 0 0 4px rgba(37,99,235,.15);

}

::placeholder{

color:#94a3b8;

}
/* ==========================================
   PREMIUM LIGHT THEME
   PART-2
========================================== */

/* ===========================
   CAMERA CARD
=========================== */

.cameraCard{

margin-top:18px;
margin-bottom:18px;

background:#fff;

border-radius:20px;

padding:12px;

border:1px solid #e5e7eb;

box-shadow:
0 6px 20px rgba(0,0,0,.05);

}

/* ===========================
   CAMERA
=========================== */

#reader{

width:100%;
height:340px;

border-radius:16px;

overflow:hidden;

background:#f8fafc;

border:2px dashed #cbd5e1;

display:flex;
align-items:center;
justify-content:center;

transition:.3s;

}

#reader:hover{

border-color:#2563eb;

}

.cameraOff{

font-size:22px;

font-weight:700;

color:#94a3b8;

}

/* ===========================
STATUS
=========================== */

.statusBar{

margin-top:18px;

padding:16px;

border-radius:14px;

background:#eff6ff;

border:1px solid #bfdbfe;

color:#2563eb;

font-weight:700;

text-align:center;

}

/* ===========================
RESULT CARD
=========================== */

.resultCard{

background:#fff;

border-radius:18px;

padding:18px;

border:1px solid #e5e7eb;

box-shadow:
0 5px 15px rgba(0,0,0,.05);

margin-top:18px;

}

.resultItem{

display:flex;

justify-content:space-between;

padding:12px 0;

border-bottom:1px solid #eef2f7;

}

.resultItem:last-child{

border-bottom:none;

}

/* ===========================
LOADER
=========================== */

.loader{

position:fixed;

left:0;
top:0;

width:100%;
height:100%;

display:none;

align-items:center;
justify-content:center;

background:rgba(255,255,255,.8);

backdrop-filter:blur(5px);

z-index:99999;

}

.loader div{

width:65px;
height:65px;

border-radius:50%;

border:6px solid #dbeafe;

border-top:6px solid #2563eb;

animation:spin 1s linear infinite;

}

@keyframes spin{

100%{

transform:rotate(360deg);

}

}

/* ===========================
TOAST
=========================== */

.toast{

position:fixed;

left:50%;
bottom:25px;

transform:translateX(-50%);

padding:14px 24px;

border-radius:14px;

background:#111827;

color:#fff;

font-weight:600;

display:none;

box-shadow:
0 10px 25px rgba(0,0,0,.2);

z-index:999999;

animation:fadeIn .3s;

}

@keyframes fadeIn{

from{

opacity:0;
transform:translate(-50%,20px);

}

to{

opacity:1;
transform:translate(-50%,0);

}

}

/* ===========================
MOBILE
=========================== */

@media(max-width:768px){

body{

padding:14px;

}

.container{

max-width:100%;

}

.card{

padding:16px;

border-radius:18px;

}

.title{

font-size:22px;

margin-bottom:18px;

}

/* Buttons horizontal */

.row{

display:flex;

flex-direction:row;

gap:10px;

}

button{

height:50px;

font-size:15px;

}

#reader{

height:250px;

}

.statusBar{

font-size:14px;

padding:14px;

}

input{

height:50px;

font-size:14px;

}

}

/* ===========================
SMOOTH EFFECTS
=========================== */

button,
input,
.card,
#reader{

transition:.25s ease;

}

button:hover{

transform:translateY(-2px);

}

button:active{

transform:scale(.97);

}

.card:hover{

transform:translateY(-2px);

}

/* Optional Active Glow */

.pickupBtn.active,
.returnBtn.active,
.cameraBtn.active,
.manualBtn.active{

box-shadow:0 0 0 4px rgba(37,99,235,.08);

}

</style>

</head>

<body>

<div class="loader" id="loader">
    <div></div>
</div>

<div class="toast" id="toast"></div>

<div class="container">

    <!-- Scanner Card -->
    <div class="card">

        <div class="title">
            📦 Pickup Return Scanner
        </div>

        <!-- Pickup / Return -->
        <div class="row modeRow">

            <button id="pickupBtn" class="pickupBtn active">
                📥 Pickup
            </button>

            <button id="returnBtn" class="returnBtn">
                ↩ Return
            </button>

        </div>

        <!-- Camera / Manual -->
        <div class="row modeRow">

            <button id="cameraBtn" class="cameraBtn active">
                📷 Camera
            </button>

            <button id="manualBtn" class="manualBtn">
                ⌨ Manual
            </button>

        </div>

        <!-- Camera -->
        <div class="cameraCard">

            <div id="reader" class="cameraOff">
                Camera OFF
            </div>

        </div>

        <!-- Status -->
        <div class="statusBar" id="statusBar">
            ✅ Ready
        </div>

    </div>

    <!-- Result Card -->
    <div class="card">

        <label>AWB</label>
        <input id="awb" placeholder="Scan or Enter AWB">

        <label>Order ID</label>
        <input id="orderId" placeholder="Order ID">

        <label>Courier</label>
        <input id="courier" placeholder="Courier Name">

        <label>Status</label>
        <input id="status" placeholder="Current Status">

        <div class="row">

            <button id="saveBtn" class="saveBtn">
                💾 Save
            </button>

            <button id="nextBtn" class="nextBtn">
                ➜ Next
            </button>

            <button id="editBtn" class="editBtn">
                ✏ Edit
            </button>

        </div>

    </div>

</div>

<script>

const API_URL="https://script.google.com/macros/s/AKfycbx7tM4MntjtYN2221aGZAQP68KapgXMLpN6ftZZbAvQduxAGAH4S4d0b33lqDU3Efjs/exec";

let TYPE="Pickup";
let CAMERA=false;
let qrScanner=null;
let saving=false;

const $=id=>document.getElementById(id);

const fields=[
"awb",
"orderId",
"courier",
"status"
];

function toast(msg){
const t=$("toast");
t.innerHTML=msg;
t.style.display="block";
setTimeout(()=>t.style.display="none",2500);
}

function loader(v){
$("loader").style.display=v?"flex":"none";
}

function setStatus(t){
$("statusBar").innerHTML=t;
}

function clearForm(){

fields.forEach(f=>$(f).value="");

}

function formData(){

return{

type:TYPE,
awb:$("awb").value.trim(),
orderId:$("orderId").value.trim(),
courier:$("courier").value.trim(),
status:$("status").value.trim(),
customerName:$("customerName").value.trim(),
city:$("city").value.trim(),
state:$("state").value.trim(),
destination:$("destination").value.trim(),
pickupDate:$("pickupDate").value.trim(),
deliveredDate:$("deliveredDate").value.trim(),
expectedDate:$("expectedDate").value.trim(),
isRTO:false

};

}




async function api(action, data = {}) {

    loader(true);

    try {

        const res = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
                action,
                ...data
            })
        });

        const json = await res.json();

        loader(false);

        return json;

    } catch (e) {

        loader(false);

        toast(e.message || String(e));

        return {
            success: false,
            message: e.message || String(e)
        };

    }

}

function fillForm(d){
$("awb").value=d.awb||"";
$("orderId").value=d.orderId||"";
$("courier").value=d.courier||"";
$("status").value=d.status||"";
$("customerName").value=d.customerName||"";
$("city").value=d.city||"";
$("state").value=d.state||"";
$("destination").value=d.destination||"";
$("pickupDate").value=d.pickupDate||"";
$("deliveredDate").value=d.deliveredDate||"";
$("expectedDate").value=d.expectedDate||"";
}

async function afterScan(code){

if(!code)return;

if(CAMERA){
await stopCamera();
}

$("awb").value=code;

setStatus("Checking Duplicate...");

const dup=await api("duplicate",{awb:code,type:TYPE});

if(dup.success&&dup.duplicate){
toast(TYPE+" already exists");
setStatus(TYPE+" already exists");
return;
}

setStatus("Tracking...");

const track=await api("track",{awb:code});

if(track.success){
fillForm(track);
toast("Tracking Loaded");
setStatus("Ready To Save");
}else{
toast(track.message||"Tracking Not Found");
setStatus("Manual Entry");
}

}

async function startCamera(){

if(CAMERA)return;

CAMERA=true;

$("reader").classList.remove("cameraOff");

$("reader").innerHTML="";

qrScanner=new Html5Qrcode("reader");

const reader = document.getElementById("reader");

const size = Math.min(
    reader.clientWidth,
    reader.clientHeight
);

const config = {
    fps: 10,
    qrbox: {
        width: size,
        height: size
    },
    rememberLastUsedCamera: true
};

try{

const cameras=await Html5Qrcode.getCameras();

if(!cameras.length){
toast("Camera Not Found");
CAMERA=false;
return;
}

await qrScanner.start(
{facingMode:"environment"},
config,
decoded=>{
afterScan(decoded);
},
err=>{}
);

setStatus("Camera ON");

}catch(e){

CAMERA=false;

toast(e.message);

$("reader").innerHTML="Camera OFF";

$("reader").classList.add("cameraOff");

}

}

async function stopCamera(){

if(!CAMERA)return;

try{

await qrScanner.stop();

await qrScanner.clear();

}catch(e){}

CAMERA=false;

$("reader").classList.add("cameraOff");

$("reader").innerHTML="Camera OFF";

setStatus("Camera OFF");

}

async function saveRecord(){

if(saving)return;

saving=true;

const data=formData();

if(data.awb==""){
toast("Enter AWB");
saving=false;
return;
}

const res=await api("save",data);

saving=false;

if(res.success){

toast("Saved Successfully");

setStatus("Saved Successfully");

}else{

toast(res.message||"Save Failed");

setStatus("Save Failed");

}

}

function nextRecord(){

clearForm();

$("awb").focus();

setStatus("Next Record");

}

async function editRecord(){

const data=formData();

if(data.awb==""){
toast("Enter AWB");
return;
}

const res=await api("update",data);

if(res.success){

toast("Updated");

setStatus("Updated Successfully");

}else{

toast(res.message);

}

}

$("pickupBtn").onclick=()=>{

TYPE="Pickup";

$("pickupBtn").className="success";

$("returnBtn").className="warning";

setStatus("Pickup Mode");

};

$("returnBtn").onclick=()=>{

TYPE="Return";

$("pickupBtn").className="primary";

$("returnBtn").className="success";

setStatus("Return Mode");

};

$("cameraBtn").onclick=()=>{

CAMERA?stopCamera():startCamera();

};

$("manualBtn").onclick=async()=>{

await stopCamera();

$("awb").focus();

};

$("saveBtn").onclick=saveRecord;

$("nextBtn").onclick=nextRecord;

$("editBtn").onclick=editRecord;

$("awb").addEventListener("keydown",e=>{

if(e.key==="Enter"){

afterScan($("awb").value.trim());

}

});

document.addEventListener("keydown",e=>{

if(e.key==="F2")saveRecord();

if(e.key==="F4")nextRecord();

if(e.key==="Escape")stopCamera();

});

window.onload=()=>{

setStatus("Ready");

$("awb").focus();

};
pickupBtn.classList.add("active");
returnBtn.classList.remove("active");

cameraBtn.classList.add("active");
manualBtn.classList.remove("active");
/******************** END OF index.html PART 2 ********************/
</script>
</body>
</html>
