<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tracking Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

:root{
    --bg:#0f172a;
    --card:#1e293b;
    --hover:#2563eb;
    --text:#ffffff;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
    font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
}

.sidebar{
    width:260px;
    background:#111827;
    height:100vh;
    position:fixed;
    left:0;
    top:0;
    padding:20px;
    overflow-y:auto;
    z-index:1000;
}

.logo{
    font-size:24px;
    font-weight:700;
    margin-bottom:25px;
    text-align:center;
}

.menu-btn{
    width:100%;
    border:none;
    margin-bottom:12px;
    padding:14px;
    border-radius:12px;
    background:#1f2937;
    color:#fff;
    text-align:left;
    transition:.3s;
    font-size:15px;
}

.menu-btn:hover{
    background:var(--hover);
}

.menu-btn.active{
    background:var(--hover);
}

.main{
    margin-left:260px;
    height:100vh;
    display:flex;
    flex-direction:column;
}

.topbar{
    background:#111827;
    padding:12px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #334155;
}

.dashboard-cards{
    display:flex;
    gap:15px;
    padding:15px;
    flex-wrap:wrap;
}

.card-box{
    background:var(--card);
    border-radius:15px;
    padding:15px;
    min-width:180px;
    flex:1;
}

.card-title{
    font-size:13px;
    opacity:.8;
}

.card-value{
    font-size:24px;
    font-weight:700;
}

.frame-container{
    flex:1;
    padding:0 15px 15px;
}

iframe{
    width:100%;
    height:100%;
    border:none;
    border-radius:15px;
    background:#fff;
}

.mobile-toggle{
    display:none;
}

@media(max-width:768px){

    .sidebar{
        left:-260px;
        transition:.3s;
    }

    .sidebar.show{
        left:0;
    }

    .main{
        margin-left:0;
    }

    .mobile-toggle{
        display:block;
    }

    .dashboard-cards{
        flex-direction:column;
    }
}

</style>
</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar" id="sidebar">

    <div class="logo">
        TRACKING HUB
    </div>

    <button class="menu-btn active"
            onclick="loadPage('kone.html',this)">
        🚚 KONE
    </button>

    <button class="menu-btn"
            onclick="loadPage('counts.html',this)">
        📊 COUNTS
    </button>

    <button class="menu-btn"
            onclick="loadPage('logistic.html',this)">
        📦 LOGISTICS
    </button>

</div>

<!-- MAIN -->

<div class="main">

    <div class="topbar">

        <button class="btn btn-primary mobile-toggle"
                onclick="toggleSidebar()">
            ☰
        </button>

        <h5 class="m-0">
            Shopify Tracking Dashboard
        </h5>

        <span id="currentPage">
            KONE
        </span>

    </div>

    <!-- CARDS -->

    <div class="dashboard-cards">

        <div class="card-box">
            <div class="card-title">Current Module</div>
            <div class="card-value" id="moduleName">KONE</div>
        </div>

        <div class="card-box">
            <div class="card-title">Status</div>
            <div class="card-value">ONLINE</div>
        </div>

        <div class="card-box">
            <div class="card-title">Platform</div>
            <div class="card-value">Harsidhi</div>
        </div>

    </div>

    <!-- IFRAME -->

    <div class="frame-container">

        <iframe
            id="contentFrame"
            src="kone.html">
        </iframe>

    </div>

</div>

<script>

function loadPage(page,btn){

    document.getElementById("contentFrame").src=page;

    let title="";

    if(page==="kone.html"){
        title="KONE";
    }

    if(page==="counts.html"){
        title="COUNTS";
    }

    if(page==="logistic.html"){
        title="LOGISTICS";
    }

    document.getElementById("currentPage").innerText=title;
    document.getElementById("moduleName").innerText=title;

    document.querySelectorAll(".menu-btn")
    .forEach(x=>x.classList.remove("active"));

    btn.classList.add("active");

    if(window.innerWidth<768){
        document.getElementById("sidebar")
        .classList.remove("show");
    }
}

function toggleSidebar(){
    document.getElementById("sidebar")
    .classList.toggle("show");
}

</script>

</body>
</html>
