<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Harsidhi Ventures Pickup Return System</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif
}

body{
background:linear-gradient(
180deg,
#f8fafc 0%,
#eef4ff 100%
);
min-height:100vh;
color:#1f2937;
overflow-x:hidden;
}

.header{
height:72px;
background:linear-gradient(
135deg,
#2563eb,
#1d4ed8
);
display:flex;
align-items:center;
justify-content:center;
padding:0 15px;
font-size:20px;
font-weight:700;
color:#fff;
text-align:center;
letter-spacing:.4px;
box-shadow:
0 8px 25px rgba(37,99,235,.25);
}

.main{
padding:18px;
display:flex;
justify-content:center;
align-items:flex-start;
}

.panel{
width:100%;
max-width:720px;
background:#fff;
border-radius:24px;
overflow:hidden;
box-shadow:
0 10px 40px rgba(0,0,0,.08);
border:1px solid rgba(255,255,255,.6);
}

.center-content{
padding:22px;
display:flex;
flex-direction:column;
gap:18px;
}

.mode-row{
display:flex;
gap:12px;
}

.mode-btn{
flex:1;
height:64px;
border:none;
border-radius:18px;
font-size:18px;
font-weight:700;
cursor:pointer;
transition:.25s;
position:relative;
overflow:hidden;
}

.mode-btn:hover{
transform:translateY(-2px);
}

.pickup{
background:#fff;
border:2px solid #2563eb;
color:#2563eb;
}

.return{
background:#fff;
border:2px solid #f97316;
color:#f97316;
}

.active-pickup{
background:linear-gradient(
135deg,
#2563eb,
#1d4ed8
);
color:#fff;
border:none;
box-shadow:
0 10px 25px rgba(37,99,235,.3);
}

.active-return{
background:linear-gradient(
135deg,
#f97316,
#ea580c
);
color:#fff;
border:none;
box-shadow:
0 10px 25px rgba(249,115,22,.3);
}

.scan-panel{
display:none;
flex-direction:column;
gap:14px;
padding:20px;
background:#f8fbff;
border:1px solid #dbeafe;
border-radius:20px;
}

.btn{
border:none;
border-radius:16px;
padding:14px 18px;
font-size:15px;
font-weight:600;
cursor:pointer;
transition:.25s;
}

.btn:hover{
transform:translateY(-2px);
}

.btn-camera{
background:linear-gradient(
135deg,
#2563eb,
#1d4ed8
);
color:#fff;
box-shadow:
0 8px 20px rgba(37,99,235,.25);
}

.btn-manual{
background:linear-gradient(
135deg,
#475569,
#334155
);
color:#fff;
}

.btn-save{
background:linear-gradient(
135deg,
#10b981,
#059669
);
color:#fff;
box-shadow:
0 8px 20px rgba(16,185,129,.25);
}

.btn-stop{
background:linear-gradient(
135deg,
#ef4444,
#dc2626
);
color:#fff;
box-shadow:
0 8px 20px rgba(239,68,68,.25);
}

.action-row{
display:flex;
gap:12px;
}

.action-row .btn{
flex:1;
}

.input{
width:100%;
height:56px;
padding:0 18px;
border:2px solid #dbe2ea;
border-radius:16px;
font-size:16px;
background:#fff;
outline:none;
transition:.2s;
}

.input:focus{
border-color:#2563eb;
box-shadow:
0 0 0 4px rgba(
37,
99,
235,
.12
);
}

#reader{
display:none;
width:100%;
overflow:hidden;
border-radius:20px;
border:2px solid #dbeafe;
background:#fff;
}

.result-card{
display:none;
padding:18px;
background:#fff;
border-radius:18px;
border:1px solid #e5e7eb;
font-size:14px;
line-height:1.8;
box-shadow:
0 5px 20px rgba(0,0,0,.05);
}

.result-card b{
color:#111827;
}

.toast{
position:fixed;
bottom:25px;
left:50%;
transform:translateX(-50%);
background:#111827;
color:#fff;
padding:14px 22px;
border-radius:16px;
font-size:14px;
font-weight:600;
z-index:99999;
box-shadow:
0 10px 25px rgba(0,0,0,.25);
animation:toastIn .25s ease;
}

@keyframes toastIn{
from{
opacity:0;
transform:
translateX(-50%)
translateY(20px);
}
to{
opacity:1;
transform:
translateX(-50%)
translateY(0);
}
}

#loadingOverlay{
display:none;
position:fixed;
inset:0;
background:
rgba(255,255,255,.85);
backdrop-filter:blur(5px);
z-index:999999;
align-items:center;
justify-content:center;
flex-direction:column;
font-size:22px;
font-weight:700;
color:#2563eb;
}

#loadingOverlay::before{
content:"";
width:60px;
height:60px;
border:5px solid #dbeafe;
border-top-color:#2563eb;
border-radius:50%;
animation:spin 1s linear infinite;
margin-bottom:15px;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

@media(max-width:768px){

.header{
font-size:16px;
padding:0 12px;
line-height:1.4;
}

.main{
padding:12px;
}

.center-content{
padding:16px;
}

.mode-btn{
height:58px;
font-size:16px;
}

.action-row{
flex-direction:column;
}

.action-row .btn{
width:100%;
}

.input{
height:54px;
font-size:15px;
}

.btn{
padding:13px 16px;
font-size:14px;
}
}

@media(max-width:480px){

.header{
font-size:15px;
}

.panel{
border-radius:20px;
}

.scan-panel{
padding:15px;
}

.result-card{
font-size:13px;
}
}
</style>
</head>

<body>

<div class="header">
HARSIDHI VENTURES PICKUP RETURN SYSTEM
</div>

<div class="main">

<div class="panel">

<div class="center-content">

<div class="mode-row">
<button id="pickupBtn" class="mode-btn pickup" onclick="selectType('Pickup')">Pickup</button>
<button id="returnBtn" class="mode-btn return" onclick="selectType('Return')">Return</button>
</div>

<div id="scanPanel" class="scan-panel">

<button class="btn btn-camera" onclick="startCamera()">
📷 Camera Scan
</button>

<button class="btn btn-manual" onclick="focusAWB()">
⌨ Manual / Scanner
</button>

<div id="reader"></div>

<input
id="awbInput"
class="input"
placeholder="Scan AWB">

<input
id="orderInput"
class="input"
placeholder="Order ID (Manual Fallback)">

<div
id="resultCard"
class="result-card">
</div>

<div class="action-row">

<button
class="btn btn-save"
onclick="saveEntry()">
Next
</button>

<button
class="btn btn-stop"
onclick="stopWork()">
Stop
</button>

</div>

</div>

</div>

</div>

</div>

<div id="loadingOverlay">
Loading...
</div>

<script>

/* ===================================
CONFIG
=================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbzCx2cLgXw_rgA0T8_dgfAqRAGtTpBsIhM-xeysJcCbbrpn7mH0g1g13Au4KpiCPH8/exec";

/* ===================================
GLOBAL
=================================== */

let currentType = "";

let currentTracking = null;

let html5QrCode = null;

const beep =
new Audio(
"https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"
);

/* ===================================
TYPE SELECT
=================================== */

function selectType(type){

  currentType = type;

  document
    .getElementById("scanPanel")
    .style.display = "flex";

  document
    .getElementById("pickupBtn")
    .classList.remove(
      "active-pickup"
    );

  document
    .getElementById("returnBtn")
    .classList.remove(
      "active-return"
    );

  if(type === "Pickup"){

    document
      .getElementById("pickupBtn")
      .classList.add(
        "active-pickup"
      );

  }else{

    document
      .getElementById("returnBtn")
      .classList.add(
        "active-return"
      );

  }

  clearForm();

  document
    .getElementById("awbInput")
    .focus();

}

/* ===================================
CLEAR FORM
=================================== */

function clearForm(){

  currentTracking = null;

  document
    .getElementById("awbInput")
    .value = "";

  document
    .getElementById("orderInput")
    .value = "";

  document
    .getElementById("orderInput")
    .style.display = "none";

  document
    .getElementById("resultCard")
    .style.display = "none";

  document
    .getElementById("resultCard")
    .innerHTML = "";

}

/* ===================================
FOCUS AWB
=================================== */

function focusAWB(){

  document
    .getElementById("awbInput")
    .focus();

}

/* ===================================
CAMERA START
=================================== */

async function startCamera(){

  try{

    if(html5QrCode){

      await stopCamera();

    }

    document
      .getElementById("reader")
      .style.display = "block";

    html5QrCode =
      new Html5Qrcode(
        "reader"
      );

    await html5QrCode.start(

      {
        facingMode:
          "environment"
      },

      {

        fps:20,

        qrbox:{
          width:280,
          height:140
        }

      },

      function(decodedText){

        document
          .getElementById("awbInput")
          .value =
          decodedText;

        beep.play();

        stopCamera();

        trackShipment();

      }

    );

  }catch(err){

    toast(
      "Camera Error"
    );

    console.log(err);

  }

}

/* ===================================
STOP CAMERA
=================================== */

async function stopCamera(){

  try{

    if(html5QrCode){

      await html5QrCode.stop();

      await html5QrCode.clear();

      html5QrCode = null;

    }

  }catch(err){}

  document
    .getElementById("reader")
    .style.display = "none";

}

/* ===================================
AUTO TRACK
=================================== */

document
.getElementById("awbInput")
.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){

      trackShipment();

    }

  }
);

/* ===================================
USB SCANNER SUPPORT
=================================== */

let scannerBuffer = "";

document.addEventListener(
  "keydown",
  function(e){

    if(
      document.activeElement.id !== "awbInput"
    ){
      return;
    }

    if(e.key === "Enter"){

      e.preventDefault();

      const awb = scannerBuffer.trim();

      if(awb.length > 5){

        document
          .getElementById("awbInput")
          .value = awb;

        trackShipment();
      }

      scannerBuffer = "";

      return;
    }

    if(e.key.length === 1){

      scannerBuffer += e.key;

    }

  }
);

/* ===================================
TRACK SHIPMENT
=================================== */

async function trackShipment(){

  const awb =

    document
      .getElementById(
        "awbInput"
      )
      .value
      .trim();

  if(!awb){

    toast(
      "Scan AWB"
    );

    return;

  }

  showLoading();

  try{

    const response =
      await fetch(

        API_URL +

        "?action=trackShipment&awb=" +

        encodeURIComponent(
          awb
        )

      );

    const result =
      await response.json();

    if(result.success){

      currentTracking =
        result;

      renderTracking(
        result
      );

      return;

    }

    openManualOrder();

  }catch(err){

    console.log(err);

    openManualOrder();

  }

}

/* ===================================
FALLBACK MODE
=================================== */

function openManualOrder(){

  currentTracking = null;

  const card =
    document
      .getElementById(
        "resultCard"
      );

  card.style.display =
    "block";

  card.innerHTML = `

    <div
    style="
      color:#dc2626;
      font-weight:600;
    ">

    Tracking Not Found

    </div>

    <div
    style="
      margin-top:8px;
    ">

    Enter Order ID
    manually

    </div>

  `;

  document
    .getElementById(
      "orderInput"
    )
    .style.display =
    "block";

  document
    .getElementById(
      "orderInput"
    )
    .focus();

}

/* ===================================
RENDER TRACKING
=================================== */

function renderTracking(data){

  const card =
    document
      .getElementById(
        "resultCard"
      );

  card.style.display =
    "block";

  card.innerHTML = `

    <b>AWB:</b>
    ${data.awb || ""}
    <br>

    <b>Order ID:</b>
    ${data.orderId || ""}
    <br>

    <b>Status:</b>
    ${data.status || ""}
    <br>

    <b>Courier:</b>
    ${data.courier || ""}
    <br>

    <b>Name:</b>
    ${data.customerName || ""}
    <br>

    <b>City:</b>
    ${data.city || ""}

  `;

  document
    .getElementById(
      "orderInput"
    )
    .value =

    data.orderId || "";

}

/* ===================================
LOADING
=================================== */

function showLoading(){

  const card =
    document
      .getElementById(
        "resultCard"
      );

  card.style.display =
    "block";

  card.innerHTML =
    "Fetching Tracking...";

}

/* ===================================
STOP WORK
=================================== */

function stopWork(){

  stopCamera();

  currentType = "";

  clearForm();

  document
    .getElementById(
      "scanPanel"
    )
    .style.display =
    "none";

  document
    .getElementById(
      "pickupBtn"
    )
    .classList.remove(
      "active-pickup"
    );

  document
    .getElementById(
      "returnBtn"
    )
    .classList.remove(
      "active-return"
    );

}

/* ===================================
TOAST
=================================== */

function toast(msg){

  const t =
    document
      .createElement(
        "div"
      );

  t.className =
    "toast";

  t.innerText =
    msg;

  document.body
    .appendChild(t);

  setTimeout(
    ()=>t.remove(),
    2000
  );

}

/* ===================================
SAVE ENTRY
=================================== */

async function saveEntry(){

  if(!currentType){

    toast("Select Pickup / Return");
    return;

  }

  const awb =
    document
      .getElementById("awbInput")
      .value
      .trim();

  if(!awb){

    toast("AWB Missing");
    return;

  }

  const payload = {

    type: currentType,

    awb: awb,

    orderId:
      document
        .getElementById("orderInput")
        .value
        .trim(),

    courier:
      currentTracking?.courier || "",

    status:
      currentTracking?.status || "",

    customerName:
      currentTracking?.customerName || "",

    city:
      currentTracking?.city || "",

    state:
      currentTracking?.state || "",

    destination:
      currentTracking?.destination || "",

    pickupDate:
      currentTracking?.pickupDate || "",

    deliveredDate:
      currentTracking?.deliveredDate || "",

    expectedDate:
      currentTracking?.expectedDate ||
      currentTracking?.estimatedDate ||
      "",

    isRTO:
      currentTracking?.isRTO || false

  };
      try{

    showLoader();

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
            "text/plain;charset=utf-8"
          },

          body: JSON.stringify({

            action: "saveEntry",

            payload: payload

          })

        }
      );

    const text =
      await response.text();

    console.log(
      "SAVE RESPONSE:",
      text
    );

    let result = {};

    try{

      result =
        JSON.parse(text);

    }catch(err){

      hideLoader();

      toast(
        "Invalid Server Response"
      );

      console.log(text);

      return;

    }

    hideLoader();

    if(result.duplicate){

      toast("Duplicate AWB");

      document
        .getElementById("awbInput")
        .select();

      return;

    }

    if(!result.success){

      toast(
        result.message ||
        "Save Failed"
      );

      console.log(result);

      return;

    }

    playSuccessSound();

    toast("Saved Successfully");

    clearForm();

    currentTracking = null;

    document
      .getElementById("awbInput")
      .focus();

  }catch(err){

    hideLoader();

    console.log(err);

    toast(
      "Save Failed : " +
      err.message
    );

  }

}

/* ===================================
SUCCESS SOUND
=================================== */

function playSuccessSound(){

  try{

    beep.currentTime = 0;

    beep.play();

  }catch(err){}

}

setTimeout(()=>{

  document
  .getElementById(
    "awbInput"
  )
  .focus();

},200);

/* ===================================
LOADER
=================================== */

function showLoader(){

  document
  .getElementById(
    "loadingOverlay"
  )
  .style.display =
  "flex";

}

function hideLoader(){

  document
  .getElementById(
    "loadingOverlay"
  )
  .style.display =
  "none";

}

</script>

</body>
</html>
