<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Inventory Manager Fast</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f3f4f6;
padding:10px;
color:#111;
max-width:1100px;
margin:auto;
}

.card{
background:#fff;
padding:15px;
margin:10px 0;
border-radius:10px;
border:1px solid #ddd;
}

/* Header */

.header{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
}

h1{
font-size:22px;
}

.status{
padding:6px 12px;
border-radius:20px;
font-size:13px;
font-weight:bold;
}

.connected{
background:#d1fae5;
color:#065f46;
}

.disconnected{
background:#fee2e2;
color:#991b1b;
}


/* Dashboard */

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.box{
text-align:center;
padding:12px;
border:1px solid #eee;
border-radius:8px;
}

.value{
font-size:24px;
font-weight:bold;
color:#2563eb;
}


/* Search */

input{
width:100%;
padding:12px;
border:1px solid #bbb;
border-radius:8px;
font-size:15px;
}

#suggestions{
max-height:250px;
overflow:auto;
}

.item{
padding:10px;
border-bottom:1px solid #eee;
cursor:pointer;
}


/* Product */

#productCard{
display:none;
}

#productImage{
width:180px;
height:180px;
display:block;
margin:10px auto;
object-fit:cover;
border-radius:8px;
}

.stock{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
}

.stock div{
background:#f7f7f7;
padding:10px;
text-align:center;
border-radius:8px;
}


/* Buttons */

.actions{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
margin:12px 0;
}

button{
border:0;
padding:12px;
border-radius:8px;
background:#2563eb;
color:#fff;
cursor:pointer;
}

.active{
background:#111;
}


.lowBtns{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
}


/* Toast */

#toast{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#111;
color:#fff;
padding:10px 18px;
border-radius:20px;
display:none;
}


/* Desktop */

@media(min-width:768px){

.grid{
grid-template-columns:repeat(4,1fr);
}

.stock{
grid-template-columns:repeat(5,1fr);
}

.actions{
grid-template-columns:repeat(5,1fr);
}

.lowBtns{
grid-template-columns:repeat(4,1fr);
}

}

</style>

</head>

<body>


<!-- HEADER -->

<div class="card header">

<div>
<h1>📦 Inventory</h1>
<small>Stock Management</small>
</div>

<div id="connectionStatus"
class="status disconnected">

Checking...

</div>

</div>


<!-- DASHBOARD -->

<div class="card">

<h3>Dashboard</h3>

<div class="grid">

<div class="box">
SKU
<div id="totalSKU" class="value">0</div>
</div>

<div class="box">
Stock
<div id="totalStock" class="value">0</div>
</div>

<div class="box">
Sales
<div id="todaySales" class="value">0</div>
</div>

<div class="box">
Top
<div id="topSKU" class="value">-</div>
</div>

</div>

</div>


<!-- Search -->

<div class="card">

<h3>Search Product</h3>

<input 
id="search"
placeholder="SKU Search">

<div id="suggestions"></div>

</div>


<!-- Product Details -->

<div id="productCard" class="card">


<img id="productImage">


<h2 id="productSKU"></h2>


<div class="stock">

<div>
Opening
<div id="opening">0</div>
</div>

<div>
Inward
<div id="inward">0</div>
</div>

<div>
Reject
<div id="reject">0</div>
</div>

<div>
Sales
<div id="sales">0</div>
</div>

<div>
Available
<div id="stock">0</div>
</div>

</div>


<h3>Stock Action</h3>


<div class="actions">


<button onclick="selectAction(this,'opening')">
Opening
</button>


<button onclick="selectAction(this,'inward')">
Inward
</button>


<button onclick="selectAction(this,'returns')">
Return
</button>


<button onclick="selectAction(this,'reject')">
Reject
</button>


<button onclick="selectAction(this,'sales')">
Sales
</button>


</div>


<input 
type="number"
id="qty"
placeholder="Quantity">


<button onclick="updateProductStock()">
Update Stock
</button>


</div>


<!-- Low Stock -->


<div class="card">

<h3>Low Stock</h3>


<div class="lowBtns">

<button onclick="showLowStock(5)">
< 5 (<span id="low5">0</span>)
</button>


<button onclick="showLowStock(10)">
< 10 (<span id="low10">0</span>)
</button>


<button onclick="showLowStock(15)">
< 15 (<span id="low15">0</span>)
</button>


<button onclick="showLowStock(20)">
< 20 (<span id="low20">0</span>)
</button>


</div>


<div id="lowStockList">
Select Filter
</div>


</div>


<div id="toast"></div>
<script>

/******** CONFIG ********/

const API_URL =
"https://script.google.com/macros/s/AKfycbyI9lCfbNcTT3xJrw5hr3TXRR1IZ-O6b3J7WGDryOcISL94nkPIHPabCvpOc0v5Vvfx/exec";


/******** VARIABLES ********/

let products = [];
let selectedSKU = "";
let selectedAction = "";


/******** SHORTCUT ********/

const $ = id => document.getElementById(id);


/******** PAGE LOAD ********/

window.onload = () => {

    checkConnection();

    loadProducts();

    loadDashboard();

    loadLowCounts();

};


/******** CONNECTION ********/

async function checkConnection(){

try{

let r = await fetch(API_URL+"?action=connection");

let d = await r.json();

$("connectionStatus").className =
"status " + (d.status ? "connected" : "disconnected");

$("connectionStatus").innerHTML =
d.status ? "🟢 Connected" : "🔴 Error";

}catch{

$("connectionStatus").innerHTML="Offline";

}

}


/******** PRODUCTS CACHE ********/

async function loadProducts(){

let r = await fetch(API_URL+"?action=products");

products = await r.json();

}


/******** DASHBOARD ********/

async function loadDashboard(){


let [a,b] = await Promise.all([

fetch(API_URL+"?action=summary"),
fetch(API_URL+"?action=sales")

]);


let summary = await a.json();

let sales = await b.json();


$("totalSKU").innerHTML =
summary.totalProducts;


$("totalStock").innerHTML =
summary.totalStock;


$("todaySales").innerHTML =
sales.totalSalesQty;


$("topSKU").innerHTML =
sales.topSellingSKU;


}


/******** SEARCH ********/

$("search").oninput = function(){

let text =
this.value.toLowerCase().trim();


let box = $("suggestions");


if(!text){

box.innerHTML="";

return;

}


box.innerHTML = products

.filter(x =>
x.sku.toLowerCase()
.includes(text))

.slice(0,20)

.map(x =>

`<div class="item"
onclick="selectProduct('${x.sku}')">

📦 ${x.sku}

</div>`

)

.join("");

};



/******** SELECT PRODUCT ********/

async function selectProduct(sku){


selectedSKU = sku;


$("search").value = sku;


$("suggestions").innerHTML="";


let r = await fetch(

API_URL +
"?action=product&sku=" +
encodeURIComponent(sku)

);


let d = await r.json();


if(d.status){

showProduct(d.data);

}

}



/******** DISPLAY PRODUCT ********/

function showProduct(x){


$("productCard").style.display =
"block";


$("productSKU").innerHTML =
x.sku;


$("opening").innerHTML =
x.opening;


$("inward").innerHTML =
x.inward;


$("reject").innerHTML =
x.reject;


$("sales").innerHTML =
x.sales;


$("stock").innerHTML =
x.stock;


$("productImage").src =
x.image ||
"https://via.placeholder.com/180";


}



/******** ACTION SELECT ********/

function selectAction(btn, action){


document
.querySelectorAll("button")
.forEach(x =>
x.classList.remove("active"));


btn.classList.add("active");


selectedAction = action;


}
    
/******** UPDATE STOCK ********/

async function updateProductStock(){

let qty = $("qty").value;


if(!selectedSKU)
return toast("Select Product");


if(!selectedAction)
return toast("Select Action");


if(!qty || qty <= 0)
return toast("Enter Valid Qty");


try{

let r = await fetch(API_URL,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body: JSON.stringify({

sku:selectedSKU,
qty:qty,
action:selectedAction

})

});


let d = await r.json();


if(d.status){


showProduct(d.data);


$("qty").value = "";


toast("Stock Updated");


/* refresh background */

loadDashboard();

loadProducts();

loadLowCounts();


}
else{

toast(d.message);

}


}catch{

toast("Server Error");

}

}



/******** LOW STOCK COUNTS ********/


async function loadLowCounts(){

try{


let r = await fetch(
API_URL+"?action=lowstockcounts"
);


let d = await r.json();


$("low5").innerHTML = d.less5;

$("low10").innerHTML = d.less10;

$("low15").innerHTML = d.less15;

$("low20").innerHTML = d.less20;


}catch{

toast("Low Stock Error");

}

}




/******** SHOW LOW STOCK ********/


async function showLowStock(limit){


let box = $("lowStockList");


box.innerHTML = "Loading...";


let r = await fetch(
API_URL +
"?action=lowstock&limit="+limit
);


let d = await r.json();


if(!d.count){

box.innerHTML =
"✅ No Low Stock";

return;

}



box.innerHTML = d.items.map(x=>`

<div style="
display:flex;
align-items:center;
padding:8px;
border-bottom:1px solid #ddd">

<img src="${
x.image ||
'https://via.placeholder.com/50'
}"

width="50"
height="50"

style="
border-radius:6px;
margin-right:10px">


<div style="flex:1">

${x.sku}

</div>


<b>
Stock: ${x.stock}
</b>


</div>

`).join("");

}



/******** TOAST ********/


let timer;


function toast(msg){


let t = $("toast");


t.innerHTML = msg;


t.style.display = "block";


clearTimeout(timer);


timer = setTimeout(()=>{


t.style.display = "none";


},2000);


}



</script>
</body>

</html>
