<head>

Harsidhi Ventures Pickup Return System V2

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,sans-serif;
}

body{
    background:#f2f5fb;
    color:#1f2937;
}


/* Header */

.header{
    height:60px;
    background:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
    font-weight:700;
    color:#2563eb;
    border-bottom:1px solid #ddd;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}


/* Tabs */

.tabs{
    display:flex;
    gap:8px;
    padding:10px;
    background:#fff;
    position:sticky;
    top:0;
    z-index:100;
    border-bottom:1px solid #e5e7eb;
}


.tab-btn{
    flex:1;
    border:none;
    padding:12px;
    border-radius:12px;
    background:#e5e7eb;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
}


.tab-btn.active{
    background:#2563eb;
    color:#fff;
}



/* Main Container */

.container{
    padding:12px;
}


.page{
    display:none;
}


.page.active{
    display:block;
}



/* Card Design */

.card{
    background:#fff;
    border-radius:16px;
    padding:15px;
    margin-bottom:12px;
    box-shadow:0 4px 12px rgba(0,0,0,.06);
    border:1px solid #e5e7eb;
}


.card-title{
    font-size:16px;
    font-weight:700;
    margin-bottom:12px;
}



/* Buttons */

.btn{
    width:100%;
    border:none;
    padding:12px;
    border-radius:12px;
    margin-top:8px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
}


.blue{
    background:#2563eb;
    color:#fff;
}


.green{
    background:#10b981;
    color:#fff;
}


.red{
    background:#ef4444;
    color:#fff;
}


.gray{
    background:#475569;
    color:#fff;
}



/* Inputs */

.input{
    width:100%;
    height:45px;
    padding:10px 12px;
    border:1px solid #d1d5db;
    border-radius:12px;
    margin-top:8px;
    outline:none;
}


.input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.15);
}



/* QR Reader */

#reader{
    width:100%;
    margin-top:10px;
    overflow:hidden;
    border-radius:12px;
}



/* Dashboard */

.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
    gap:10px;
}


.stat{
    background:#f8fbff;
    border:1px solid #dbeafe;
    text-align:center;
    padding:15px;
    border-radius:14px;
}


.stat h2{
    color:#2563eb;
    margin-top:8px;
}



/* Result Area */

.result{
    margin-top:10px;
    font-size:13px;
    line-height:1.7;
}



/* Loader */

.loader{

    display:none;

    position:fixed;

    inset:0;

    background:rgba(255,255,255,.8);

    justify-content:center;

    align-items:center;

    font-size:22px;

    font-weight:700;

    color:#2563eb;

    z-index:9999;

}


/* Toast */

.toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:#111827;
    color:#fff;
    padding:12px 18px;
    border-radius:12px;
    z-index:10000;
}


/* Mobile Optimization */

@media(max-width:600px){

.header{
    font-size:15px;
    text-align:center;
    padding:5px;
}

.tab-btn{
    font-size:13px;
    padding:10px;
}

.card{
    padding:12px;
}

}


</style>


</head>


<body>

</body>
  <script>

/* =================================
   CONFIG
================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycby00URNBBmXCnQM7fWHZZvqVrCcvNwEJXQbDm8O35BnZp8w6f9Jkdu006yRPquRP0MQ/exec";


/* =================================
   FAST DOM SELECTOR
================================= */

const $ = id => document.getElementById(id);


/* =================================
   GLOBAL VARIABLES
================================= */

let currentType = "";
let currentTracking = null;
let latestTracking = null;
let html5QrCode = null;
let bulkRunning = false;


/* =================================
   SOUND
================================= */

const beep = new Audio(
"https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"
);


/* =================================
   PAGE TAB SYSTEM
================================= */

function openPage(pageId, btn){

    // Hide all pages
    document
    .querySelectorAll(".page")
    .forEach(page =>
        page.classList.remove("active")
    );


    // Remove active button
    document
    .querySelectorAll(".tab-btn")
    .forEach(button =>
        button.classList.remove("active")
    );


    // Open selected page
    $(pageId)
    .classList.add("active");


    // Highlight selected tab
    btn
    .classList.add("active");

}


/* =================================
   LOADER
================================= */


function showLoader(){

    $("loader")
    .style.display = "flex";

}


function hideLoader(){

    $("loader")
    .style.display = "none";

}


/* =================================
   TOAST MESSAGE
================================= */


function toast(message){

    const box =
    document.createElement("div");


    box.className = "toast";


    box.innerText = message;


    document.body.appendChild(box);


    setTimeout(() => {

        box.remove();

    },2000);

}


/* =================================
   COMMON API GET
================================= */


async function apiGet(action, params = {}){


    let url =
    API_URL +
    "?action=" +
    action;


    Object.keys(params)
    .forEach(key => {

        url +=
        "&" +
        key +
        "=" +
        encodeURIComponent(
            params[key]
        );

    });


    const response =
    await fetch(url);


    return await response.json();

}



/* =================================
   COMMON API POST
================================= */


async function apiPost(action, data){


    const response =
    await fetch(
        API_URL,
        {

        method:"POST",

        headers:{
        "Content-Type":
        "text/plain;charset=utf-8"
        },


        body: JSON.stringify({

            action: action,

            payload: data

        })

    });


    return await response.json();

}


/* =================================
   PLAY SUCCESS SOUND
================================= */


function successSound(){

    try{

        beep.currentTime = 0;

        beep.play();

    }

    catch(error){

        console.log(error);

    }

}


/* =================================
   RESET SCAN FORM
================================= */


function clearScan(){

    currentTracking = null;


    if($("awbInput"))
    $("awbInput").value = "";


    if($("orderInput"))
    $("orderInput").value = "";


    if($("trackingResult"))
    $("trackingResult").innerHTML =
    "Waiting for Scan...";


}



/* =================================
   AUTO FOCUS
================================= */


function focusAWB(){

    if($("awbInput")){

        $("awbInput").focus();

    }

}


/* =================================
   ERROR HANDLER
================================= */


function handleError(error){

    console.log(
        "System Error:",
        error
    );

    hideLoader();

    toast(
        "Something went wrong"
    );

}


/* =================================
   INITIAL LOAD
================================= */


window.onload = function(){

    console.log(
        "Harsidhi System V2 Loaded"
    );


    $("pickupBtn").onclick = () =>
        selectType("Pickup");


    $("returnBtn").onclick = () =>
        selectType("Return");


    $("cameraBtn").onclick =
        startCamera;


    $("manualBtn").onclick =
        focusAWB;


    $("saveBtn").onclick =
        saveEntry;


    $("stopBtn").onclick =
        stopWork;
    $("searchBtn").onclick =
        searchOrder;
$("skuSearchBtn").onclick = searchSKU;

$("stockUpdateBtn").onclick = updateStock;
    focusAWB();

};
loadDashboard();
loadRecent();
loadInventory();
setInterval(();
loadDashboard();

},30000);
/* =================================
   PICKUP / RETURN SELECT
================================= */

function selectType(type){

    currentType = type;

    if(type === "Pickup"){

    $("pickupBtn").className =
    "btn blue";

    $("returnBtn").className =
    "btn gray";

}
else{

    $("pickupBtn").className =
    "btn gray";

    $("returnBtn").className =
    "btn green";

}

    clearScan();

    toast(type + " Mode Started");

    focusAWB();
}


/* =================================
   BUTTON EVENTS
================================= */

window.addEventListener("load", () => {

    $("pickupBtn").onclick = () => selectType("Pickup");
    $("returnBtn").onclick = () => selectType("Return");

}); 
/* =================================
   CAMERA START
================================= */

async function startCamera(){

    try{

        if(html5QrCode){
            await stopCamera();
        }

        $("reader").style.display = "block";

        html5QrCode = new Html5Qrcode("reader");

        await html5QrCode.start(

            { facingMode:"environment" },

            {
                fps:20,
                qrbox:{
                    width:250,
                    height:120
                }
            },

            decodedText => {

                $("awbInput").value = decodedText;

                beep.currentTime = 0;
                beep.play();

                stopCamera();

                trackShipment();

            }

        );

    } catch(error){

        console.log(error);

        toast("Camera Error");

    }

}


/* =================================
   STOP CAMERA
================================= */

async function stopCamera(){

    try{

        if(html5QrCode){

            await html5QrCode.stop();
            await html5QrCode.clear();

            html5QrCode = null;

        }

    }catch(e){}

    $("reader").style.display = "none";

} 
/* =================================
   AWB ENTER AUTO TRACK
================================= */

$("awbInput").addEventListener(
"keydown",

function(e){

    if(e.key === "Enter"){

        e.preventDefault();

        trackShipment();

    }

}); 
/* =================================
   TRACK SHIPMENT
================================= */

async function trackShipment(){

    let awb = $("awbInput").value.trim();

    if(!awb){

        toast("Scan AWB First");

        return;
    }

    try{

        showLoader();

        let data = await apiGet(
            "trackShipment",
            {awb:awb}
        );

        hideLoader();

        if(!data.success){

            $("trackingResult").innerHTML =
            "Tracking Not Found<br>Enter Order ID";

            $("orderInput").focus();

            return;
        }

        currentTracking = data;

        $("trackingResult").innerHTML = `
        AWB: ${data.awb}<br>
        Order: ${data.orderId}<br>
        Status: ${data.status}<br>
        Courier: ${data.courier}<br>
        Name: ${data.customerName}<br>
        City: ${data.city}
        `;

    }
    catch(error){

        handleError(error);

    }

} 
/* =================================
   SAVE ENTRY
================================= */

async function saveEntry(){

    if(!currentType){

        toast("Select Pickup / Return");

        return;
    }

    let payload = {

        type: currentType,

        awb: $("awbInput").value.trim(),

        orderId: $("orderInput").value.trim(),

        courier: currentTracking?.courier || "",

        status: currentTracking?.status || "",

        customer: currentTracking?.customerName || "",

        city: currentTracking?.city || ""

    };

    if(!payload.awb){

        toast("AWB Missing");

        return;

    }

    try{

        showLoader();

        let result = await apiPost(
            "saveEntry",
            payload
        );

        hideLoader();

        if(result.duplicate){

            toast("Duplicate AWB");

            return;
        }

        if(result.success){

            successSound();

            toast("Saved Successfully");

            clearScan();

            focusAWB();

        }else{

            toast(result.message || "Save Failed");

        }

    }
    catch(error){

        handleError(error);

    }

}


/* =================================
   STOP WORK
================================= */

function stopWork(){

    stopCamera();

    currentType = "";

    clearScan();

    toast("Work Stopped");

}
/* ===============================
   LOAD DASHBOARD
================================ */

async function loadDashboard(){

    try{

        let data =
        await apiGet(
            "getDashboardCounts"
        );

        $("dashboardArea").innerHTML = `

        <div class="stat">
            Today Pickup
            <h2>${data.todayPickup || 0}</h2>
        </div>

        <div class="stat">
            Today Return
            <h2>${data.todayReturn || 0}</h2>
        </div>


        <div class="stat">
            Yesterday Pickup
            <h2>${data.yesterdayPickup || 0}</h2>
        </div>


        <div class="stat">
            Yesterday Return
            <h2>${data.yesterdayReturn || 0}</h2>
        </div>


        <div class="stat">
            ${data.monthName || ""}
            Pickup

            <h2>
            ${data.monthPickup || 0}
            </h2>

        </div>


        <div class="stat">

            ${data.monthName || ""}
            Return

            <h2>
            ${data.monthReturn || 0}
            </h2>

        </div>

        `;


    }catch(error){

        console.log(error);

    }

}
    async function loadRecent(){

async function searchOrder(){

    let keyword =
    $("searchInput").value.trim();


    if(!keyword){

        toast("Enter AWB / Order ID");

        return;

    }


    $("searchResult").innerHTML =
    "Searching...";


    try{

        let data =
        await apiGet(
            "searchOrder",
            {
                keyword: keyword
            }
        );


        if(!data.success){

            $("searchResult").innerHTML =
            "No Record Found";

            return;
        }


        $("searchResult").innerHTML = `

        <b>AWB:</b>
        ${data.awb}<br>

        <b>Order:</b>
        ${data.orderId}<br>

        <b>Status:</b>
        ${data.status}<br>

        <b>Type:</b>
        ${data.type}<br>

        <b>Courier:</b>
        ${data.courier}

        <br><br>

        <button 
        class="btn green"
        onclick="updateSingleAWB('${data.awb}')">

        Update Current Status

        </button>

        `;


    }catch(error){

        handleError(error);

    }

}
      async function updateSingleAWB(awb){

    try{

        showLoader();


        let result =
        await apiGet(
            "updateSingleAWB",
            {
                awb: awb
            }
        );


        hideLoader();


        if(result.success){

            toast("Status Updated");

            searchOrder();

        }else{

            toast(
            result.message ||
            "Update Failed"
            );

        }


    }catch(error){

        handleError(error);

    }

}
/* ==============================
   INVENTORY DASHBOARD
============================== */

async function loadInventory(){

    try{

        let data = await apiGet(
            "getInventoryDashboard"
        );


        $("inventoryDashboard").innerHTML = `

        <div class="dashboard">

            <div class="stat">
                Total SKU
                <h2>
                ${data.totalSku || 0}
                </h2>
            </div>


            <div class="stat">
                Total Stock
                <h2>
                ${data.totalStock || 0}
                </h2>
            </div>


            <div class="stat">
                Low Stock
                <h2>
                ${data.lowStock || 0}
                </h2>
            </div>

        </div>

        `;


        loadLowStock();


    }catch(error){

        console.log(error);

    }

}
      async function searchSKU(){

    let sku =
    $("skuSearch").value.trim();


    if(!sku){

        toast("Enter SKU");

        return;
    }


    try{

        showLoader();


        let data =
        await apiGet(
            "searchSKU",
            {
                sku: sku
            }
        );


        hideLoader();


        if(!data.success){

            toast("SKU Not Found");

            return;
        }


        $("inventoryDashboard")
        .innerHTML += `

        <div class="card">

        <b>SKU :</b>
        ${data.sku}<br>

        <b>Product :</b>
        ${data.name}<br>

        <b>Stock :</b>
        ${data.stock}

        </div>

        `;


    }catch(error){

        handleError(error);

    }

}
      async function updateStock(){

    let sku =
    $("skuUpdate").value.trim();


    let qty =
    $("stockQty").value.trim();


    if(!sku || !qty){

        toast("Enter SKU & Quantity");

        return;

    }


    try{

        showLoader();


        let result =
        await apiPost(
            "updateStock",
            {
                sku: sku,
                quantity: qty
            }
        );


        hideLoader();


        if(result.success){

            successSound();

            toast("Stock Updated");

            $("skuUpdate").value="";
            $("stockQty").value="";


            loadInventory();


        }else{

            toast(
            result.message ||
            "Update Failed"
            );

        }


    }catch(error){

        handleError(error);

    }

}
      async function loadLowStock(){

    try{

        let data =
        await apiGet(
            "getLowStock"
        );


        let html =
        `<div class="card">

        <div class="card-title">
        Low Stock Alert
        </div>`;


        data.rows.forEach(item=>{

            html += `

            <div class="result">

            <b>
            ${item.sku}
            </b>

            <br>

            ${item.name}

            <br>

            Stock :
            ${item.stock}

            <hr>

            </div>

            `;

        });


        html += "</div>";


        $("lowStockArea").innerHTML =
        html;


    }catch(error){

        console.log(error);

    }

}
</script>
