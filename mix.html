<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Harsidhi Ventures Pickup Return System</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#f3f6fb;height:100vh;overflow:hidden;color:#1f2937}
.header{height:60px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#2563eb;border-bottom:1px solid #e5e7eb;box-shadow:0 1px 8px rgba(0,0,0,.05)}
.main{height:calc(100vh - 60px);display:flex;justify-content:center;align-items:flex-start;padding:12px}
.panel{background:#fff;border:1px solid #e5e7eb;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 4px 15px rgba(0,0,0,.05);width:100%;max-width:700px}
.center-content{padding:15px;display:flex;flex-direction:column;gap:12px}
.mode-row,.action-row{display:flex;gap:10px}
.mode-btn{flex:1;height:50px;border-radius:12px;border:2px solid;font-weight:700;background:#fff;cursor:pointer;transition:.2s}
.pickup{border-color:#2563eb;color:#2563eb}
.return{border-color:#14b8a6;color:#14b8a6}
.active-pickup{background:#2563eb;color:#fff}
.active-return{background:#14b8a6;color:#fff}
.scan-panel{display:none;flex-direction:column;gap:10px;padding:14px;border:1px solid #e5e7eb;border-radius:14px;background:#fafcff}
.input{height:46px;padding:0 14px;border:1px solid #dbe2ea;border-radius:12px;outline:none;background:#fff}
.input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
#reader{display:none;width:100%;overflow:hidden;border-radius:12px}
.result-card{padding:14px;border:1px solid #e5e7eb;border-radius:14px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.result-card{display:none;font-size:13px}
.btn{border:none;border-radius:12px;padding:11px 16px;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
.btn:hover{transform:translateY(-1px);opacity:.95}
.btn-camera{background:#2563eb;color:#fff}
.btn-manual{background:#475569;color:#fff}
.btn-save{background:#10b981;color:#fff}
.btn-stop{background:#ef4444;color:#fff}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 16px;border-radius:12px;z-index:9999;box-shadow:0 8px 20px rgba(0,0,0,.2)}
#loadingOverlay{display:none;position:fixed;inset:0;background:rgba(255,255,255,.85);backdrop-filter:blur(4px);z-index:99999;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#2563eb}
@media(max-width:900px){
body{overflow:auto}
.main{height:auto}
.panel{min-height:350px}
}
</style>
</head>

<body>

<div class="header">
HARSIDHI VENTURES PICKUP RETURN SYSTEM
</div>

<div class="main">

<div class="panel">

<div class="center-content">

<div class="mode-row">
<button id="pickupBtn" class="mode-btn pickup" onclick="selectType('Pickup')">Pickup</button>
<button id="returnBtn" class="mode-btn return" onclick="selectType('Return')">Return</button>
</div>

<div id="scanPanel" class="scan-panel">

<button class="btn btn-camera" onclick="startCamera()">
📷 Camera Scan
</button>

<button class="btn btn-manual" onclick="focusAWB()">
⌨ Manual / Scanner
</button>

<div id="reader"></div>

<input
id="awbInput"
class="input"
placeholder="Scan AWB">

<input
id="orderInput"
class="input"
placeholder="Order ID (Manual Fallback)">

<div
id="resultCard"
class="result-card">
</div>

<div class="action-row">

<button
class="btn btn-save"
onclick="saveEntry()">
Next
</button>

<button
class="btn btn-stop"
onclick="stopWork()">
Stop
</button>

</div>

</div>

</div>

</div>

</div>

<div id="loadingOverlay">
Loading...
</div>

<script>

/* ===================================
CONFIG
=================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbzCx2cLgXw_rgA0T8_dgfAqRAGtTpBsIhM-xeysJcCbbrpn7mH0g1g13Au4KpiCPH8/exec";

/* ===================================
GLOBAL
=================================== */

let currentType = "";

let currentTracking = null;

let html5QrCode = null;

const beep =
new Audio(
"https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"
);

/* ===================================
TYPE SELECT
=================================== */

function selectType(type){

  currentType = type;

  document
    .getElementById("scanPanel")
    .style.display = "flex";

  document
    .getElementById("pickupBtn")
    .classList.remove(
      "active-pickup"
    );

  document
    .getElementById("returnBtn")
    .classList.remove(
      "active-return"
    );

  if(type === "Pickup"){

    document
      .getElementById("pickupBtn")
      .classList.add(
        "active-pickup"
      );

  }else{

    document
      .getElementById("returnBtn")
      .classList.add(
        "active-return"
      );

  }

  clearForm();

  document
    .getElementById("awbInput")
    .focus();

}

/* ===================================
CLEAR FORM
=================================== */

function clearForm(){

  currentTracking = null;

  document
    .getElementById("awbInput")
    .value = "";

  document
    .getElementById("orderInput")
    .value = "";

  document
    .getElementById("orderInput")
    .style.display = "none";

  document
    .getElementById("resultCard")
    .style.display = "none";

  document
    .getElementById("resultCard")
    .innerHTML = "";

}

/* ===================================
FOCUS AWB
=================================== */

function focusAWB(){

  document
    .getElementById("awbInput")
    .focus();

}

/* ===================================
CAMERA START
=================================== */

async function startCamera(){

  try{

    if(html5QrCode){

      await stopCamera();

    }

    document
      .getElementById("reader")
      .style.display = "block";

    html5QrCode =
      new Html5Qrcode(
        "reader"
      );

    await html5QrCode.start(

      {
        facingMode:
          "environment"
      },

      {

        fps:20,

        qrbox:{
          width:280,
          height:140
        }

      },

      function(decodedText){

        document
          .getElementById("awbInput")
          .value =
          decodedText;

        beep.play();

        stopCamera();

        trackShipment();

      }

    );

  }catch(err){

    toast(
      "Camera Error"
    );

    console.log(err);

  }

}

/* ===================================
STOP CAMERA
=================================== */

async function stopCamera(){

  try{

    if(html5QrCode){

      await html5QrCode.stop();

      await html5QrCode.clear();

      html5QrCode = null;

    }

  }catch(err){}

  document
    .getElementById("reader")
    .style.display = "none";

}

/* ===================================
AUTO TRACK
=================================== */

document
.getElementById("awbInput")
.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){

      trackShipment();

    }

  }
);

/* ===================================
USB SCANNER SUPPORT
=================================== */

let scannerBuffer = "";

document.addEventListener(
  "keydown",
  function(e){

    if(
      document.activeElement.id !== "awbInput"
    ){
      return;
    }

    if(e.key === "Enter"){

      e.preventDefault();

      const awb = scannerBuffer.trim();

      if(awb.length > 5){

        document
          .getElementById("awbInput")
          .value = awb;

        trackShipment();
      }

      scannerBuffer = "";

      return;
    }

    if(e.key.length === 1){

      scannerBuffer += e.key;

    }

  }
);

/* ===================================
TRACK SHIPMENT
=================================== */

async function trackShipment(){

  const awb =

    document
      .getElementById(
        "awbInput"
      )
      .value
      .trim();

  if(!awb){

    toast(
      "Scan AWB"
    );

    return;

  }

  showLoading();

  try{

    const response =
      await fetch(

        API_URL +

        "?action=trackShipment&awb=" +

        encodeURIComponent(
          awb
        )

      );

    const result =
      await response.json();

    if(result.success){

      currentTracking =
        result;

      renderTracking(
        result
      );

      return;

    }

    openManualOrder();

  }catch(err){

    console.log(err);

    openManualOrder();

  }

}

/* ===================================
FALLBACK MODE
=================================== */

function openManualOrder(){

  currentTracking = null;

  const card =
    document
      .getElementById(
        "resultCard"
      );

  card.style.display =
    "block";

  card.innerHTML = `

    <div
    style="
      color:#dc2626;
      font-weight:600;
    ">

    Tracking Not Found

    </div>

    <div
    style="
      margin-top:8px;
    ">

    Enter Order ID
    manually

    </div>

  `;

  document
    .getElementById(
      "orderInput"
    )
    .style.display =
    "block";

  document
    .getElementById(
      "orderInput"
    )
    .focus();

}

/* ===================================
RENDER TRACKING
=================================== */

function renderTracking(data){

  const card =
    document
      .getElementById(
        "resultCard"
      );

  card.style.display =
    "block";

  card.innerHTML = `

    <b>AWB:</b>
    ${data.awb || ""}
    <br>

    <b>Order ID:</b>
    ${data.orderId || ""}
    <br>

    <b>Status:</b>
    ${data.status || ""}
    <br>

    <b>Courier:</b>
    ${data.courier || ""}
    <br>

    <b>Name:</b>
    ${data.customerName || ""}
    <br>

    <b>City:</b>
    ${data.city || ""}

  `;

  document
    .getElementById(
      "orderInput"
    )
    .value =

    data.orderId || "";

}

/* ===================================
LOADING
=================================== */

function showLoading(){

  const card =
    document
      .getElementById(
        "resultCard"
      );

  card.style.display =
    "block";

  card.innerHTML =
    "Fetching Tracking...";

}

/* ===================================
STOP WORK
=================================== */

function stopWork(){

  stopCamera();

  currentType = "";

  clearForm();

  document
    .getElementById(
      "scanPanel"
    )
    .style.display =
    "none";

  document
    .getElementById(
      "pickupBtn"
    )
    .classList.remove(
      "active-pickup"
    );

  document
    .getElementById(
      "returnBtn"
    )
    .classList.remove(
      "active-return"
    );

}

/* ===================================
TOAST
=================================== */

function toast(msg){

  const t =
    document
      .createElement(
        "div"
      );

  t.className =
    "toast";

  t.innerText =
    msg;

  document.body
    .appendChild(t);

  setTimeout(
    ()=>t.remove(),
    2000
  );

}

/* ===================================
SAVE ENTRY
=================================== */

async function saveEntry(){

  if(!currentType){

    toast("Select Pickup / Return");
    return;

  }

  const awb =
    document
      .getElementById("awbInput")
      .value
      .trim();

  if(!awb){

    toast("AWB Missing");
    return;

  }

  const payload = {

    type: currentType,

    awb: awb,

    orderId:
      document
        .getElementById("orderInput")
        .value
        .trim(),

    courier:
      currentTracking?.courier || "",

    status:
      currentTracking?.status || "",

    customerName:
      currentTracking?.customerName || "",

    city:
      currentTracking?.city || "",

    state:
      currentTracking?.state || "",

    destination:
      currentTracking?.destination || "",

    pickupDate:
      currentTracking?.pickupDate || "",

    deliveredDate:
      currentTracking?.deliveredDate || "",

    expectedDate:
      currentTracking?.expectedDate ||
      currentTracking?.estimatedDate ||
      "",

    isRTO:
      currentTracking?.isRTO || false

  };
      try{

    showLoader();

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
            "text/plain;charset=utf-8"
          },

          body: JSON.stringify({

            action: "saveEntry",

            payload: payload

          })

        }
      );

    const text =
      await response.text();

    console.log(
      "SAVE RESPONSE:",
      text
    );

    let result = {};

    try{

      result =
        JSON.parse(text);

    }catch(err){

      hideLoader();

      toast(
        "Invalid Server Response"
      );

      console.log(text);

      return;

    }

    hideLoader();

    if(result.duplicate){

      toast("Duplicate AWB");

      document
        .getElementById("awbInput")
        .select();

      return;

    }

    if(!result.success){

      toast(
        result.message ||
        "Save Failed"
      );

      console.log(result);

      return;

    }

    playSuccessSound();

    toast("Saved Successfully");

    clearForm();

    currentTracking = null;

    document
      .getElementById("awbInput")
      .focus();

  }catch(err){

    hideLoader();

    console.log(err);

    toast(
      "Save Failed : " +
      err.message
    );

  }

}

/* ===================================
SUCCESS SOUND
=================================== */

function playSuccessSound(){

  try{

    beep.currentTime = 0;

    beep.play();

  }catch(err){}

}

setTimeout(()=>{

  document
  .getElementById(
    "awbInput"
  )
  .focus();

},200);

/* ===================================
LOADER
=================================== */

function showLoader(){

  document
  .getElementById(
    "loadingOverlay"
  )
  .style.display =
  "flex";

}

function hideLoader(){

  document
  .getElementById(
    "loadingOverlay"
  )
  .style.display =
  "none";

}

</script>

</body>
</html>
