<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harsidhi Ventures</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}

:root{
--bg:#f2f2f7;
--card:#fff;
--text:#111;
--secondary:#6e6e73;
--shadow:rgba(0,0,0,.08)
}

body.dark{--bg:#000;--card:#1c1c1e;--text:#fff;--secondary:#98989d;--shadow:rgba(255,255,255,.05)}
body.blue{--bg:#eef5ff;--card:#fff;--text:#0a2540;--secondary:#537188;--shadow:rgba(0,119,255,.15)}
body.green{--bg:#eefaf0;--card:#fff;--text:#16361f;--secondary:#4b6f54;--shadow:rgba(0,150,0,.12)}

body{
background:var(--bg);
color:var(--text);
min-height:100vh;
transition:.3s;
display:flex;
flex-direction:column
}

.topbar{
position:sticky;
top:0;
z-index:100;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 20px;
background:var(--bg)
}

.brand-title{
font-size:24px;
font-weight:700;
cursor:pointer
}

#liveDateTime{
font-size:13px;
color:var(--secondary);
margin-top:4px
}

.settings-btn{
width:46px;
height:46px;
border:none;
border-radius:14px;
cursor:pointer;
background:var(--card);
box-shadow:0 4px 20px var(--shadow);
font-size:20px
}

.search-section{
padding:0 20px 18px
}

#searchInput{
width:100%;
padding:14px 16px;
border:none;
border-radius:18px;
background:var(--card);
color:var(--text);
box-shadow:0 4px 20px var(--shadow)
}

#dashboard{
flex:1;
padding:0 20px 30px;
max-width:1400px;
width:100%;
margin:auto
}

#homePage{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px
}

.widget{
background:var(--card);
border-radius:28px;
padding:18px;
cursor:pointer;
box-shadow:0 6px 24px var(--shadow);
transition:.25s
}

.widget:hover{
transform:translateY(-3px)
}

.widget img{
width:64px;
height:64px;
object-fit:contain;
display:block;
margin:auto
}

.small-widget{
text-align:center;
min-height:180px;
display:flex;
flex-direction:column;
justify-content:center
}

.small-widget h3{
margin-top:14px
}

.summary-widget,
.large-widget{
grid-column:span 2
}

.summary-title,
.large-title{
font-size:22px;
font-weight:700
}

.summary-row{
display:flex;
justify-content:space-between;
margin-top:14px
}

.large-widget{
display:flex;
align-items:center;
gap:20px;
min-height:170px
}

.large-number{
font-size:34px;
font-weight:800;
margin-top:8px
}

#contentArea{
width:100%;
min-height:calc(100vh - 170px);
padding:0
}

footer{
margin-top:auto;
text-align:center;
padding:18px;
color:var(--secondary)
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
display:none;
align-items:center;
justify-content:center;
z-index:500
}

.modal-box{
width:min(320px,90%);
padding:22px;
border-radius:26px;
background:var(--card);
display:flex;
flex-direction:column;
gap:10px
}

.modal-box button{
padding:14px;
border:none;
border-radius:14px;
cursor:pointer
}

@media(max-width:767px){

.topbar{padding:15px}
.search-section{padding:0 15px 15px}
#dashboard{padding:0 15px 25px}
#homePage{grid-template-columns:repeat(2,1fr);gap:15px}
.small-widget{min-height:160px}
.brand-title{font-size:21px}

}

@media(min-width:768px) and (max-width:1199px){

#homePage{
grid-template-columns:repeat(3,1fr)
}

}

@media(min-width:1200px){

#homePage{
grid-template-columns:repeat(4,1fr)
}

}
</style>
</head>
<body>

<header class="topbar">
<div>
<div class="brand-title" onclick="showHome()" style="cursor:pointer">
    Harsidhi Ventures
</div>
<div id="liveDateTime">Loading...</div>
</div>
<button class="settings-btn" onclick="openSettings()">⚙️</button>
</header>

<section class="search-section">
<input type="text" id="searchInput" placeholder="Search page...">
</section>

<main id="dashboard">

<div id="homePage">

    <div class="widget small-widget" onclick="openPage('pickup.html')" data-name="pickup">
        <img src="icons/pickup.png">
        <h3>Pickup</h3>
    </div>

    <div class="widget small-widget" onclick="openPage('return.html')" data-name="return">
        <img src="icons/return.png">
        <h3>Return</h3>
    </div>

    <div class="widget summary-widget">
      
    </div>

    <div class="widget small-widget" onclick="openPage('today-count.html')" data-name="today">
      
    </div>

    <div class="widget small-widget" onclick="openPage('yesterday-count.html')" data-name="yesterday">
      
    </div>

    <div class="widget large-widget" onclick="openPage('total-count.html')" data-name="total">
      
    </div>

</div>

<div id="contentArea" style="display:none;"></div>

</main>

<footer>© 2026 Kone Soft Tech</footer>

<div id="settingsModal" class="modal">
<div class="modal-box">
<h2>Settings</h2>
<button onclick="setTheme('light')">⚪ Light Theme</button>
<button onclick="setTheme('dark')">⚫ Dark Theme</button>
<button onclick="setTheme('blue')">🔵 Blue Theme</button>
<button onclick="setTheme('green')">🟢 Green Theme</button>
<button onclick="closeSettings()">Close</button>
</div>
</div>

<script>
    function showHome(){

    document.getElementById("contentArea").style.display = "none";

    document.getElementById("contentArea").innerHTML = "";

    document.getElementById("homePage").style.display = "grid";

}
async function openPage(page){

    try{

        const res = await fetch(page);

        if(!res.ok){
            throw new Error("Page Not Found");
        }

        const html = await res.text();

        // Dashboard hide
        document.getElementById("homePage").style.display = "none";

        // Content area show
        document.getElementById("contentArea").style.display = "block";

        // Full page content load
        document.getElementById("contentArea").innerHTML = html;

    }catch(err){

        document.getElementById("contentArea").style.display = "block";

        document.getElementById("contentArea").innerHTML =
        "<h3>Page Load Failed</h3>";

    }

}

function updateClock(){
const now=new Date();
const date=now.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric",timeZone:"Asia/Kolkata"});
const time=now.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true,timeZone:"Asia/Kolkata"});
document.getElementById("liveDateTime").innerHTML=`${date} | ${time} IST`;
}
updateClock();setInterval(updateClock,1000);

function loadDashboardCounts(){
const pickup=Number(localStorage.getItem("pickupCount")||0);
const ret=Number(localStorage.getItem("returnCount")||0);
document.getElementById("pickupCount").textContent=pickup;
document.getElementById("returnCount").textContent=ret;
document.getElementById("totalCount").textContent=pickup+ret;
}
loadDashboardCounts();

document.getElementById("searchInput").addEventListener("input",function(){
const v=this.value.toLowerCase().trim();
document.querySelectorAll(".widget[data-name]").forEach(w=>{
w.style.display=w.dataset.name.includes(v)?"":"none";
});
});

function openSettings(){document.getElementById("settingsModal").style.display="flex"}
function closeSettings(){document.getElementById("settingsModal").style.display="none"}

function setTheme(theme){
document.body.classList.remove("dark","blue","green");
if(theme!=="light")document.body.classList.add(theme);
localStorage.setItem("theme",theme);
closeSettings();
}

(function(){
const t=localStorage.getItem("theme")||"light";
if(t!=="light")document.body.classList.add(t);
})();

window.addEventListener("click",e=>{
if(e.target===document.getElementById("settingsModal")) closeSettings();
});

setInterval(loadDashboardCounts,2000);
console.log("Harsidhi Ventures Dashboard Loaded");
</script>
</body>
</html>
