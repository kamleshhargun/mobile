<title>Harsidhi Ventures</title>

<style>
 /* ==========================
   RESET
========================== */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
Roboto,
sans-serif;
}

/* ==========================
   THEMES
========================== */

:root{

--bg:#f2f2f7;
--card:#ffffff;
--text:#111111;
--secondary:#6e6e73;
--shadow:rgba(0,0,0,.08);

}

body.dark{

--bg:#000000;
--card:#1c1c1e;
--text:#ffffff;
--secondary:#98989d;
--shadow:rgba(255,255,255,.05);

}

body.blue{

--bg:#eef5ff;
--card:#ffffff;
--text:#0a2540;
--secondary:#537188;
--shadow:rgba(0,119,255,.15);

}

body.green{

--bg:#eefaf0;
--card:#ffffff;
--text:#16361f;
--secondary:#4b6f54;
--shadow:rgba(0,150,0,.12);

}

/* ==========================
   BODY
========================== */

body{

background:var(--bg);
color:var(--text);

min-height:100vh;

transition:
background .3s,
color .3s;

}

/* ==========================
   HEADER
========================== */

.topbar{

position:sticky;
top:0;

z-index:100;

display:flex;
justify-content:space-between;
align-items:center;

padding:18px 20px;

background:var(--bg);

backdrop-filter:blur(12px);

}

.brand-title{

font-size:24px;
font-weight:700;

}

#liveDateTime{

font-size:13px;
margin-top:4px;
color:var(--secondary);

}

.settings-btn{

border:none;

width:46px;
height:46px;

border-radius:14px;

cursor:pointer;

font-size:20px;

background:var(--card);
color:var(--text);

box-shadow:
0 4px 20px var(--shadow);

}

/* ==========================
   SEARCH
========================== */

.search-section{

padding:
0 20px
18px;

}

#searchInput{

width:100%;

padding:14px 16px;

border:none;

outline:none;

border-radius:18px;

font-size:15px;

background:var(--card);
color:var(--text);

box-shadow:
0 4px 20px var(--shadow);

}

/* ==========================
   DASHBOARD
========================== */

#dashboard{

padding:0 20px 90px;

display:grid;

grid-template-columns:
repeat(
auto-fit,
minmax(170px,1fr)
);

gap:18px;

}

/* ==========================
   WIDGET
========================== */

.widget{

background:var(--card);

border-radius:28px;

padding:18px;

cursor:pointer;

box-shadow:
0 6px 24px var(--shadow);

transition:
transform .2s,
box-shadow .2s;

}

.widget:hover{

transform:
translateY(-3px);

}

.widget img{

width:64px;
height:64px;

object-fit:contain;

display:block;

margin:auto;

}

/* ==========================
   SMALL WIDGET
========================== */

.small-widget{

text-align:center;

min-height:180px;

display:flex;
flex-direction:column;
justify-content:center;

}

.small-widget h3{

margin-top:14px;

font-size:16px;
font-weight:600;

}

/* ==========================
   SUMMARY WIDGET
========================== */

.summary-widget{

grid-column:
span 2;

min-height:180px;

}

.summary-title{

font-size:22px;
font-weight:700;

margin-bottom:22px;

}

.summary-row{

display:flex;
justify-content:space-between;

margin-bottom:12px;

font-size:17px;

}

/* ==========================
   LARGE WIDGET
========================== */

.large-widget{

grid-column:
span 2;

display:flex;
align-items:center;
gap:20px;

min-height:170px;

}

.large-widget img{

margin:0;

}

.large-title{

font-size:22px;
font-weight:700;

}

.large-number{

margin-top:10px;

font-size:34px;
font-weight:800;

}

/* ==========================
   FOOTER
========================== */

footer{

text-align:center;

padding:20px;

font-size:13px;

color:var(--secondary);

}

/* ==========================
   MODAL
========================== */

.modal{

position:fixed;
inset:0;

display:none;

align-items:center;
justify-content:center;

background:
rgba(0,0,0,.45);

z-index:500;

}

.modal-box{

width:320px;

padding:22px;

border-radius:26px;

background:var(--card);

display:flex;
flex-direction:column;

gap:12px;

box-shadow:
0 10px 40px var(--shadow);

}

.modal-box h2{

margin-bottom:10px;

}

.modal-box button{

border:none;

padding:14px;

border-radius:14px;

cursor:pointer;

font-size:15px;

background:var(--bg);

color:var(--text);

}

/* ==========================
   MOBILE
========================== */

@media(max-width:768px){

#dashboard{

grid-template-columns:
1fr 1fr;

gap:14px;

padding:
0 14px
80px;

}

.summary-widget{

grid-column:
1 / -1;

}

.large-widget{

grid-column:
1 / -1;

}

.brand-title{

font-size:20px;

}

.widget{

border-radius:24px;

}

}

/* ==========================
   EXTRA SMALL
========================== */

@media(max-width:480px){

.small-widget{

min-height:150px;

}

.widget img{

width:56px;
height:56px;

}

.large-number{

font-size:28px;

}

.summary-title{

font-size:20px;

}

}

<script>

 const apps = [

{
name:"Pickup",
url:"pickup.html",
icon:"https://cdn-icons-png.flaticon.com/512/3500/3500833.png"
},

{
name:"Return",
url:"return.html",
icon:"https://cdn-icons-png.flaticon.com/512/679/679720.png"
},

{
name:"Today Count",
url:"today-count.html",
icon:"today-icon.png",
id:"todayCount"
}

{
name:"Yesterday Count",
url:"yesterday-count.html",
icon:"https://cdn-icons-png.flaticon.com/512/747/747310.png"
},

{
name:"Total Count",
url:"total-count.html",
icon:"https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
}

];

/* ==========================
   SAVE
========================== */

function persist(){
 localStorage.setItem(
   "koneApps",
   JSON.stringify(apps)
 );
}

/* ==========================
   RENDER
========================== */

function render(filter=""){

 const desktop =
 document.getElementById("desktop");

 desktop.innerHTML = "";

 /* SETTINGS */

 const settings =
 document.createElement("div");

 settings.className = "icon";

 settings.innerHTML = `
 <div class="special-btn">⚙️</div>
 <div>Settings</div>
 `;

 settings.onclick = openSettings;

 desktop.appendChild(settings);

 /* APPS */

 apps
 .filter(app =>
   app.name
   .toLowerCase()
   .includes(filter.toLowerCase())
 )
 .forEach((app,index)=>{

   const icon =
   document.createElement("div");

   icon.className = "icon";

   const img =
   document.createElement("img");

   img.src = app.icon;

   const title =
   document.createElement("div");

   title.textContent = app.name;
  if(app.id==="todayCount"){

    const counts =
    JSON.parse(
    localStorage.getItem("todayCounts") ||
    '{"pickup":0,"return":0}'
    );

    const stats =
    document.createElement("div");

    stats.className =
    "today-stats";

    stats.innerHTML = `
      <span class="pickup-badge">
      P ${counts.pickup}
      </span>

      <span class="return-badge">
      R ${counts.return}
      </span>
    `;

    icon.appendChild(stats);
}

   icon.appendChild(img);
   icon.appendChild(title);

   icon.onclick = () => {
      openUrl(app.url);
   };

   /* RIGHT CLICK */

   icon.addEventListener(
   "contextmenu",
   e=>{
      e.preventDefault();
      showMenu(index);
   });

   /* LONG PRESS */

   let timer;

   icon.addEventListener(
   "pointerdown",
   ()=>{
      timer =
      setTimeout(()=>{
        showMenu(index);
      },700);
   });

   icon.addEventListener(
   "pointerup",
   ()=>{
      clearTimeout(timer);
   });

   icon.addEventListener(
   "pointerleave",
   ()=>{
      clearTimeout(timer);
   });

   desktop.appendChild(icon);

 });

}

/* ==========================
   OPEN URL
========================== */

function openUrl(url){

 const desktop =
 document.getElementById("desktop");

 const viewer =
 document.getElementById("viewer");

 const loader =
 document.getElementById("loader");

 loader.style.display = "flex";

 desktop.style.display = "none";

 viewer.style.display = "block";

 viewer.src = url;

 viewer.onload = ()=>{
   loader.style.display = "none";
 };

}

/* ==========================
   HOME
========================== */

function goHome(){

 const viewer =
 document.getElementById("viewer");

 viewer.src = "";

 viewer.style.display = "none";

 document
 .getElementById("desktop")
 .style.display = "grid";

}

/* ==========================
   MODAL
========================== */

function openModal(index=null){

 editIndex = index;

 document
 .getElementById("modal")
 .style.display = "flex";

 const title =
 document.getElementById(
 "modalTitle"
 );

 if(index !== null){

   title.textContent =
   "Edit App";

   document
   .getElementById("appName")
   .value =
   apps[index].name;

   document
   .getElementById("appUrl")
   .value =
   apps[index].url;

 }else{

   title.textContent =
   "Add App";

   document
   .getElementById("appName")
   .value = "";

   document
   .getElementById("appUrl")
   .value = "";

   document
   .getElementById("appIcon")
   .value = "";

 }

}

function closeModal(){

 document
 .getElementById("modal")
 .style.display = "none";

}

/* ==========================
   SAVE APP
========================== */

function saveApp(){

 const name =
 document
 .getElementById("appName")
 .value.trim();

 const url =
 document
 .getElementById("appUrl")
 .value.trim();

 const file =
 document
 .getElementById("appIcon")
 .files[0];

 if(!name || !url){

   alert(
   "App Name and URL required"
   );

   return;
 }

 try{
   new URL(url);
 }
 catch{

   alert("Invalid URL");

   return;
 }

 const finish = (icon)=>{

   if(editIndex !== null){

      apps[editIndex] = {
         name,
         url,
         icon
      };

   }else{

      apps.push({
         name,
         url,
         icon
      });

   }

   persist();

   render();

   closeModal();

 };

 if(file){

   const reader =
   new FileReader();

   reader.onload =
   e=>{
      finish(
      e.target.result
      );
   };

   reader.readAsDataURL(
   file
   );

 }else{

   if(editIndex !== null){

      finish(
      apps[editIndex].icon
      );

   }else{

      alert(
      "Please select icon"
      );

   }

 }

}

/* ==========================
   MENU
========================== */

function showMenu(index){

 selectedIndex = index;

 document
 .getElementById("menu")
 .style.display = "flex";

}

function closeMenu(){

 document
 .getElementById("menu")
 .style.display = "none";

}

function editSelected(){

 closeMenu();

 openModal(
 selectedIndex
 );

}

function deleteSelected(){

 closeMenu();

 if(
 confirm(
 "Delete this app?"
 )
 ){

   apps.splice(
   selectedIndex,
   1
   );

   persist();

   render();
 }

}

/* ==========================
   SEARCH
========================== */

document
.getElementById(
"searchInput"
)
.addEventListener(
"input",
e=>{
 render(e.target.value);
}
);

/* ==========================
   DARK MODE
========================== */

function toggleDarkMode(){

 document.body
 .classList
 .toggle("dark");

 localStorage.setItem(
 "darkMode",
 document.body
 .classList
 .contains("dark")
 );

}

if(
 localStorage.getItem(
 "darkMode"
 ) === "true"
){
 document.body
 .classList
 .add("dark");
}

/* ==========================
   SETTINGS
========================== */

function openSettings(){

 document
 .getElementById(
 "settingsModal"
 )
 .style.display = "flex";

}

function closeSettings(){

 document
 .getElementById(
 "settingsModal"
 )
 .style.display = "none";

}

/* ==========================
   EXPORT
========================== */

function exportApps(){

 const blob =
 new Blob(
 [
 JSON.stringify(
 apps,
 null,
 2
 )
 ],
 {
 type:
 "application/json"
 }
 );

 const a =
 document.createElement("a");

 a.href =
 URL.createObjectURL(
 blob
 );

 a.download =
 "kone-soft-backup.json";

 a.click();

}

/* ==========================
   IMPORT
========================== */

document
.getElementById(
"importFile"
)
.addEventListener(
"change",
e=>{

 const file =
 e.target.files[0];

 if(!file) return;

 const reader =
 new FileReader();

 reader.onload =
 event=>{

   try{

      apps =
      JSON.parse(
      event.target.result
      );

      persist();

      render();

      alert(
      "Backup Restored"
      );

   }catch{

      alert(
      "Invalid Backup File"
      );

   }

 };

 reader.readAsText(
 file
 );

}
);

/* ==========================
   START
========================== */

render();


/* ==========================
   OPEN PAGE
========================== */

function openPage(page){

window.location.href = page;

}

/* ==========================
   SETTINGS
========================== */

function openSettings(){

document
.getElementById(
"settingsModal"
)
.style.display = "flex";

}

function closeSettings(){

document
.getElementById(
"settingsModal"
)
.style.display = "none";

}

/* ==========================
   THEME SYSTEM
========================== */

function setTheme(theme){

document.body.classList.remove(
"dark",
"blue",
"green"
);

if(theme !== "light"){

document.body.classList.add(
theme
);

}

localStorage.setItem(
"theme",
theme
);

closeSettings();

}

function loadTheme(){

const savedTheme =
localStorage.getItem(
"theme"
) || "light";

if(savedTheme !== "light"){

document.body.classList.add(
savedTheme
);

}

}

loadTheme();

/* ==========================
   LIVE IST CLOCK
========================== */

function updateClock(){

const now = new Date();

const date =
now.toLocaleDateString(
"en-IN",
{
day:"2-digit",
month:"short",
year:"numeric",
timeZone:"Asia/Kolkata"
}
);

const time =
now.toLocaleTimeString(
"en-IN",
{
hour:"2-digit",
minute:"2-digit",
second:"2-digit",
hour12:true,
timeZone:"Asia/Kolkata"
}
);

document
.getElementById(
"liveDateTime"
)
.innerHTML =
`${date} | ${time} IST`;

}

updateClock();

setInterval(
updateClock,
1000
);

/* ==========================
   SEARCH
========================== */

document
.getElementById(
"searchInput"
)
.addEventListener(
"input",
function(){

const search =
this.value
.toLowerCase()
.trim();

const widgets =
document.querySelectorAll(
".widget[data-name]"
);

/* ==========================
   SUMMARY COUNTS
========================== */

/*
Abhi temporary values 0 hain.

Future me pickup.html aur
return.html se sync karenge.
*/

function loadDashboardCounts(){

const pickupCount =
localStorage.getItem(
"pickupCount"
) || 0;

const returnCount =
localStorage.getItem(
"returnCount"
) || 0;

const totalCount =
Number(pickupCount)
+
Number(returnCount);

document
.getElementById(
"pickupCount"
)
.textContent =
pickupCount;

document
.getElementById(
"returnCount"
)
.textContent =
returnCount;

document
.getElementById(
"totalCount"
)
.textContent =
totalCount;

}

loadDashboardCounts();

========================== */

window.addEventListener(
"click",
function(e){

const modal =
document.getElementById(
"settingsModal"
);

if(
e.target === modal
){

closeSettings();

}

}
);

/* ==========================
   ESC KEY CLOSE
========================== */

document
.addEventListener(
"keydown",
function(e){

if(
e.key === "Escape"
){

closeSettings();

}

}
);
