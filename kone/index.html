<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventory Management</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
}

.header{
height:60px;
background:#1976d2;
color:#fff;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
}

.logo{
font-size:20px;
font-weight:bold;
}

.status{
display:flex;
align-items:center;
gap:8px;
}

.dot{
width:10px;
height:10px;
border-radius:50%;
background:#00e676;
}

.container{
display:flex;
min-height:calc(100vh - 60px);
}

.sidebar{
width:240px;
background:#fff;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.menu{
padding:15px;
}

.menu button{
width:100%;
padding:12px;
border:none;
background:#f4f6f9;
margin-bottom:10px;
cursor:pointer;
border-radius:8px;
font-size:15px;
}

.menu button:hover{
background:#1976d2;
color:white;
}

.content{
flex:1;
padding:20px;
}

.search{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:10px;
margin-bottom:20px;
}

.cards{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.card{
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.card h2{
font-size:28px;
margin-bottom:10px;
}

.card p{
color:#666;
}

.section{
margin-top:25px;
}

.table{
width:100%;
background:#fff;
border-radius:12px;
overflow:hidden;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.table table{
width:100%;
border-collapse:collapse;
}

.table th{
background:#1976d2;
color:#fff;
padding:12px;
text-align:left;
}

.table td{
padding:12px;
border-bottom:1px solid #eee;
}

.mobile{
display:none;
}

@media(max-width:768px){

.sidebar{
display:none;
}

.mobile{
display:block;
margin-bottom:15px;
}

.content{
padding:10px;
}

}

</style>

</head>
<body>

<div class="header">

<div class="logo">
Inventory Management
</div>

<div class="status">
<div class="dot"></div>
<span>Connected</span>
</div>

</div>

<div class="container">

<div class="sidebar">

<div class="menu">

<button onclick="openPage('dashboard')">
Dashboard
</button>

<button onclick="openOrders()">
Orders
</button>

<button onclick="openInventory()">
Inventory
</button>

<button onclick="openListings()">
Listings
</button>

<button onclick="openKarigar()">
Karigar
</button>

</div>

</div>

<div class="content">

<select
class="mobile"
onchange="mobileNav(this.value)"

>

<option value="">
Select Module
</option>

<option value="dashboard">
Dashboard
</option>

<option value="orders">
Orders
</option>

<option value="inventory">
Inventory
</option>

<option value="listings">
Listings
</option>

<option value="karigar">
Karigar
</option>

</select>

<input
id="masterSearch"
class="search"
placeholder="Master Search (AWB / Order ID / SKU / Karigar)"

>

<div class="cards">

<div class="card">

<h2 id="totalOrders">
0
</h2>

<p>Total Orders</p>

</div>

<div class="card">

<h2 id="totalListings">
0
</h2>

<p>Total Listings</p>

</div>

<div class="card">

<h2 id="totalStock">
0
</h2>

<p>Total Stock</p>

</div>

<div class="card">

<h2 id="totalKarigar">
0
</h2>

<p>Total Karigar</p>

</div>

</div>

<div class="section">

<div class="table">

<table>

<thead>

<tr>

<th>
Today Orders
</th>

<th>
Pickup
</th>

<th>
Return
</th>

</tr>

</thead>

<tbody>

<tr>

<td id="todayOrders">
0
</td>

<td id="pickupCount">
0
</td>

<td id="returnCount">
0
</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

</div>

<script>

const API=
"https://script.google.com/macros/s/PASTE_DEPLOYMENT_ID/exec";

async function getJSON(url){

const res=
await fetch(url);

return await res.json();

}

async function loadDashboard(){

const data=
await getJSON(
API+"?action=dashboard"
);

if(!data.success)
return;

document.getElementById(
"totalOrders"
).innerText=
data.orders;

document.getElementById(
"totalListings"
).innerText=
data.listings;

document.getElementById(
"totalStock"
).innerText=
data.stock;

document.getElementById(
"totalKarigar"
).innerText=
data.karigar;

document.getElementById(
"pickupCount"
).innerText=
data.pickup;

document.getElementById(
"returnCount"
).innerText=
data.returns;

}

async function loadTodayOrders(){

const data=
await getJSON(
API+
"?action=todayOrders"
);

if(!data.success)
return;

document.getElementById(
"todayOrders"
).innerText=
data.count;

}

async function masterSearch(q){

if(!q)
return;

const data=
await getJSON(

API+
"?action=search&q="+
encodeURIComponent(q)

);

if(!data.success){

alert(
"No Record Found"
);

return;

}

if(
data.module==="orders"
){

window.location=
"orders.html?q="+q;

}

if(
data.module==="listings"
){

window.location=
"listings.html?q="+q;

}

if(
data.module==="karigar"
){

window.location=
"karigar.html?q="+q;

}

}

document
.getElementById(
"masterSearch"
)
.addEventListener(
"keyup",
function(e){

if(
e.key==="Enter"
){

masterSearch(
this.value
);

}

}
);

function openOrders(){
window.location=
"orders.html";
}

function openInventory(){
window.location=
"inventory.html";
}

function openListings(){
window.location=
"listings.html";
}

function openKarigar(){
window.location=
"karigar.html";
}

function openPage(v){

if(v==="dashboard")
location.reload();

}

function mobileNav(v){

if(v==="orders")
openOrders();

if(v==="inventory")
openInventory();

if(v==="listings")
openListings();

if(v==="karigar")
openKarigar();

}

loadDashboard();
loadTodayOrders();

</script>

</body>
</html>
