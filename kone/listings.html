<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Listings</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
padding:20px;
}

.card{
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
margin-bottom:20px;
}

.input{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
margin-bottom:10px;
}

.btn{
background:#1976d2;
color:white;
border:none;
padding:12px;
border-radius:8px;
cursor:pointer;
}

.table{
background:white;
border-radius:12px;
overflow:auto;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#1976d2;
color:white;
padding:12px;
}

td{
padding:12px;
border-bottom:1px solid #eee;
}

img{
width:50px;
height:50px;
object-fit:cover;
border-radius:6px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

@media(max-width:768px){

.grid{
grid-template-columns:1fr;
}

}

</style>

</head>
<body>

<div class="card">

<h2>Add Listing</h2>

<div class="grid">

<input id="image" class="input" placeholder="Image URL">

<input id="sku" class="input" placeholder="SKU">

<input id="product" class="input" placeholder="Product Name">

<input id="price" class="input" placeholder="Price">

<input id="stock" class="input" placeholder="Stock">

</div>

<button
class="btn"
onclick="saveListing()"

>

Save Listing </button>

</div>

<div class="card">

<input
id="search"
class="input"
placeholder="Search SKU"
onkeyup="searchListing()"

>

</div>

<div class="table">

<table>

<thead>

<tr>

<th>Image</th>
<th>SKU</th>
<th>Product</th>
<th>Price</th>
<th>Stock</th>
<th>Edit</th>
<th>Delete</th>

</tr>

</thead>

<tbody id="listingBody"></tbody>

</table>

</div>

<script>

const API=
"https://script.google.com/macros/s/AKfycbxSn8rbIWTCwurtMA5krgKYcWGDrTu6GiGqBxsrpJJ7caK3VnSKjnATGrNq6uTilET4/exec";

let listings=[];

function normalize(v){

return String(v||"")
.toLowerCase()
.replace(/[^a-z0-9]/g,"");

}

async function api(url){

const r=
await fetch(url);

return await r.json();

}

async function post(data){

const r=
await fetch(
API,
{
method:"POST",
body:JSON.stringify(data)
}
);

return await r.json();

}

async function saveListing(){

const r=
await post({

action:"saveListing",

data:{

image:
image.value,

sku:
sku.value,

product:
product.value,

price:
price.value,

stock:
stock.value

}

});

if(r.success){

alert(
"Listing Saved"
);

clearForm();

loadListings();

}

}

function clearForm(){

image.value="";
sku.value="";
product.value="";
price.value="";
stock.value="";

}

async function loadListings(){

const d=
await api(
API+
"?action=listings"
);

if(!d.success)
return;

listings=
d.rows||[];

renderRows(
listings
);

}

function renderRows(rows){

let html="";

rows.forEach(r=>{

html+=`

<tr>

<td>

<img src="${
r.image||''
}">

</td>

<td>${r.sku}</td>

<td>${r.product}</td>

<td>${r.price}</td>

<td>${r.stock}</td>

<td>

<button
class="btn"
onclick="editRow(
${r.row}
)"
>

Edit

</button>

</td>

<td>

<button
class="btn"
onclick="deleteRow(
${r.row}
)"
>

Delete

</button>

</td>

</tr>

`;

});

listingBody.innerHTML=
html;

}

function editRow(row){

const r=
listings.find(
x=>x.row===row
);

if(!r)
return;

image.value=
r.image;

sku.value=
r.sku;

product.value=
r.product;

price.value=
r.price;

stock.value=
r.stock;

window.currentRow=
row;

}

async function updateListing(){

const r=
await post({

action:"updateListing",

data:{

row:
window.currentRow,

image:
image.value,

sku:
sku.value,

product:
product.value,

price:
price.value,

stock:
stock.value

}

});

alert(
"Updated"
);

loadListings();

}

async function deleteRow(row){

if(
!confirm(
"Delete Listing?"
)
)
return;

await post({

action:"deleteListing",

row:row

});

loadListings();

}

function searchListing(){

const q=
normalize(
search.value
);

if(!q){

renderRows(
listings
);

return;

}

const rows=
listings.filter(r=>

normalize(r.sku)
.includes(q)

||

normalize(r.product)
.includes(q)

);

renderRows(
rows
);

}

loadListings();

</script>

</body>
</html>
