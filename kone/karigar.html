<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Karigar</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
padding:20px;
}

.card{
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
}

.summary{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
margin-bottom:20px;
}

.box{
background:#fff;
padding:20px;
text-align:center;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.input{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
margin-bottom:10px;
}

.btn{
background:#1976d2;
color:white;
border:none;
padding:12px;
border-radius:8px;
cursor:pointer;
width:100%;
}

.table{
background:white;
border-radius:12px;
overflow:auto;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#1976d2;
color:white;
padding:12px;
}

td{
padding:12px;
border-bottom:1px solid #eee;
}

@media(max-width:768px){

.grid,
.summary{
grid-template-columns:1fr;
}

}

</style>

</head>
<body>

<div class="summary">

<div class="box">
<h2 id="totalReceived">0</h2>
<p>Received Qty</p>
</div>

<div class="box">
<h2 id="totalAlter">0</h2>
<p>Alter Qty</p>
</div>

<div class="box">
<h2 id="totalPending">0</h2>
<p>Pending Qty</p>
</div>

</div>

<div class="grid">

<div class="card">

<h3>Issue To Karigar</h3>

<input id="issueName" class="input" placeholder="Karigar Name">
<input id="issueSku" class="input" placeholder="SKU">
<input id="issueQty" class="input" placeholder="Qty">
<input id="issueRemark" class="input" placeholder="Remark">

<button
class="btn"
onclick="issueKarigar()"

>

Issue </button>

</div>

<div class="card">

<h3>Receive From Karigar</h3>

<input id="receiveName" class="input" placeholder="Karigar Name">
<input id="receiveSku" class="input" placeholder="SKU">
<input id="receiveQty" class="input" placeholder="Qty">
<input id="receiveRemark" class="input" placeholder="Remark">

<button
class="btn"
onclick="receiveKarigar()"

>

Receive </button>

</div>

</div>

<div class="card">

<input
id="search"
class="input"
placeholder="Search Karigar / SKU"
onkeyup="searchData()"

>

</div>

<div class="table">

<table>

<thead>

<tr>

<th>Date</th>
<th>Karigar</th>
<th>SKU</th>
<th>Received</th>
<th>Alter</th>
<th>Pending</th>
<th>Balance</th>

</tr>

</thead>

<tbody
id="karigarBody"
></tbody>

</table>

</div>

<script>

const API=
"https://script.google.com/macros/s/AKfycbxSn8rbIWTCwurtMA5krgKYcWGDrTu6GiGqBxsrpJJ7caK3VnSKjnATGrNq6uTilET4/exec";

let rows=[];

function normalize(v){

return String(v||"")
.toLowerCase()
.replace(/[^a-z0-9]/g,"");

}

async function api(url){

const r=
await fetch(url);

return await r.json();

}

async function post(data){

const r=
await fetch(
API,
{
method:"POST",
body:JSON.stringify(data)
}
);

return await r.json();

}

async function issueKarigar(){

const r=
await post({

action:"karigarIssue",

name:
issueName.value,

sku:
issueSku.value,

qty:
issueQty.value,

remarks:
issueRemark.value

});

alert(
r.success?
"Issued":
r.message
);

loadAll();

}

async function receiveKarigar(){

const r=
await post({

action:"karigarReceive",

name:
receiveName.value,

sku:
receiveSku.value,

qty:
receiveQty.value,

remarks:
receiveRemark.value

});

alert(
r.success?
"Received":
r.message
);

loadAll();

}

async function loadSummary(){

const d=
await api(
API+
"?action=dashboard"
);

if(!d.success)
return;

document
.getElementById(
"totalReceived"
)
.innerText=
d.karigarSummary.received;

document
.getElementById(
"totalAlter"
)
.innerText=
d.karigarSummary.alter;

document
.getElementById(
"totalPending"
)
.innerText=
d.karigarSummary.pending;

}

async function loadHistory(){

const d=
await api(
API+
"?action=karigar"
);

if(!d.success)
return;

rows=
d.rows||[];

renderRows(
rows
);

}

function renderRows(data){

let html="";

data.forEach(r=>{

html+=`

<tr>

<td>${r.date||""}</td>

<td>${r.name||""}</td>

<td>${r.sku||""}</td>

<td>${r.received||0}</td>

<td>${r.alter||0}</td>

<td>${r.pending||0}</td>

<td>${r.balance||0}</td>

</tr>

`;

});

karigarBody.innerHTML=
html;

}

function searchData(){

const q=
normalize(
search.value
);

if(!q){

renderRows(rows);

return;

}

const filtered=
rows.filter(r=>

normalize(r.name)
.includes(q)

||

normalize(r.sku)
.includes(q)

);

renderRows(
filtered
);

}

function loadAll(){

loadSummary();
loadHistory();

}

loadAll();

</script>

</body>
</html>
