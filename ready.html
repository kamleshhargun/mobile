<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Harsidhi Ventures Pickup Return System</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="header">
        HARSIDHI VENTURES PICKUP RETURN SYSTEM
    </div>

    <div class="main">

        <!-- Left Panel -->
        <div class="panel">
            <div class="panel-header">Dashboard & Bulk Update</div>

            <div class="left-content">

                <div id="dashboardArea"></div>

                <div class="card">
                    <h3>Bulk Update</h3>

                    <input type="date" id="bulkDate" class="input">

                    <button type="button" class="btn btn-camera" onclick="loadBulkCounts()">
                        Load Counts
                    </button>

                    <hr>

                    <div id="bulkCounts">
                        Pickup : 0<br>
                        Return : 0
                    </div>

                    <br>

                    <button type="button" id="pickupUpdateBtn" class="btn btn-save"
                        onclick="startBulkUpdate('Pickup')">
                        Update Pickup
                    </button>

                    <button type="button" id="returnUpdateBtn" class="btn btn-save"
                        onclick="startBulkUpdate('Return')">
                        Update Return
                    </button>

                    <hr>

                    <div id="bulkProgress">
                        Waiting...
                    </div>

                </div>
            </div>
        </div>

        <!-- Center Panel -->
        <div class="panel">

            <div class="center-content">

                <div class="mode-row">
                    <button type="button" id="pickupBtn" class="mode-btn pickup"
                        onclick="selectType('Pickup')">
                        Pickup
                    </button>

                    <button type="button" id="returnBtn" class="mode-btn return"
                        onclick="selectType('Return')">
                        Return
                    </button>
                </div>

                <div id="scanPanel" class="scan-panel">

                    <button type="button" class="btn btn-camera" onclick="startCamera()">
                        📷 Camera Scan
                    </button>

                    <button type="button" class="btn btn-manual" onclick="focusAWB()">
                        ⌨ Manual / Scanner
                    </button>

                    <div id="reader"></div>

                    <input
                        id="awbInput"
                        class="input"
                        type="text"
                        autocomplete="off"
                        placeholder="Scan AWB">

                    <input
                        id="orderInput"
                        class="input"
                        type="text"
                        autocomplete="off"
                        placeholder="Order ID (Manual Fallback)">

                    <div id="resultCard" class="result-card"></div>

                    <div class="action-row">

                        <button type="button" class="btn btn-save" onclick="saveEntry()">
                            Next
                        </button>

                        <button type="button" class="btn btn-stop" onclick="stopCamera()">
                            Stop
                        </button>

                    </div>

                </div>

            </div>

        </div>

        <!-- Right Panel -->
        <div class="panel">

            <div class="panel-header">
                Find Order
            </div>

            <div class="right-content">

                <div class="search-box">

                    <input
                        id="searchInput"
                        class="input"
                        type="text"
                        autocomplete="off"
                        placeholder="Search AWB / Order ID">

                    <button type="button" class="btn btn-camera small-btn"
                        onclick="searchOrder()">
                        Search
                    </button>

                    <div id="searchResult" class="search-result"></div>

                </div>

            </div>

        </div>

    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay">
        Loading...
    </div>

    <!-- Libraries -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <!-- JS Files -->
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/scanner.js"></script>
    <script src="js/tracking.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/bulk.js"></script>

</body>

</html>
