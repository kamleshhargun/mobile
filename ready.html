
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Harsidhi Ventures Pickup Return System</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>
<body>

    <!-- Top Header -->
    <header class="topbar">

        <div class="brand">

            <div class="logo">
                HV
            </div>

            <div>
                <div class="brand-title">
                    Harsidhi Ventures
                </div>

                <div class="brand-subtitle">
                    Pickup & Return Management System
                </div>
            </div>

        </div>

        <div class="live-status">
            ● System Online
        </div>

    </header>

    <!-- Dashboard Stats -->

    <section class="stats-row">

        <div class="stat-card">
            <div class="stat-title">Today's Pickup</div>
            <div id="pickupCount" class="stat-value">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-title">Today's Return</div>
            <div id="returnCount" class="stat-value">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-title">Pending Scan</div>
            <div id="pendingCount" class="stat-value">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-title">Total Processed</div>
            <div id="processedCount" class="stat-value">0</div>
        </div>

    </section>

    <!-- Main Layout -->

    <main class="dashboard-grid">

        <!-- Left Sidebar -->

        <aside class="sidebar">

            <div class="card">

                <h3>📦 Bulk Update</h3>

                <input type="date" id="bulkDate" class="input">

                <button class="btn btn-primary"
                    onclick="loadBulkCounts()">

                    Load Counts

                </button>

                <div id="bulkCounts" class="info-box">

                    Pickup : 0<br>
                    Return : 0

                </div>

                <button
                    id="pickupUpdateBtn"
                    class="btn btn-success"
                    onclick="startBulkUpdate('Pickup')">

                    Update Pickup

                </button>

                <button
                    id="returnUpdateBtn"
                    class="btn btn-success"
                    onclick="startBulkUpdate('Return')">

                    Update Return

                </button>

                <div id="bulkProgress" class="info-box">

                    Waiting...

                </div>

            </div>

            <div class="card">

                <h3>🔍 Search Order</h3>

                <input
                    id="searchInput"
                    class="input"
                    placeholder="AWB / Order ID">

                <button
                    class="btn btn-primary"
                    onclick="searchOrder()">

                    Search Order

                </button>

                <div id="searchResult" class="search-result"></div>

            </div>

        </aside>

        <!-- Scanner Section -->

        <section class="scanner-section">

            <div class="card">

                <h3>📷 Scan Operations</h3>

                <div class="mode-row">

                    <button
                        id="pickupBtn"
                        class="mode-btn pickup"
                        onclick="selectType('Pickup')">

                        Pickup

                    </button>

                    <button
                        id="returnBtn"
                        class="mode-btn return"
                        onclick="selectType('Return')">

                        Return

                    </button>

                </div>

                <div id="scanPanel" class="scan-panel">

                    <div class="button-group">

                        <button
                            class="btn btn-primary"
                            onclick="startCamera()">

                            📷 Camera Scan

                        </button>

                        <button
                            class="btn btn-secondary"
                            onclick="focusAWB()">

                            ⌨ Manual Scan

                        </button>

                    </div>

                    <div id="reader"></div>

                    <input
                        id="awbInput"
                        class="input"
                        placeholder="Scan AWB">

                    <input
                        id="orderInput"
                        class="input"
                        placeholder="Order ID">

                    <div
                        id="resultCard"
                        class="result-card">
                    </div>

                    <div class="action-row">

                        <button
                            class="btn btn-success"
                            onclick="saveEntry()">

                            Save & Next

                        </button>

                        <button
                            class="btn btn-danger"
                            onclick="stopCamera()">

                            Stop Scanner

                        </button>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <div id="loadingOverlay">

        <div class="loader-card">
            Loading...
        </div>

    </div>

    <!-- Libraries -->

    <script defer src="https://unpkg.com/html5-qrcode"></script>

    <!-- Application JS -->

    <script defer src="js/api.js"></script>
    <script defer src="js/ui.js"></script>
    <script defer src="js/scanner.js"></script>
    <script defer src="js/tracking.js"></script>
    <script defer src="js/dashboard.js"></script>
    <script defer src="js/bulk.js"></script>

</body>

</html>
