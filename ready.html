<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harsidhi Ventures - Premium Pickup & Return System</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        :root {
            --bg-main: #f8fafc;
            --panel-bg: #ffffff;
            --border-color: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --teal: #0d9488;
            --teal-light: #f0fdfa;
            --danger: #ef4444;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.02);
            --shadow-md: 0 4px 20px -2px rgba(15, 23, 42, 0.04);
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: var(--bg-main);
            height: 100vh;
            color: var(--text-primary);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Header Navigation */
        .header {
            height: 64px;
            background: var(--panel-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .header .brand {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header .brand span {
            color: var(--primary);
        }

        .header .status-badge {
            font-size: 13px;
            font-weight: 600;
            color: #10b981;
            background: #ecfdf5;
            padding: 6px 12px;
            border-radius: 100px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Main Workspace Layout */
        .main {
            height: calc(100vh - 64px);
            display: grid;
            grid-template-columns: 320px 1fr 360px;
            gap: 16px;
            padding: 16px;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-md);
        }

        .panel-header {
            padding: 18px 20px;
            font-weight: 700;
            font-size: 15px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .scrollable-content {
            padding: 16px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Dashboard Grid Layout */
        #dashboardArea {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .card {
            padding: 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--panel-bg);
            transition: all 0.2s ease;
        }

        .card:hover {
            border-color: #cbd5e1;
        }

        .dashboard-card {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .dashboard-card b {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        .dashboard-card h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            font-family: var(--font-mono);
        }

        /* Custom Colors for Cards */
        .card-pickup h2 { color: var(--primary); }
        .card-return h2 { color: var(--teal); }

        /* Segmented Mode Row */
        .mode-row {
            display: flex;
            background: #f1f5f9;
            padding: 4px;
            border-radius: var(--radius-md);
            gap: 4px;
        }

        .mode-btn {
            flex: 1;
            height: 44px;
            border-radius: calc(var(--radius-md) - 2px);
            border: none;
            font-weight: 600;
            font-size: 14px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .mode-btn.active-pickup {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .mode-btn.active-return {
            background: var(--teal);
            color: #fff;
            box-shadow: 0 4px 12px rgba(13, 148, 136, 0.2);
        }

        /* Scan Panel styling */
        .scan-panel {
            display: none;
            flex-direction: column;
            gap: 14px;
            padding: 20px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            background: #fbfcfe;
        }

        .action-row {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }

        /* Modern Inputs */
        .input {
            height: 46px;
            padding: 0 16px;
            border: 1px solid #cbd5e1;
            border-radius: var(--radius-md);
            outline: none;
            font-size: 14px;
            color: var(--text-primary);
            background: #fff;
            transition: all 0.2s ease;
            width: 100%;
        }

        .input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37,99,235,0.1);
        }

        .input-mono {
            font-family: var(--font-mono);
            letter-spacing: 0.5px;
        }

        /* Advanced Professional Buttons */
        .btn {
            border: none;
            border-radius: var(--radius-md);
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn-camera { background: var(--primary); color: #fff; }
        .btn-camera:hover { background: #1d4ed8; }
        .btn-manual { background: #475569; color: #fff; }
        .btn-manual:hover { background: #334155; }
        .btn-save { background: #10b981; color: #fff; width: 100%; }
        .btn-save:hover { background: #059669; }
        .btn-stop { background: #f1f5f9; color: var(--text-primary); }
        .btn-stop:hover { background: #e2e8f0; }

        .small-btn { padding: 10px 14px; font-size: 13px; width: 100%; }

        /* Camera Box Overhaul */
        #reader {
            display: none;
            width: 100%;
            overflow: hidden;
            border-radius: var(--radius-md);
            border: 2px dashed #cbd5e1;
            background: #000;
        }

        /* Result Cards & Badges */
        .result-card {
            display: none;
            font-size: 13px;
            line-height: 1.6;
            background: #fff;
            border-left: 4px solid var(--primary);
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .badge-pickup { background: var(--primary-light); color: var(--primary); }
        .badge-return { background: var(--teal-light); color: var(--teal); }

        /* Bulk counts styling */
        .bulk-display-box {
            background: #f8fafc;
            padding: 12px;
            border-radius: var(--radius-md);
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            line-height: 1.6;
        }

        #bulkProgress {
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
            margin-top: 4px;
        }

        /* Toast Notifications */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #0f172a;
            color: #fff;
            padding: 14px 24px;
            border-radius: 100px;
            z-index: 9999;
            box-shadow: 0 12px 30px rgba(15,23,42,0.2);
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        hr { border: 0; border-top: 1px solid var(--border-color); margin: 4px 0; }

        /* Global Overlay Screen */
        #loadingOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(8px);
            z-index: 99999;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            gap: 12px;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #e2e8f0;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Responsive Mobile Behavior */
        @media(max-width: 1024px){
            body { overflow: auto; }
            .main { grid-template-columns: 1fr; height: auto; }
            .panel { min-height: auto; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand">Harsidhi<span>Ventures</span></div>
        <div class="status-badge"><div style="width:8px;height:8px;background:#10b981;border-radius:50%"></div> Panel System Online</div>
    </div>

    <div class="main">

        <div class="panel">
            <div class="panel-header">Dashboard Matrix</div>
            <div class="scrollable-content">
                <div id="dashboardArea"></div>
                
                <div class="card" style="display: flex; flex-direction: column; gap:12px;">
                    <h4 style="font-size:14px; font-weight:700;">Bulk Automation Pipeline</h4>
                    <input type="date" id="bulkDate" class="input">
                    <button class="btn btn-camera small-btn" onclick="loadBulkCounts()">🔄 Load Stats</button>
                    <hr>
                    <div id="bulkCounts" class="bulk-display-box">Pickup Logs: 0<br>Return Logs: 0</div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                        <button id="pickupUpdateBtn" class="btn btn-save small-btn" style="background:var(--primary)" onclick="startBulkUpdate('Pickup')">Sync Pickups</button>
                        <button id="returnUpdateBtn" class="btn btn-save small-btn" style="background:var(--teal)" onclick="startBulkUpdate('Return')">Sync Returns</button>
                    </div>
                    <hr>
                    <div id="bulkProgress">System Idle...</div>
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">Execution Workspace</div>
            <div class="scrollable-content" style="gap:16px;">
                <div class="mode-row">
                    <button id="pickupBtn" class="mode-btn" onclick="selectType('Pickup')">Log Pickup Shipment</button>
                    <button id="returnBtn" class="mode-btn" onclick="selectType('Return')">Log Return Order</button>
                </div>

                <div id="scanPanel" class="scan-panel">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap:10px;">
                        <button class="btn btn-camera" onclick="startCamera()">📷 Launch Camera</button>
                        <button class="btn btn-manual" onclick="focusAWB()">⌨ Laser/Manual</button>
                    </div>
                    <div id="reader"></div>
                    <input id="awbInput" class="input input-mono" placeholder="Scan or type AWB Barcode Number">
                    <input id="orderInput" class="input input-mono" placeholder="Fallback Order ID (Manual Override)" style="display:none;">
                    <div id="resultCard" class="card result-card"></div>
                    <div class="action-row">
                        <button class="btn btn-save" onclick="saveEntry()">Commit Status (Next)</button>
                        <button class="btn btn-stop" onclick="stopWork()">Reset Panel</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">Database Query</div>
            <div class="scrollable-content">
                <div class="card" style="display:flex; flex-direction:column; gap:12px;">
                    <input id="searchInput" class="input input-mono" placeholder="AWB / Order ID Reference">
                    <button class="btn btn-camera small-btn" onclick="searchOrder()">🔍 Search Archive</button>
                    <button id="updateSingleBtn" class="btn btn-save small-btn" style="display:none;">Patch Sheet Data</button>
                    <div id="searchResult" style="display:flex; flex-direction:column; gap:10px; margin-top:4px;"></div>
                </div>
            </div>
        </div>

    </div>

    <div id="loadingOverlay"><div class="spinner"></div> Processing Requests...</div>

    <script>
        /* ===================================
        CONFIG & INTEGRATION ENDPOINT
        =================================== */
        const API_URL = "https://script.google.com/macros/s/AKfycbzCx2cLgXw_rgA0T8_dgfAqRAGtTpBsIhM-xeysJcCbbrpn7mH0g1g13Au4KpiCPH8/exec";

        /* ===================================
        GLOBAL RUNTIME VARIABLES
        =================================== */
        let bulkRunning = false;
        let currentType = "";
        let currentTracking = null;
        let html5QrCode = null;
        const beep = new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg");

        /* ===================================
        TYPE CONTROLLER
        =================================== */
        function selectType(type){
            currentType = type;
            document.getElementById("scanPanel").style.display = "flex";
            document.getElementById("pickupBtn").classList.remove("active-pickup");
            document.getElementById("returnBtn").classList.remove("active-return");

            if(type === "Pickup"){
                document.getElementById("pickupBtn").classList.add("active-pickup");
            } else {
                document.getElementById("returnBtn").classList.add("active-return");
            }
            clearForm();
            document.getElementById("awbInput").focus();
        }

        /* ===================================
        FORM RESET ROUTINE
        =================================== */
        function clearForm(){
            currentTracking = null;
            document.getElementById("awbInput").value = "";
            document.getElementById("orderInput").value = "";
            document.getElementById("orderInput").style.display = "none";
            document.getElementById("resultCard").style.display = "none";
            document.getElementById("resultCard").innerHTML = "";
        }

        function focusAWB(){
            document.getElementById("awbInput").focus();
        }

        /* ===================================
        CAMERA SCANNER RUNTIME
        =================================== */
        async function startCamera(){
            try {
                if(html5QrCode){ await stopCamera(); }
                document.getElementById("reader").style.display = "block";
                html5QrCode = new Html5Qrcode("reader");
                await html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 20, qrbox: { width: 280, height: 140 } },
                    function(decodedText){
                        document.getElementById("awbInput").value = decodedText;
                        beep.play();
                        stopCamera();
                        trackShipment();
                    }
                );
            } catch(err) {
                toast("Camera Initialization Failed");
                console.log(err);
            }
        }

        async function stopCamera(){
            try {
                if(html5QrCode){
                    await html5QrCode.stop();
                    await html5QrCode.clear();
                    html5QrCode = null;
                }
            } catch(err){}
            document.getElementById("reader").style.display = "none";
        }

        /* ===================================
        KEYBOARD & HARDWARE LASER KEY LISTENER
        =================================== */
        document.getElementById("awbInput").addEventListener("keydown", function(e){
            if(e.key === "Enter"){ trackShipment(); }
        });

        let scannerBuffer = "";
        document.addEventListener("keydown", function(e){
            if(document.activeElement.id !== "awbInput"){ return; }
            if(e.key === "Enter"){
                e.preventDefault();
                const awb = scannerBuffer.trim();
                if(awb.length > 5){
                    document.getElementById("awbInput").value = awb;
                    trackShipment();
                }
                scannerBuffer = "";
                return;
            }
            if(e.key.length === 1){ scannerBuffer += e.key; }
        });

        /* ===================================
        CORE API NETWORKING (TRACK SHIPMENT)
        =================================== */
        async function trackShipment(){
            const awb = document.getElementById("awbInput").value.trim();
            if(!awb){ toast("Scan Required"); return; }
            showLoading();

            try {
                const response = await fetch(API_URL + "?action=trackShipment&awb=" + encodeURIComponent(awb));
                const result = await response.json();
                if(result.success){
                    currentTracking = result;
                    renderTracking(result);
                    return;
                }
                openManualOrder();
            } catch(err){
                console.log(err);
                openManualOrder();
            }
        }

        function openManualOrder(){
            currentTracking = null;
            const card = document.getElementById("resultCard");
            card.style.display = "block";
            card.style.borderLeftColor = "var(--danger)";
            card.innerHTML = `<div style="color:var(--danger); font-weight:700;">Record Not Found</div>
                              <div style="margin-top:4px; color:var(--text-secondary)">Please fill order ID manually code.</div>`;
            document.getElementById("orderInput").style.display = "block";
            document.getElementById("orderInput").focus();
        }

        function renderTracking(data){
            const card = document.getElementById("resultCard");
            card.style.display = "block";
            card.style.borderLeftColor = currentType === "Pickup" ? "var(--primary)" : "var(--teal)";
            card.innerHTML = `
                <div style="margin-bottom:6px;"><span class="badge ${currentType==='Pickup'?'badge-pickup':'badge-return'}">${currentType} Validated</span></div>
                <b>AWB:</b> <span style="font-family:var(--font-mono)">${data.awb || ""}</span><br>
                <b>Order ID:</b> <span style="font-family:var(--font-mono)">${data.orderId || ""}</span><br>
                <b>Status:</b> ${data.status || ""}<br>
                <b>Courier:</b> ${data.courier || ""}<br>
                <b>Customer:</b> ${data.customerName || ""}<br>
                <b>Destination:</b> ${data.city || ""}
            `;
            document.getElementById("orderInput").value = data.orderId || "";
        }

        function showLoading(){
            const card = document.getElementById("resultCard");
            card.style.display = "block";
            card.innerHTML = `<div style="display:flex; align-items:center; gap:8px;"><div class="spinner" style="width:16px; height:16px; border-width:2px;"></div> Syncing manifest server records...</div>`;
        }

        function stopWork(){
            stopCamera();
            currentType = "";
            clearForm();
            document.getElementById("scanPanel").style.display = "none";
            document.getElementById("pickupBtn").classList.remove("active-pickup");
            document.getElementById("returnBtn").classList.remove("active-return");
        }

        function toast(msg){
            const t = document.createElement("div");
            t.className = "toast";
            t.innerHTML = `⚙️ <span>${msg}</span>`;
            document.body.appendChild(t);
            setTimeout(()=>t.remove(), 2500);
        }

        /* ===================================
        DATA PERSISTENCE ROUTINE (SAVE RECORDS)
        =================================== */
        async function saveEntry(){
            if(!currentType){ toast("Select Action Mode First"); return; }
            const awb = document.getElementById("awbInput").value.trim();
            if(!awb){ toast("AWB Parameter Blank"); return; }

            const payload = {
                type: currentType,
                awb: awb,
                orderId: document.getElementById("orderInput").value.trim(),
                courier: currentTracking?.courier || "",
                status: currentTracking?.status || "",
                customerName: currentTracking?.customerName || "",
                city: currentTracking?.city || "",
                state: currentTracking?.state || "",
                destination: currentTracking?.destination || "",
                pickupDate: currentTracking?.pickupDate || "",
                deliveredDate: currentTracking?.deliveredDate || "",
                expectedDate: currentTracking?.expectedDate || currentTracking?.estimatedDate || "",
                isRTO: currentTracking?.isRTO || false
            };

            try {
                showLoader();
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: "saveEntry", payload: payload })
                });
                const text = await response.text();
                let result = {};
                try { result = JSON.parse(text); } catch(e){
                    hideLoader();
                    toast("Fatal Pipeline Handshake Mismatch");
                    return;
                }

                hideLoader();
                if(result.duplicate){
                    toast("Duplicate Master Identity Entry");
                    document.getElementById("awbInput").select();
                    return;
                }
                if(!result.success){
                    toast(result.message || "Execution Pipeline Interrupted");
                    return;
                }

                playSuccessSound();
                toast("Log Successfully Anchored!");
                clearForm();
                currentTracking = null;
                document.getElementById("awbInput").focus();
                loadDashboard();
                loadRecentRecords();
            } catch(err){
                hideLoader();
                toast("Transaction Drop Event Error");
            }
        }

        function playSuccessSound(){
            try { beep.currentTime = 0; beep.play(); } catch(err){}
        }

        /* ===================================
        DASHBOARD METRICS & RECENT RECORDS FETCH
        =================================== */
        async function loadDashboard(){
            try {
                const response = await fetch(API_URL + "?action=getDashboardCounts");
                const data = await response.json();
                renderDashboard(data);
            } catch(err){ console.log(err); }
        }

        function renderDashboard(data){
            document.getElementById("dashboardArea").innerHTML = `
                <div class="card dashboard-card card-pickup"><b>Today Pickup</b><h2>${data.todayPickup||0}</h2></div>
                <div class="card dashboard-card card-return"><b>Today Return</b><h2>${data.todayReturn||0}</h2></div>
                <div class="card dashboard-card"><b>Yesterday Pickup</b><h2>${data.yesterdayPickup||0}</h2></div>
                <div class="card dashboard-card"><b>Yesterday Return</b><h2>${data.yesterdayReturn||0}</h2></div>
                <div class="card dashboard-card card-pickup"><b>${data.monthName||''} Pk</b><h2>${data.monthPickup||0}</h2></div>
                <div class="card dashboard-card card-return"><b>${data.monthName||''} Rt</b><h2>${data.monthReturn||0}</h2></div>
                <div id="recentArea" style="grid-column: span 2; display:flex; flex-direction:column; gap:10px; margin-top:4px;"></div>
            `;
        }

        async function loadRecentRecords(){
            try {
                const response = await fetch(API_URL + "?action=getRecentRecords");
                const data = await response.json();
                renderRecent(data.rows || []);
            } catch(err){ console.log(err); }
        }

        function renderRecent(rows){
            const box = document.getElementById("recentArea");
            if(!box) return;
            let html = `<h5 style="font-size:12px; font-weight:700; color:var(--text-secondary); margin-bottom:2px;">Real-time Streaming Logs</h5>`;
            rows.forEach(r => {
                html += `
                    <div class="card" style="padding:10px 14px; font-size:12px; display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <span style="font-family:var(--font-mono); font-weight:600; color:var(--text-primary);">${r.awb}</span>
                            <div style="font-size:11px; color:var(--text-secondary); margin-top:2px;">${r.date}</div>
                        </div>
                        <span class="badge ${r.type==='Pickup'?'badge-pickup':'badge-return'}">${r.type}</span>
                    </div>
                `;
            });
            box.innerHTML = html;
        }

        /* ===================================
        ADVANCED QUERIES & ARCHIVE LOOKUP
        =================================== */
        async function searchOrder(){
            const keyword = document.getElementById("searchInput").value.trim();
            if(!keyword){ toast("Input Parameter Matrix Blank"); return; }
            const resultBox = document.getElementById("searchResult");
            resultBox.innerHTML = `<div style="display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-secondary)"><div class="spinner" style="width:14px; height:14px; border-width:2px;"></div> Querying cluster nodes...</div>`;

            try {
                const response = await fetch(API_URL + "?action=searchOrder&keyword=" + encodeURIComponent(keyword));
                const data = await response.json();
                if(!data.success){
                    resultBox.innerHTML = `<div class="card" style="font-size:13px; font-weight:600; color:var(--danger); text-align:center;">Null Set Result Returned</div>`;
                    return;
                }
                renderSearchResult(data);
            } catch(err){
                resultBox.innerHTML = `<div class="card" style="font-size:13px; color:var(--danger)">Lookup Failure Fault</div>`;
            }
        }

        function renderSearchResult(data){
            document.getElementById("searchResult").innerHTML = `
                <div class="card" style="font-size:13px; line-height:1.7; display:flex; flex-direction:column; gap:4px;">
                    <b>AWB:</b> <span style="font-family:var(--font-mono)">${data.awb}</span>
                    <b>Order Ref:</b> <span style="font-family:var(--font-mono)">${data.orderId}</span>
                    <b>Manifest:</b> ${data.status}
                    <b>Mode Context:</b> <span class="badge ${data.type==='Pickup'?'badge-pickup':'badge-return'}" style="width:max-content">${data.type}</span>
                    <b>Courier Core:</b> ${data.courier}
                    <b>Identity:</b> ${data.customer}
                    <button class="btn btn-camera small-btn" style="margin-top:6px;" onclick="refreshCurrentStatus('${data.awb}')">🔄 Query Live Sync</button>
                </div>
            `;
        }

        let latestTrackingData = null;
        async function refreshCurrentStatus(awb){
            const resultBox = document.getElementById("searchResult");
            toast("Syncing live tracking dataset...");
            try {
                const response = await fetch(API_URL + "?action=trackShipment&awb=" + encodeURIComponent(awb));
                const data = await response.json();
                if(!data.success){ toast("Sync Mismatch Event Fault"); return; }
                latestTrackingData = data;
                
                resultBox.innerHTML += `
                    <div class="card" style="font-size:12px; background:#f8fafc; line-height:1.6; border-left:3px solid #10b981; display:flex; flex-direction:column; gap:2px;">
                        <h4 style="font-size:13px; color:#10b981; margin-bottom:4px;">Validated Live Server Delta</h4>
                        <b>Current Status:</b> ${data.status || ""}<br>
                        <b>RTO Flag:</b> ${data.isRTO ? "🚨 Activated" : "Normal Matrix"}<br>
                        <b>Delivered Date:</b> ${data.deliveredDate || "N/A"}
                        <button class="btn btn-save small-btn" style="margin-top:6px;" onclick="saveLatestStatus()">💾 Overwrite Sheet Cache</button>
                    </div>
                `;
            } catch(err){ toast("Sync Timeout Event Drop"); }
        }

        async function saveLatestStatus(){
            if(!latestTrackingData){ toast("Memory Heap Reference Blank"); return; }
            try {
                showLoader();
                const response = await fetch(API_URL + "?action=updateSingleAWB&awb=" + encodeURIComponent(latestTrackingData.awb));
                const result = await response.json();
                hideLoader();
                if(result.success){
                    toast("Sheet Cluster Synced!");
                    searchOrder();
                } else {
                    toast(result.message || "Write Mutex Denied");
                }
            } catch(e){ hideLoader(); toast("Data Stream Fault Error"); }
        }

        /* ===================================
        AUTOMATION BULK CONSOLE ENGINE
        =================================== */
        async function loadBulkCounts(){
            const date = document.getElementById("bulkDate").value;
            if(!date){ toast("Parameter Scope Void"); return; }
            const formatted = formatInputDate(date);
            
            try {
                const response = await fetch(API_URL + "?action=getBulkCounts&date=" + encodeURIComponent(formatted));
                const data = await response.json();
                document.getElementById("bulkCounts").innerHTML = `Pickup Buffer: ${data.pickup || 0}<br>Return Buffer: ${data.return || 0}`;
            } catch(e){ toast("Metrics Accumulator Dropped"); }
        }

        async function startBulkUpdate(type){
            if(bulkRunning){ toast("Parallel Worker Mutex Lock"); return; }
            const date = document.getElementById("bulkDate").value;
            if(!date){ toast("Define Timeline Bounds"); return; }
            
            bulkRunning = true;
            document.getElementById("pickupUpdateBtn").disabled = true;
            document.getElementById("returnUpdateBtn").disabled = true;

            try {
                const formatted = formatInputDate(date);
                const response = await fetch(API_URL + "?action=getBulkRows&date=" + encodeURIComponent(formatted) + "&type=" + encodeURIComponent(type));
                const result = await response.json();
                const rows = result.rows || [];
                let updated = 0, failed = 0;

                for(let i=0; i<rows.length; i++){
                    document.getElementById("bulkProgress").innerHTML = `🔂 Processing: ${i+1}/${rows.length} logs...`;
                    try {
                        const res = await fetch(API_URL + "?action=updateSingleAWB&awb=" + encodeURIComponent(rows[i].awb));
                        const data = await res.json();
                        if(data.success){ updated++; } else { failed++; }
                    } catch(e){ failed++; }
                }
                document.getElementById("bulkProgress").innerHTML = `✅ Pipeline Sync Completed.<br>Success: ${updated} | Dropped: ${failed}`;
            } catch(err){
                toast("Batch Worker Encountered Fault");
            } finally {
                bulkRunning = false;
                document.getElementById("pickupUpdateBtn").disabled = false;
                document.getElementById("returnUpdateBtn").disabled = false;
            }
        }

        function formatInputDate(dateStr){
            const d = new Date(dateStr);
            const dd = String(d.getDate()).padStart(2,"0");
            const mm = String(d.getMonth()+1).padStart(2,"0");
            const yyyy = d.getFullYear();
            return `${dd}/${mm}/${yyyy}`;
        }

        /* ===================================
        CORE SYSTEM INITIALIZATION HANDLER
        =================================== */
        window.onload = function(){
            loadDashboard();
            loadRecentRecords();
            setInterval(loadDashboard, 30000);
            setTimeout(() => { document.getElementById("awbInput").focus(); }, 200);
        };

        function showLoader(){ document.getElementById("loadingOverlay").style.display = "flex"; }
        function hideLoader(){ document.getElementById("loadingOverlay").style.display = "none"; }
    </script>
</body>
</html>
