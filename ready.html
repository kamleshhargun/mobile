
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Harsidhi Ventures Pickup Return System</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Header -->

    <header class="header">

        <div class="header-left">
            <div class="logo-circle">HV</div>

            <div>
                <div class="header-title">
                    HARSIDHI VENTURES
                </div>

                <div class="header-subtitle">
                    Pickup & Return Management System
                </div>
            </div>
        </div>

        <div class="header-right">
            <span class="status-badge">
                ● LIVE
            </span>
        </div>

    </header>

    <!-- Main Layout -->

    <main class="main">

        <!-- Left Panel -->

        <section class="panel">

            <div class="panel-header">
                📊 Dashboard & Bulk Update
            </div>

            <div class="left-content">

                <div id="dashboardArea"></div>

                <div class="card">

                    <h3>Bulk Update Center</h3>

                    <input
                        type="date"
                        id="bulkDate"
                        class="input">

                    <button
                        type="button"
                        class="btn btn-camera"
                        onclick="loadBulkCounts()">

                        Load Counts

                    </button>

                    <hr>

                    <div id="bulkCounts">

                        Pickup : 0<br>
                        Return : 0

                    </div>

                    <hr>

                    <button
                        type="button"
                        id="pickupUpdateBtn"
                        class="btn btn-save"
                        onclick="startBulkUpdate('Pickup')">

                        Update Pickup

                    </button>

                    <br><br>

                    <button
                        type="button"
                        id="returnUpdateBtn"
                        class="btn btn-save"
                        onclick="startBulkUpdate('Return')">

                        Update Return

                    </button>

                    <hr>

                    <div id="bulkProgress">

                        Waiting...

                    </div>

                </div>

            </div>

        </section>

        <!-- Center Panel -->

        <section class="panel">

            <div class="center-content">

                <div class="card">

                    <h3>Scan Operations</h3>

                    <div class="mode-row">

                        <button
                            type="button"
                            id="pickupBtn"
                            class="mode-btn pickup"
                            onclick="selectType('Pickup')">

                            Pickup

                        </button>

                        <button
                            type="button"
                            id="returnBtn"
                            class="mode-btn return"
                            onclick="selectType('Return')">

                            Return

                        </button>

                    </div>

                </div>

                <div id="scanPanel" class="scan-panel">

                    <button
                        type="button"
                        class="btn btn-camera"
                        onclick="startCamera()">

                        📷 Camera Scan

                    </button>

                    <button
                        type="button"
                        class="btn btn-manual"
                        onclick="focusAWB()">

                        ⌨ Manual / Scanner

                    </button>

                    <div id="reader"></div>

                    <input
                        id="awbInput"
                        class="input"
                        type="text"
                        autocomplete="off"
                        placeholder="Scan AWB Number">

                    <input
                        id="orderInput"
                        class="input"
                        type="text"
                        autocomplete="off"
                        placeholder="Enter Order ID">

                    <div
                        id="resultCard"
                        class="result-card">
                    </div>

                    <div class="action-row">

                        <button
                            type="button"
                            class="btn btn-save"
                            onclick="saveEntry()">

                            Save & Next

                        </button>

                        <button
                            type="button"
                            class="btn btn-stop"
                            onclick="stopCamera()">

                            Stop

                        </button>

                    </div>

                </div>

            </div>

        </section>

        <!-- Right Panel -->

        <section class="panel">

            <div class="panel-header">
                🔍 Find Order
            </div>

            <div class="right-content">

                <div class="search-box">

                    <input
                        id="searchInput"
                        class="input"
                        type="text"
                        autocomplete="off"
                        placeholder="Search AWB / Order ID">

                    <button
                        type="button"
                        class="btn btn-camera small-btn"
                        onclick="searchOrder()">

                        Search Order

                    </button>

                    <div
                        id="searchResult"
                        class="search-result">

                    </div>

                </div>

            </div>

        </section>

    </main>

    <!-- Loading -->

    <div id="loadingOverlay">

        <div class="loader-box">

            Loading...

        </div>

    </div>

    <!-- Libraries -->

    <script defer src="https://unpkg.com/html5-qrcode"></script>

    <!-- Application JS -->

    <script defer src="js/api.js"></script>
    <script defer src="js/ui.js"></script>
    <script defer src="js/scanner.js"></script>
    <script defer src="js/tracking.js"></script>
    <script defer src="js/dashboard.js"></script>
    <script defer src="js/bulk.js"></script>

</body>

</html>
