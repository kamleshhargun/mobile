<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logistics Tracking & Inventory Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .tab-btn.active { border-bottom-color: #3b82f6; color: #3b82f6; font-weight: 600; }
  </style>
</head>
<body class="text-slate-800 antialiased">

  <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <div class="flex items-center gap-3">
          <i class="fa-solid fa-truck-fast text-blue-600 text-2xl"></i>
          <span class="text-xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">Logistics Hub</span>
        </div>
        <div class="flex items-center gap-2">
          <span id="connection-status" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-amber-100 text-amber-800">
            <i class="fa-solid fa-circle-notch fa-spin mr-1.5"></i> Connecting...
          </span>
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

    <section class="grid grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">
        <div class="flex justify-between items-start">
          <p class="text-sm font-medium text-slate-500">Today's Pickups</p>
          <span class="p-2 bg-blue-50 text-blue-600 rounded-lg text-xs font-semibold"><i class="fa-solid fa-arrow-up-from-bracket"></i></span>
        </div>
        <p id="stat-today-pickup" class="text-2xl font-bold mt-2 text-slate-900">0</p>
      </div>
      
      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">
        <div class="flex justify-between items-start">
          <p class="text-sm font-medium text-slate-500">Today's Returns</p>
          <span class="p-2 bg-rose-50 text-rose-600 rounded-lg text-xs font-semibold"><i class="fa-solid fa-rotate-left"></i></span>
        </div>
        <p id="stat-today-return" class="text-2xl font-bold mt-2 text-slate-900">0</p>
      </div>

      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">
        <div class="flex justify-between items-start">
          <p class="text-sm font-medium text-slate-500">Month's Pickups</p>
          <span class="p-2 bg-emerald-50 text-emerald-600 rounded-lg text-xs font-semibold"><i class="fa-solid fa-calendar-day"></i></span>
        </div>
        <p id="stat-month-pickup" class="text-2xl font-bold mt-2 text-slate-900">0</p>
      </div>

      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">
        <div class="flex justify-between items-start">
          <p class="text-sm font-medium text-slate-500">Month's Returns</p>
          <span class="p-2 bg-purple-50 text-purple-600 rounded-lg text-xs font-semibold"><i class="fa-solid fa-boxes-packing"></i></span>
        </div>
        <p id="stat-month-return" class="text-2xl font-bold mt-2 text-slate-900">0</p>
      </div>
    </section>

    <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs md:col-span-2">
        <h3 class="text-lg font-semibold mb-4 text-slate-900"><i class="fa-solid fa-magnifying-glass text-slate-400 mr-2"></i>Search Order or AWB</h3>
        <div class="flex gap-2">
          <input type="text" id="search-input" placeholder="Enter AWB Number or Order ID..." class="flex-1 min-w-0 block w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm">
          <button onclick="handleSearch()" class="inline-flex items-center px-4 py-2.5 border border-transparent text-sm font-medium rounded-xl text-white bg-blue-600 hover:bg-blue-700 shadow-xs cursor-pointer">Search</button>
        </div>
        <div id="search-result" class="mt-4 hidden p-4 bg-slate-50 rounded-xl border border-slate-100 text-sm space-y-2"></div>
      </div>

      <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs">
        <h3 class="text-lg font-semibold mb-4 text-slate-900"><i class="fa-solid fa-arrows-rotate text-slate-400 mr-2"></i>Single AWB Update</h3>
        <div class="space-y-3">
          <input type="text" id="update-awb-input" placeholder="AWB Number only..." class="block w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm">
          <button onclick="handleSingleUpdate()" class="w-full inline-flex justify-center items-center px-4 py-2.5 border border-transparent text-sm font-medium rounded-xl text-white bg-indigo-600 hover:bg-indigo-700 shadow-xs cursor-pointer">Update Live Status</button>
        </div>
      </div>
    </section>

    <section class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs">
      <h3 class="text-lg font-semibold mb-4 text-slate-900"><i class="fa-solid fa-layer-group text-slate-400 mr-2"></i>Bulk Update (By Date)</h3>
      <div class="grid grid-cols-1 sm:grid-cols-4 gap-3 items-end">
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Select Date</label>
          <input type="date" id="bulk-date" class="block w-full px-3 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Type</label>
          <select id="bulk-type" class="block w-full px-3 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm">
            <option value="Pickup">Pickup</option>
            <option value="Return">Return</option>
          </select>
        </div>
        <button onclick="checkBulkCounts()" class="inline-flex justify-center items-center px-4 py-2 border border-slate-300 font-medium rounded-xl text-slate-700 bg-white hover:bg-slate-50 text-sm cursor-pointer">Check Count</button>
        <button onclick="runBulkUpdate()" class="inline-flex justify-center items-center px-4 py-2 border border-transparent font-medium rounded-xl text-white bg-slate-900 hover:bg-slate-800 text-sm shadow-xs cursor-pointer">Run Bulk Process</button>
      </div>
      <div id="bulk-result" class="mt-4 hidden p-4 bg-slate-50 rounded-xl border border-slate-100 text-sm"></div>
    </section>

    <section class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
      <div class="border-b border-slate-200 bg-slate-50/50 px-4">
        <nav class="flex space-x-6" aria-label="Tabs">
          <button onclick="loadTab('today')" id="tab-today" class="tab-btn active py-4 px-1 border-b-2 border-transparent text-sm font-medium cursor-pointer">Today's Scans</button>
          <button onclick="loadTab('yesterday')" id="tab-yesterday" class="tab-btn py-4 px-1 border-b-2 border-transparent text-sm font-medium cursor-pointer">Yesterday's Scans</button>
          <button onclick="loadTab('total')" id="tab-total" class="tab-btn py-4 px-1 border-b-2 border-transparent text-sm font-medium cursor-pointer">Recent Records (Max 100)</button>
        </nav>
      </div>

      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-slate-200 text-left text-sm">
          <thead class="bg-slate-50 text-slate-500 uppercase text-xs font-semibold tracking-wider">
            <tr>
              <th class="px-6 py-3">Date</th>
              <th class="px-6 py-3">Type</th>
              <th class="px-6 py-3">AWB Number</th>
              <th class="px-6 py-3">Order ID</th>
              <th class="px-6 py-3">Courier</th>
              <th class="px-6 py-3">Status</th>
            </tr>
          </thead>
          <tbody id="table-body" class="divide-y divide-slate-200 bg-white text-slate-700">
            <tr>
              <td colspan="6" class="px-6 py-10 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Loading data...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-2 text-sm"></div>

  <script>
    // ⚠️ PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwzKW15XfTj3emaWH8MHe_sCvHGvskr9naPk71vDuQTWZUPOebetTVaruUTGbgjOW0_/exec"; 

    // Helper: Show Alert Toasts
    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      toast.className = `fixed bottom-5 right-5 z-50 transition-all duration-300 px-4 py-3 rounded-xl shadow-lg flex items-center gap-2 text-sm ${isError ? 'bg-rose-600 text-white' : 'bg-slate-900 text-white'}`;
      toast.innerHTML = `<i class="fa-solid ${isError ? 'fa-circle-exclamation' : 'fa-circle-check'}"></i> ${message}`;
      toast.style.transform = 'translateY(0)';
      toast.style.opacity = '1';
      setTimeout(() => {
        toast.style.transform = 'translateY(20px)';
        toast.style.opacity = '0';
      }, 4000);
    }

    // Connect & Run Initial API Calls
    window.addEventListener('DOMContentLoaded', () => {
      if(WEB_APP_URL.includes("YOUR_APPS_SCRIPT_WEB_APP_URL_HERE")) {
        showToast("Please configure your Apps Script Web App URL first!", true);
        return;
      }
      checkHealth();
      fetchDashboardCounts();
      loadTab('today');
    });

    // API Healthcheck
    async function checkHealth() {
      try {
        const response = await fetch(`${WEB_APP_URL}?action=healthCheck`);
        const data = await response.json();
        if(data.success) {
          const indicator = document.getElementById('connection-status');
          indicator.className = "inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800";
          indicator.innerHTML = `<i class="fa-solid fa-circle text-[8px] mr-1.5 animate-pulse"></i> Live Connected`;
        }
      } catch (err) {
        const indicator = document.getElementById('connection-status');
        indicator.className = "inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-rose-100 text-rose-800";
        indicator.innerHTML = `<i class="fa-solid fa-circle mr-1.5"></i> Connection Error`;
      }
    }

    // Fetch Analytics Counts
    async function fetchDashboardCounts() {
      try {
        const res = await fetch(`${WEB_APP_URL}?action=getDashboardCounts`);
        const data = await res.json();
        if(data.success) {
          document.getElementById('stat-today-pickup').innerText = data.todayPickup || 0;
          document.getElementById('stat-today-return').innerText = data.todayReturn || 0;
          document.getElementById('stat-month-pickup').innerText = data.monthPickup || 0;
          document.getElementById('stat-month-return').innerText = data.monthReturn || 0;
        }
      } catch(e) { console.error("Error fetching stats Dashboard counts", e); }
    }

    // Handle Search Bar Request
    async function handleSearch() {
      const kw = document.getElementById('search-input').value.trim();
      if(!kw) return showToast("Please enter an AWB number or Order ID", true);
      
      const resultDiv = document.getElementById('search-result');
      resultDiv.classList.remove('hidden');
      resultDiv.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i>Searching...`;

      try {
        const res = await fetch(`${WEB_APP_URL}?action=searchOrder&keyword=${encodeURIComponent(kw)}`);
        const data = await res.json();
        if(data.success) {
          resultDiv.innerHTML = `
            <div class="grid grid-cols-2 gap-2 text-xs sm:text-sm">
              <div><strong>Date:</strong> ${data.date}</div>
              <div><strong>Type:</strong> ${data.type}</div>
              <div><strong>AWB:</strong> ${data.awb}</div>
              <div><strong>Order ID:</strong> ${data.orderId}</div>
              <div><strong>Courier:</strong> ${data.courier || 'N/A'}</div>
              <div><strong>Status:</strong> <span class="px-2 py-0.5 rounded-md bg-blue-50 text-blue-700 font-semibold text-xs">${data.status || 'Unknown'}</span></div>
              <div class="col-span-2"><strong>Customer:</strong> ${data.customer || 'N/A'} (${data.city || ''}, ${data.state || ''})</div>
              <div class="col-span-2 text-slate-400 text-xs">Last Updated: ${data.updatedAt || 'N/A'}</div>
            </div>
          `;
        } else {
          resultDiv.innerHTML = `<p class="text-rose-600 font-medium"><i class="fa-solid fa-triangle-exclamation mr-1"></i> No record found: ${data.message}</p>`;
        }
      } catch (err) {
        resultDiv.innerHTML = `<p class="text-rose-600 font-medium">Error fetching search data.</p>`;
      }
    }

    // Handle Live Status Sync For Single AWB
    async function handleSingleUpdate() {
      const awb = document.getElementById('update-awb-input').value.trim();
      if(!awb) return showToast("Please enter an AWB number", true);

      showToast("Syncing live status from courier API...");
      try {
        const res = await fetch(`${WEB_APP_URL}?action=updateSingleAWB&awb=${encodeURIComponent(awb)}`);
        const data = await res.json();
        if(data.success) {
          if(data.skipped) {
            showToast(`Skipped: Status already locked (${data.reason})`, true);
          } else {
            showToast("Sheet and status updated successfully!");
            fetchDashboardCounts();
          }
        } else {
          showToast(`Update Failed: ${data.message}`, true);
        }
      } catch (err) { showToast("Server response error", true); }
    }

    // Format HTML Input Date to dd/mm/yyyy
    function parseInputDate(dateStr) {
      if(!dateStr) return "";
      const [year, month, day] = dateStr.split('-');
      return `${day}/${month}/${year}`;
    }

    // Check Bulk Entry Counts
    async function checkBulkCounts() {
      const rawDate = document.getElementById('bulk-date').value;
      if(!rawDate) return showToast("Please select a date", true);
      const formattedDate = parseInputDate(rawDate);

      const resDiv = document.getElementById('bulk-result');
      resDiv.classList.remove('hidden');
      resDiv.innerHTML = "Checking database...";

      try {
        const res = await fetch(`${WEB_APP_URL}?action=getBulkCounts&date=${encodeURIComponent(formattedDate)}`);
        const data = await res.json();
        if(data.success) {
          resDiv.innerHTML = `📅 For <strong>${formattedDate}</strong>, found total <strong>Pickups: ${data.pickup}</strong> and <strong>Returns: ${data.return}</strong> records.`;
        }
      } catch(e) { resDiv.innerHTML = "Unable to fetch count parameters."; }
    }

    // Trigger Bulk Update API
    async function runBulkUpdate() {
      const rawDate = document.getElementById('bulk-date').value;
      const type = document.getElementById('bulk-type').value;
      if(!rawDate) return showToast("Please select a date", true);
      const formattedDate = parseInputDate(rawDate);

      if(!confirm(`Are you sure you want to bulk update all ${type} records for ${formattedDate}? This might take a few moments.`)) return;

      const resDiv = document.getElementById('bulk-result');
      resDiv.classList.remove('hidden');
      resDiv.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Bulk processing in progress... Please do not close this window.`;

      try {
        const res = await fetch(`${WEB_APP_URL}?action=bulkUpdateByDate&date=${encodeURIComponent(formattedDate)}&type=${encodeURIComponent(type)}`);
        const data = await res.json();
        if(data.success) {
          resDiv.innerHTML = `🟢 <strong>Bulk Update Complete!</strong><br>Updated: ${data.updated} | Skipped (Locked): ${data.skipped} | Failed: ${data.failed}`;
          showToast("Bulk sync finished successfully");
          fetchDashboardCounts();
        }
      } catch(e) { resDiv.innerHTML = "Something went wrong during bulk update process."; }
    }

    // Tab switcher to dynamic tables
    async function loadTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`tab-${tabName}`).classList.add('active');

      const tbody = document.getElementById('table-body');
      tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-10 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Loading scans...</td></tr>`;

      let action = "getTodayRecords";
      if(tabName === "yesterday") action = "getYesterdayRecords";
      if(tabName === "total") action = "getRecentRecords";

      try {
        const res = await fetch(`${WEB_APP_URL}?action=${action}`);
        const data = await res.json();
        
        let rows = data.rows || [];
        if(!data.success || rows.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-10 text-center text-slate-400">No records available for this filter.</td></tr>`;
          return;
        }

        tbody.innerHTML = rows.map(row => `
          <tr class="hover:bg-slate-50 transition-colors">
            <td class="px-6 py-4 whitespace-nowrap text-slate-500 text-xs">${formatRowDate(row.date)}</td>
            <td class="px-6 py-4 whitespace-nowrap">
              <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium ${row.type === 'Pickup' ? 'bg-blue-50 text-blue-700' : 'bg-rose-50 text-rose-700'}">${row.type || 'N/A'}</span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap font-medium text-slate-900">${row.awb || 'N/A'}</td>
            <td class="px-6 py-4 whitespace-nowrap text-slate-600">${row.orderId || 'N/A'}</td>
            <td class="px-6 py-4 whitespace-nowrap text-slate-500">${row.courier || 'N/A'}</td>
            <td class="px-6 py-4 whitespace-nowrap">
              <span class="px-2 py-1 rounded-lg text-xs font-medium bg-slate-100 text-slate-800">${row.status || 'Pending'}</span>
            </td>
          </tr>
        `).join('');

      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-10 text-center text-rose-600 font-medium">Error loading records from database.</td></tr>`;
      }
    }

    // Format JSON Timestamp if any
    function formatRowDate(d) {
      if(!d) return "";
      if(d.includes && d.includes("T")) {
        return d.split("T")[0];
      }
      return d;
    }
  </script>
</body>
</html>
