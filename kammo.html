<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Pickup Return Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
height:100vh;
overflow:hidden;
}

.container{
height:100vh;
display:flex;
flex-direction:column;
padding:10px;
gap:10px;
}

.header{
display:flex;
gap:10px;
}

.type-btn{
flex:1;
height:50px;
border:none;
border-radius:12px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.active{
background:#111;
color:#fff;
}

.inactive{
background:#e7e7e7;
color:#111;
}

.counts{
display:flex;
gap:10px;
}

.count-card{
flex:1;
background:#fff;
padding:12px;
border-radius:12px;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.camera-section{
height:320px;
background:#000;
border-radius:16px;
overflow:hidden;
position:relative;
flex-shrink:0;
}

#reader{
width:100%;
height:100%;
}

.scan-overlay{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:260px;
height:120px;
border:3px solid #00ff66;
border-radius:12px;
pointer-events:none;
}

.controls{
display:flex;
gap:10px;
}

.controls button{
flex:1;
height:45px;
border:none;
border-radius:12px;
font-weight:bold;
cursor:pointer;
}

.flash{
background:#111;
color:#fff;
}

.clear{
background:#e74c3c;
color:#fff;
}

.details{
background:#fff;
padding:15px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.row{
margin-bottom:8px;
font-size:14px;
}

.label{
font-weight:bold;
}

.save-btn{
width:100%;
height:50px;
margin-top:10px;
border:none;
background:#16a34a;
color:#fff;
font-size:16px;
font-weight:bold;
border-radius:12px;
cursor:pointer;
}

.manual{
display:flex;
gap:10px;
}

.manual input{
flex:1;
height:50px;
border:1px solid #ddd;
border-radius:12px;
padding:0 15px;
font-size:15px;
}

.manual button{
width:120px;
border:none;
background:#111;
color:#fff;
border-radius:12px;
font-weight:bold;
}

.status{
text-align:center;
font-size:14px;
font-weight:bold;
padding:8px;
}

.success{
color:#16a34a;
}

.error{
color:#dc2626;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<button
id="pickupBtn"
class="type-btn active"
onclick="setType('Pickup')">
Pickup </button>

<button
id="returnBtn"
class="type-btn inactive"
onclick="setType('Return')">
Return </button>

</div>

<div class="counts">

<div class="count-card">
Pickup
<br>
<b id="pickupCount">0</b>
</div>

<div class="count-card">
Return
<br>
<b id="returnCount">0</b>
</div>

</div>

<div class="camera-section">

<div id="reader"></div>

<div class="scan-overlay"></div>

</div>

<div class="controls">

<button
class="flash"
onclick="toggleFlash()">
🔦 Flash </button>

<button
class="clear"
onclick="clearData()">
Clear </button>

</div>

<div class="details">

<div class="row">
<span class="label">AWB:</span>
<span id="awb">-</span>
</div>

<div class="row">
<span class="label">Order ID:</span>
<span id="orderId">-</span>
</div>

<div class="row">
<span class="label">Courier:</span>
<span id="courier">-</span>
</div>

<button
class="save-btn"
onclick="saveShipment()">
SAVE </button>

</div>

<div class="manual">

<input
id="manualAwb"
placeholder="Enter AWB">

<button
onclick="manualSearch()">
SEARCH </button>

</div>

<div
id="status"
class="status">
Ready
</div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwPXBYMpLUYKspb9gZAb9ZRy6_qA9hwgvdHZ9yBHD-5qxhHvZao5JKM-TflgG2g1k4VHA/exec";

let scanType = "Pickup";

let flashOn = false;

let html5QrCode;

let currentData = null;

function setType(type){

scanType = type;

pickupBtn.className =
type==="Pickup"
?
"type-btn active"
:
"type-btn inactive";

returnBtn.className =
type==="Return"
?
"type-btn active"
:
"type-btn inactive";

}

async function loadCounts(){

try{

const res =
await fetch(
API_URL +
"?action=counts"
);

const data =
await res.json();

if(data.success){

pickupCount.innerText =
data.pickup;

returnCount.innerText =
data.return;

}

}catch(err){}

}

async function searchAwb(awb){

status.innerHTML =
"Searching...";

try{

const res =
await fetch(
API_URL +
"?action=search&awb="
+
encodeURIComponent(awb)
);

const data =
await res.json();

if(!data.success){

status.className =
"status error";

status.innerHTML =
data.message;

return;

}

currentData = data;

document.getElementById(
"awb"
).innerText =
data.awb;

document.getElementById(
"orderId"
).innerText =
data.orderId;

document.getElementById(
"courier"
).innerText =
data.courier;

status.className =
"status success";

status.innerHTML =
"Shipment Found";

}catch(err){

status.className =
"status error";

status.innerHTML =
"Network Error";

}

}

async function saveShipment(){

if(!currentData){

return;

}

try{

const res =
await fetch(
API_URL,
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({

action:"save",

data:{

type:scanType,

awb:
currentData.awb,

orderId:
currentData.orderId,

courier:
currentData.courier

}

})
}
);

const data =
await res.json();

if(data.success){

status.className =
"status success";

status.innerHTML =
"Saved Successfully";

loadCounts();

}else{

status.className =
"status error";

status.innerHTML =
data.message;

}

}catch(err){

status.className =
"status error";

status.innerHTML =
"Save Failed";

}

}

function clearData(){

currentData = null;

awb.innerText="-";
orderId.innerText="-";
courier.innerText="-";

status.className =
"status";

status.innerHTML =
"Ready";

}

function manualSearch(){

const awb =
manualAwb.value.trim();

if(!awb){

alert(
"Enter AWB"
);

return;

}

searchAwb(awb);

}

function beep(){

try{

const ctx =
new(
window.AudioContext ||
window.webkitAudioContext
)();

const osc =
ctx.createOscillator();

osc.connect(
ctx.destination
);

osc.frequency.value =
900;

osc.start();

setTimeout(()=>{
osc.stop();
},150);

}catch(err){}

}

function vibrate(){

if(
navigator.vibrate
){

navigator.vibrate(
200
);

}

}

function onScanSuccess(code){

beep();

vibrate();

searchAwb(code);

}

async function startScanner(){

const cameras =
await Html5Qrcode.getCameras();

if(
!cameras.length
){
return;
}

let cameraId =
cameras[0].id;

for(
let cam of cameras
){

const name =
cam.label.toLowerCase();

if(
name.includes("back") ||
name.includes("rear")
){

cameraId =
cam.id;

break;

}

}

html5QrCode =
new Html5Qrcode(
"reader"
);

await html5QrCode.start(

cameraId,

{

fps:10,

aspectRatio:1.777,

qrbox:{
width:260,
height:120
}

},

onScanSuccess

);

}

async function toggleFlash(){

try{

flashOn =
!flashOn;

await html5QrCode
.applyVideoConstraints({

advanced:[
{
torch:flashOn
}
]

});

}catch(err){

alert(
"Flash Not Supported"
);

}

}

loadCounts();

startScanner();

</script>

</body>

</html>
