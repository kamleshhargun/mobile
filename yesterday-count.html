<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Yesterday Count</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,Arial,sans-serif;
}

body{
background:#f0fdf4;
padding:20px;
}

.container{
max-width:1400px;
margin:auto;
}

.title{
text-align:center;
font-size:28px;
font-weight:700;
color:#166534;
margin-bottom:20px;
}

.count-row{
display:flex;
gap:15px;
flex-wrap:wrap;
margin-bottom:20px;
}

.count-card{
flex:1;
min-width:220px;
background:#fff;
padding:20px;
border-radius:16px;
border:1px solid #d1fae5;
text-align:center;
box-shadow:0 5px 15px rgba(0,0,0,.05);
}

.count-card h2{
font-size:34px;
margin-top:10px;
color:#166534;
}

.button-row{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:20px;
}

.btn{
border:none;
padding:12px 18px;
border-radius:12px;
font-size:15px;
font-weight:600;
cursor:pointer;
}

.btn-pickup{
background:#10b981;
color:#fff;
}

.btn-return{
background:#ef4444;
color:#fff;
}

.btn-clear{
background:#374151;
color:#fff;
}

.table-wrap{
display:none;
overflow:auto;
background:#fff;
border-radius:16px;
border:1px solid #d1fae5;
padding:10px;
}

table{
width:100%;
border-collapse:collapse;
font-size:13px;
}

th{
background:#10b981;
color:white;
padding:10px;
white-space:nowrap;
}

td{
padding:8px;
border-bottom:1px solid #e5e7eb;
white-space:nowrap;
}

.loading{
text-align:center;
padding:30px;
font-weight:700;
}

@media(max-width:700px){

.count-row{
flex-direction:column;
}

.button-row{
flex-direction:column;
}

.btn{
width:100%;
}

}

</style>

</head>

<body>

<div class="container">

<div class="title">
Yesterday Count
</div>

<div class="count-row">

<div class="count-card">

<div>Pickup</div>

<h2 id="pickupCount">
0
</h2>

</div>

<div class="count-card">

<div>Return</div>

<h2 id="returnCount">
0
</h2>

</div>

</div>

<div class="button-row">

<button
class="btn btn-pickup"
onclick="loadPickup()">

Pickup Records

</button>

<button
class="btn btn-return"
onclick="loadReturn()">

Return Records

</button>

<button
class="btn btn-clear"
onclick="clearTable()">

Clear

</button>

</div>

<div
id="tableWrap"
class="table-wrap">

<div
id="tableArea"
class="loading">

Loading...

</div>

</div>

</div>
<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxE364kp1NqAiMCM-Pj2QxyoMMnCTZxLDr5yq6QAxUNZ0saq-SDIUMlBCftWXOUtDbu/exec";

let allRows = [];

/* ==========================
LOAD COUNTS
========================== */

async function loadCounts(){

 try{

   const response =
   await fetch(

   API_URL +
   "?action=getDashboardCounts"

   );

   const data =
   await response.json();

   document
   .getElementById(
   "pickupCount"
   )
   .innerText =
   data.yesterdayPickup || 0;

   document
   .getElementById(
   "returnCount"
   )
   .innerText =
   data.yesterdayReturn || 0;

 }catch(err){

   console.log(err);

 }

}

/* ==========================
LOAD TODAY RECORDS
========================== */

async function loadRecords(){

 try{

   const response =
   await fetch(

   API_URL +
   "?action=getYesterdayRecords"

   );

   const data =
   await response.json();

   allRows =
   data.rows || [];

 }catch(err){

   console.log(err);

 }

}

/* ==========================
PICKUP
========================== */

function loadPickup(){

 const rows =

 allRows.filter(

 r => r.type === "Pickup"

 );

 renderTable(rows);

}

/* ==========================
RETURN
========================== */

function loadReturn(){

 const rows =

 allRows.filter(

 r => r.type === "Return"

 );

 renderTable(rows);

}

/* ==========================
CLEAR
========================== */

function clearTable(){

 document
 .getElementById(
 "tableWrap"
 )
 .style.display =
 "none";

}

/* ==========================
TABLE
========================== */

function renderTable(rows){

 const wrap =
 document.getElementById(
 "tableWrap"
 );

 const box =
 document.getElementById(
 "tableArea"
 );

 wrap.style.display =
 "block";

 if(rows.length === 0){

   box.innerHTML =
   "<div class='loading'>No Records Found</div>";

   return;

 }

 let html = `

 <table>

 <thead>

 <tr>

 <th>Date</th>
 <th>Type</th>
 <th>AWB</th>
 <th>Order ID</th>
 <th>Courier</th>
 <th>Status</th>

 </tr>

 </thead>

 <tbody>

 `;

 rows.forEach(r=>{

 html += `

 <tr>

 <td>${r.date || ""}</td>

 <td>${r.type || ""}</td>

 <td>${r.awb || ""}</td>

 <td>${r.orderId || ""}</td>

 <td>${r.courier || ""}</td>

 <td>${r.status || ""}</td>

 </tr>

 `;

 });

 html += `

 </tbody>

 </table>

 `;

 box.innerHTML =
 html;

}

/* ==========================
INIT
========================== */

window.onload = async function(){

 await loadCounts();

 await loadRecords();

};

</script>

</body>
</html>
