<!DOCTYPE html>
<html>
<head>

<title>Delhivery AWB Saver</title>

<style>

body{
font-family:Arial;
padding:40px;
max-width:500px;
margin:auto;
}

h2{
text-align:center;
}

input{
width:100%;
padding:12px;
font-size:16px;
margin-top:10px;
}

button{
width:100%;
padding:12px;
font-size:16px;
margin-top:15px;
cursor:pointer;
}

#message{
margin-top:20px;
font-weight:bold;
}

</style>

</head>


<body>

<h2>Delhivery AWB Tracker</h2>


<input 
type="text"
id="awb"
placeholder="Enter AWB Number">


<button onclick="submitAWB()">
Fetch & Save Data
</button>


<div id="message"></div>


<script>


// Replace with your Apps Script URL

const API_URL =
"https://script.google.com/macros/s/AKfycbwi5ASrIuvWEO3rNIWFkCwpM6Wl2c4HpCZSfF8e2XsW1AswuEUKWtvHLdDzJbenjV6W/exec";



async function submitAWB(){


let awb =
document
.getElementById("awb")
.value
.trim();



if(!awb){

alert("Please enter AWB");

return;

}


let msg =
document.getElementById("message");


msg.innerHTML = "Fetching Data...";



try{


let response =
await fetch(API_URL,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
awb:awb
})

});



let result =
await response.json();



if(result.success){

msg.innerHTML =
"✅ " + result.message;

}else{


msg.innerHTML =
"❌ " + result.message;


}



}catch(error){


msg.innerHTML =
"❌ Error: " + error.message;


}



}


</script>


</body>

</html>
