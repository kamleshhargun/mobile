<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Logistics Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        .active-btn {
            background-color: #1D4ED8 !important; 
            color: white !important;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans p-4 flex flex-col items-center">

    <audio id="sound-find" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-600.wav" preload="auto"></audio>
    <audio id="sound-error" src="https://assets.mixkit.co/active_storage/sfx/2573/2573-600.wav" preload="auto"></audio>
    <audio id="sound-duplicate" src="https://assets.mixkit.co/active_storage/sfx/950/950-600.wav" preload="auto"></audio>
    <audio id="sound-save" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-600.wav" preload="auto"></audio>

    <div class="w-full max-w-md bg-white rounded-xl shadow-md p-6 mt-4 relative">
        
        <div class="absolute top-4 right-4 flex items-center gap-1.5 bg-gray-50 px-2 py-1 rounded-full border text-xs">
            <span id="sync-dot" class="w-2.5 h-2.5 bg-red-500 rounded-full animate-pulse"></span>
            <span id="sync-text" class="font-medium text-gray-600">Connecting...</span>
        </div>

        <h2 class="text-2xl font-bold text-gray-800 mb-6 mt-2">Logistics System</h2>

        <div class="flex gap-4 mb-6">
            <button id="btn-pickup" onclick="setMode('Pickup')" class="w-1/2 py-3 bg-gray-200 text-gray-700 font-semibold rounded-lg transition-all active-btn shadow">
                📦 Pickup
            </button>
            <button id="btn-return" onclick="setMode('Return')" class="w-1/2 py-3 bg-gray-200 text-gray-700 font-semibold rounded-lg transition-all shadow">
                🔄 Return
            </button>
        </div>

        <div class="flex gap-4 mb-6">
            <button onclick="setInputMethod('camera')" class="w-1/2 py-2 bg-emerald-600 text-white font-medium rounded-md hover:bg-emerald-700">
                📷 Camera Scan
            </button>
            <button onclick="setInputMethod('manual')" class="w-1/2 py-2 bg-indigo-600 text-white font-medium rounded-md hover:bg-indigo-700">
                ✍️ Manual Entry
            </button>
        </div>

        <div id="camera-section" class="hidden mb-6 border-2 border-dashed border-gray-300 rounded-lg p-2 bg-black">
            <div id="reader" class="w-full"></div>
        </div>

        <div id="manual-section" class="hidden mb-6 bg-gray-50 p-4 rounded-lg border border-gray-200">
            <label class="block text-sm font-medium text-gray-700 mb-1">Enter AWB Number:</label>
            <div class="flex gap-2">
                <input type="text" id="manual-awb" class="w-full border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. 123456789">
                <button onclick="processManualEntry()" class="bg-gray-800 text-white px-4 py-2 rounded-md hover:bg-gray-900">Fetch</button>
            </div>
        </div>

        <div id="preview-section" class="hidden mb-6 bg-blue-50 p-4 rounded-lg border border-blue-200 shadow-inner">
            <h3 class="text-sm font-bold text-blue-800 uppercase tracking-wider mb-3">📋 Data Preview</h3>
            <div class="space-y-1 text-sm text-gray-700 mb-4">
                <p><strong>Date:</strong> <span id="prev-date"></span></p>
                <p><strong>Type:</strong> <span id="prev-type"></span></p>
                <p><strong>AWB Number:</strong> <span id="prev-awb" class="font-mono text-blue-700 font-bold"></span></p>
                <p><strong>Order ID:</strong> <span id="prev-order"></span></p>
                <p><strong>Status:</strong> <span id="prev-status" class="font-semibold"></span></p>
            </div>
            <div class="flex gap-3">
                <button onclick="saveDataToSheet()" class="w-2/3 bg-green-600 text-white font-bold py-2 rounded shadow hover:bg-green-700">
                    💾 Save to Sheet
                </button>
                <button onclick="cancelPreview()" class="w-1/3 bg-red-100 text-red-700 font-medium py-2 rounded border border-red-200 hover:bg-red-200">
                    Cancel
                </button>
            </div>
        </div>

        <div id="status-box" class="hidden p-4 rounded-lg text-sm font-medium text-center mb-4"></div>
        
        <div class="border-t pt-4">
            <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider block mb-2">Live Logs:</span>
            <div id="logs" class="text-xs bg-gray-900 text-green-400 p-3 rounded-md h-24 overflow-y-auto font-mono">
                System starting...
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz5AwSN8Cuqa8ZAlekLHPbKM68Ln6IwEkuSzvrCzVrm2TO3dGAPJok3cpwJmO7Z60FQ/exec"; // Naya Apps Script Web App URL yahan dalein
        
        let currentMode = 'Pickup'; 
        let html5QrcodeScanner = null;
        let currentDataPayload = null;

        function playSound(id) {
            const sound = document.getElementById(id);
            if(sound) {
                sound.currentTime = 0;
                sound.play().catch(e => console.log("Sound error delayed"));
            }
        }

        function checkSheetConnection() {
            fetch(`${WEB_APP_URL}?action=ping`)
            .then(res => res.json())
            .then(data => {
                if(data.status === 'online') {
                    document.getElementById('sync-dot').className = "w-2.5 h-2.5 bg-green-500 rounded-full";
                    document.getElementById('sync-text').innerText = "Sheet Linked";
                }
            })
            .catch(() => {
                document.getElementById('sync-dot').className = "w-2.5 h-2.5 bg-red-500 rounded-full";
                document.getElementById('sync-text').innerText = "No Link";
            });
        }

        window.onload = () => {
            checkSheetConnection();
            setInterval(checkSheetConnection, 20000); 
            log("System ready... Mode: Pickup");
        };

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btn-pickup').classList.toggle('active-btn', mode === 'Pickup');
            document.getElementById('btn-return').classList.toggle('active-btn', mode === 'Return');
            log(`Mode switched to: ${mode}`);
            hidePreview();
        }

        function setInputMethod(method) {
            hidePreview();
            if (method === 'camera') {
                document.getElementById('camera-section').classList.remove('hidden');
                document.getElementById('manual-section').classList.add('hidden');
                startCamera();
            } else {
                document.getElementById('manual-section').classList.remove('hidden');
                document.getElementById('camera-section').classList.add('hidden');
                stopCamera();
            }
        }

        function log(message) {
            const logsDiv = document.getElementById('logs');
            logsDiv.innerHTML += `<br>[${new Date().toLocaleTimeString()}] ${message}`;
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        function showStatus(text, type='success') {
            const box = document.getElementById('status-box');
            box.className = "p-4 rounded-lg text-sm font-medium text-center mb-4";
            if (type === 'error') box.classList.add('bg-red-100', 'text-red-700');
            else if (type === 'warn') box.classList.add('bg-yellow-100', 'text-yellow-700');
            else box.classList.add('bg-green-100', 'text-green-700');
            box.innerText = text;
            box.classList.remove('hidden');
        }

        function getFormattedDate() {
            const today = new Date();
            const dd = String(today.getDate()).padStart(2, '0');
            const mm = String(today.getMonth() + 1).padStart(2, '0'); 
            const yyyy = today.getFullYear();
            return `${dd}-${mm}-${yyyy}`;
        }

        function startCamera() {
            if (html5QrcodeScanner) stopCamera();
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 150} }, false);
            html5QrcodeScanner.render((decodedText) => {
                log(`Scanned AWB: ${decodedText}`);
                stopCamera();
                initiateWorkflow(decodedText.trim());
            }, (error) => {});
        }

        function stopCamera() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.clear().catch(err => console.log(err));
                html5QrcodeScanner = null;
            }
        }

        function processManualEntry() {
            const awbInput = document.getElementById('manual-awb');
            const awbValue = awbInput.value.trim();
            if (!awbValue) {
                showStatus("Please enter a valid AWB number", 'error');
                playSound('sound-error');
                return;
            }
            log(`Manual AWB Entered: ${awbValue}`);
            initiateWorkflow(awbValue);
            awbInput.value = ''; 
        }

        function initiateWorkflow(awb) {
            showStatus("Checking backend and active logistics databases...", 'warn');
            hidePreview();
            
            // Step 1: Duplicate check pehle karein
            fetch(`${WEB_APP_URL}?action=checkDuplicate&awb=${awb}&type=${currentMode}`)
            .then(res => res.json())
            .then(dupRes => {
                if (dupRes.isDuplicate) {
                    showStatus(`Duplicate Detected: AWB already exists in '${currentMode}'!`, 'error');
                    playSound('sound-duplicate');
                    log(`Block: Duplicate AWB entry.`);
                    return;
                }

                // Step 2: Clear duplicate, fetch API
                log("No duplicate found. Accessing Courier servers via cloud API...");
                fetch(`${WEB_APP_URL}?action=fetchData&awb=${awb}`)
                .then(res => res.json())
                .then(apiRes => {
                    
                    currentDataPayload = {
                        date: getFormattedDate(),
                        type: currentMode,
                        awb: awb,
                        orderId: apiRes.orderId || "N/A",
                        status: apiRes.status || "Not Found / System Bypass"
                    };
                    
                    document.getElementById('prev-date').innerText = currentDataPayload.date;
                    document.getElementById('prev-type').innerText = currentDataPayload.type;
                    document.getElementById('prev-awb').innerText = currentDataPayload.awb;
                    document.getElementById('prev-order').innerText = currentDataPayload.orderId;
                    document.getElementById('prev-status').innerText = currentDataPayload.status;
                    
                    document.getElementById('preview-section').classList.remove('hidden');

                    if (apiRes.apiFound) {
                        playSound('sound-find');
                        showStatus("Data successfully matched with Logistics!", 'success');
                        log("Logistics tracking parsed successfully.");
                    } else {
                        // Sound error play hoga alert ke liye lekin workflow aage badhega!
                        playSound('sound-error');
                        showStatus("AWB not active on Courier API yet. Preview generated to force save.", 'warn');
                        log("Warning: API data missing, bypass active.");
                    }
                });
            })
            .catch(err => {
                showStatus("Execution failure. Please check Apps Script Deployment URL.", 'error');
                playSound('sound-error');
                log(`Process Error: ${err}`);
            });
        }

        function saveDataToSheet() {
            if (!currentDataPayload) return;
            showStatus("Writing row data inside Google Sheet...", 'warn');

            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors", 
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(currentDataPayload)
            })
            .then(() => {
                playSound('sound-save');
                showStatus(`Successfully written row for AWB: ${currentDataPayload.awb}!`, 'success');
                log(`Logged row entry inside spreadsheet.`);
                hidePreview();
            })
            .catch(err => {
                showStatus("Failed to submit row data.", 'error');
                playSound('sound-error');
            });
        }

        function cancelPreview() {
            hidePreview();
            showStatus("Operation cancelled.");
        }

        function hidePreview() {
            document.getElementById('preview-section').classList.add('hidden');
            currentDataPayload = null;
        }
    </script>
</body>
</html>
